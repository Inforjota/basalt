# Arranque do zero (na pasta docker/; a imagem corre como o utilizador 1000 e precisa de um basalt.toml antes do `up`):
#   mkdir -p dados && sudo chown 1000:1000 dados
#   docker compose run --rm basalt iniciar --dados /dados --email tu@exemplo.pt --modo senha --escutar 0.0.0.0   (pede a senha)
#   docker compose up -d        → http://127.0.0.1:8121
# O `iniciar` cria /dados/basalt.toml (BASALT_CONFIG já aponta para lá). Na rede, o login é sempre obrigatório.
services:
  basalt:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: basalt:local
    container_name: basalt
    restart: unless-stopped
    ports:
      - "127.0.0.1:8121:8121"        # só esta máquina; para expor, põe um proxy com TLS à frente (ver docs/INSTALAR.md)
    volumes:
      - ./dados:/dados                # notas, cópia editável, índice, sessões, basalt.toml — TUDO fica aqui
    environment:
      - TZ=Europe/Lisbon
      # IA (opcional): chave por variável, nunca no toml.  ex.: - BASALT_IA_CHAVE=${BASALT_IA_CHAVE}
    # Com o Ollama na mesma máquina (embeddings/chat locais): descomenta e aponta o basalt.toml a http://ollama:11434/v1
    # depends_on: [ollama]
  # ollama:
  #   image: ollama/ollama
  #   volumes: [ollama:/root/.ollama]
# volumes:
#   ollama: {}

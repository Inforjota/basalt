<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Basalt</title>
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="theme-color" content="#171a21">
<style>
:root{
  --bg:#0f1115; --bg-elev:#171a21; --bg-elev2:#1e222b; --bg-elev3:#262b36;
  --text:#e8eaed; --text-dim:#9aa2af; --border:#2a2f3a;
  --accent:#6ea8fe; --accent-strong:#4c8dff; --accent-text:#04121f;
  --danger:#ff6b6b; --danger-bg:#3a1414; --success:#4ade80; --warning:#fbbf24;
  --radius:10px; --radius-sm:6px;
  --shadow:0 6px 24px rgba(0,0,0,.35);
  --tag-user:#60a5fa; --tag-feedback:#f472b6; --tag-project:#4ade80;
  --tag-reference:#fbbf24; --tag-outros:#9aa2af;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
:root[data-theme="light"]{
  --bg:#f5f6f8; --bg-elev:#ffffff; --bg-elev2:#eef0f3; --bg-elev3:#e4e7eb;
  --text:#161a20; --text-dim:#5b6270; --border:#dfe3e8;
  --accent:#2563eb; --accent-strong:#1d4ed8; --accent-text:#ffffff;
  --danger:#dc2626; --danger-bg:#fde8e8; --success:#16a34a; --warning:#b45309;
  --shadow:0 6px 24px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
html,body{height:100%}
html{overflow-x:hidden}
body{
  margin:0; overflow-x:hidden;
  background:var(--bg); color:var(--text); font-family:var(--font);
  font-size:16px; line-height:1.55;
  display:flex; flex-direction:column; min-height:100vh;
}
a{color:var(--accent)}
button,input,select,textarea{font-family:inherit; font-size:inherit; color:inherit}
h1,h2,h3{line-height:1.25; margin:0 0 .5em}
ul,ol{margin:.4em 0; padding-left:1.4em}
.hidden{display:none !important}

/* ---------- topbar (com navegação embutida) ---------- */
#topbar{
  position:sticky; top:0; z-index:40;
  background:var(--bg-elev); border-bottom:1px solid var(--border);
  padding:8px 16px; padding-top:calc(8px + env(safe-area-inset-top));
}
.topbar-inner{
  display:flex; align-items:center; gap:10px; width:100%; position:relative;
}
.brand{
  font-weight:700; font-size:1.1rem; color:var(--text); text-decoration:none;
  flex-shrink:0; display:flex; align-items:center; gap:6px;
}
#topnav{display:none}
@media (min-width:721px){
  #topnav{display:flex; align-items:center; gap:2px; flex-shrink:0}
}
#topnav .nav-link{
  display:flex; align-items:center; gap:6px; padding:8px 10px; border-radius:var(--radius-sm);
  color:var(--text-dim); text-decoration:none; white-space:nowrap; min-height:36px; font-size:.86rem;
}
#topnav .nav-link.active,#topnav .nav-link:hover{background:var(--bg-elev2); color:var(--text)}
@media (max-width:1100px){
  #topnav .nav-label{display:none}
  #topnav .nav-link{padding:8px; min-width:36px; justify-content:center}
}
.cmd-wrap{flex:1; min-width:0; position:relative}
#cmd-input{
  width:100%; padding:11px 14px; border-radius:999px;
  border:1px solid var(--border); background:var(--bg-elev2); color:var(--text);
  min-height:44px;
}
#cmd-input:focus{outline:2px solid var(--accent); outline-offset:1px}
.icon-btn{
  flex-shrink:0; width:44px; height:44px; border-radius:999px;
  border:1px solid var(--border); background:var(--bg-elev2); color:var(--text);
  cursor:pointer; font-size:1.1rem; display:flex; align-items:center; justify-content:center;
}
.icon-btn:hover{background:var(--bg-elev3)}
.cmd-panel{
  position:absolute; top:calc(100% + 8px); left:0; right:0;
  background:var(--bg-elev); border:1px solid var(--border); border-radius:var(--radius);
  box-shadow:var(--shadow); max-height:65vh; overflow:auto; z-index:60; padding:6px;
}
.cmd-result{
  display:block; padding:9px 10px; border-radius:var(--radius-sm);
  text-decoration:none; color:var(--text); border-bottom:1px solid var(--border);
}
.cmd-result:last-child{border-bottom:none}
.cmd-result:hover,.cmd-result:focus{background:var(--bg-elev2)}
.cmd-result-static{opacity:.65; cursor:default}
.cmd-result-static:hover{background:none}
.cmd-result-top{display:flex; justify-content:space-between; gap:8px; font-size:.92rem}
.cmd-result-titulo{font-weight:600}
.cmd-result-sim{color:var(--text-dim); font-size:.8rem; flex-shrink:0}
.cmd-result-trecho{color:var(--text-dim); font-size:.82rem; margin-top:2px}
.cmd-result-fonte{color:var(--text-dim); font-size:.72rem; margin-top:2px; text-transform:uppercase; letter-spacing:.03em}
.cmd-loading,.cmd-empty,.cmd-error,.cmd-ok{padding:12px; font-size:.9rem; color:var(--text-dim)}
.cmd-error{color:var(--danger)}
.cmd-ok{color:var(--success)}
.cmd-resposta{padding:10px 12px; white-space:pre-wrap}
.cmd-fontes{display:flex; flex-wrap:wrap; gap:6px; padding:4px 12px 10px}
.cite{
  display:inline-block; border:1px solid var(--border); border-radius:6px;
  padding:0 4px; font-size:.78rem; text-decoration:none; background:var(--bg-elev2); color:var(--accent);
}
.cite-static{color:var(--text-dim); background:none}
.spinner{
  display:inline-block; width:14px; height:14px; border-radius:50%;
  border:2px solid var(--border); border-top-color:var(--accent);
  animation:spin .7s linear infinite; vertical-align:-2px; margin-right:6px;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- layout geral: largura toda; páginas de texto centram-se sozinhas ---------- */
#main{padding:20px 16px 32px}
.view{max-width:1300px; margin:0 auto; width:100%}
#tabbar{display:none}

@media (max-width:720px){
  #tabbar{
    display:flex; position:fixed; left:0; right:0; bottom:0; z-index:40;
    background:var(--bg-elev); border-top:1px solid var(--border);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .tabbar-link{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:2px; padding:8px 2px; min-height:56px; color:var(--text-dim); text-decoration:none;
    font-size:.63rem; text-align:center; min-width:0;
  }
  .tabbar-link.active{color:var(--accent)}
  .tabbar-link .tab-icon{font-size:1.1rem}
  .tabbar-link .tab-label{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%}
  #main{padding:16px 16px 80px}
}
@media (max-width:400px){
  .tabbar-link{padding:6px 0}
  .tabbar-link .tab-label{display:none}
  .tabbar-link .tab-icon{font-size:1.25rem}
}
/* ronda 13: no telemóvel a barra de cima não cabia — a pesquisa ficava com 0 px, por baixo do 🧭. Passa a uma linha só dela;
   abaixo de 440 px o logótipo fica só com a pedra (os botões mantêm os 44 px). */
@media (max-width:520px){
  .topbar-inner{flex-wrap:wrap; row-gap:8px}
  .brand{margin-right:auto}
  .cmd-wrap{order:1; flex:1 0 100%}
  .view.view-grafo{height:calc(100vh - 99px - var(--topbar-h))}   /* = os 160 px de baixo com a barra de uma linha (61 px) */
}
@media (max-width:440px){
  .topbar-inner{column-gap:6px}
  .brand{max-width:1.35em; overflow:hidden; white-space:nowrap}
}

/* ---------- generic components ---------- */
.view-heading{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; flex-wrap:wrap}
.view-heading h1{font-size:1.35rem}
.btn{
  border:1px solid var(--border); background:var(--bg-elev2); color:var(--text);
  border-radius:var(--radius-sm); padding:9px 14px; cursor:pointer; min-height:44px;
  text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:6px;
}
.btn:hover{background:var(--bg-elev3)}
.btn-primary{background:var(--accent); border-color:var(--accent); color:var(--accent-text); font-weight:600}
.btn-primary:hover{background:var(--accent-strong)}
.btn:disabled{opacity:.6; cursor:default}
input[type=text],input[type=search],select{
  border:1px solid var(--border); background:var(--bg-elev2); color:var(--text);
  border-radius:var(--radius-sm); padding:9px 12px; min-height:44px;
}
.dim-note{color:var(--text-dim); font-size:.88rem}
.state-loading,.state-error{padding:20px 8px; color:var(--text-dim); display:flex; align-items:center; gap:6px}
.state-error{color:var(--danger); flex-direction:column; align-items:flex-start; gap:10px}
.state-error-inline{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--danger)}

.badge{
  display:inline-block; padding:2px 9px; border-radius:999px; font-size:.72rem;
  font-weight:600; background:var(--bg-elev3); color:var(--text-dim);
}
.badge[data-tipo="user"]{background:color-mix(in srgb, var(--tag-user) 20%, transparent); color:var(--tag-user)}
.badge[data-tipo="feedback"]{background:color-mix(in srgb, var(--tag-feedback) 20%, transparent); color:var(--tag-feedback)}
.badge[data-tipo="project"]{background:color-mix(in srgb, var(--tag-project) 20%, transparent); color:var(--tag-project)}
.badge[data-tipo="reference"]{background:color-mix(in srgb, var(--tag-reference) 20%, transparent); color:var(--tag-reference)}
.badge[data-tipo="outros"]{background:color-mix(in srgb, var(--tag-outros) 25%, transparent); color:var(--tag-outros)}
.badge-projeto{background:var(--bg-elev3); color:var(--text-dim)}
.badge-readonly{background:var(--danger-bg); color:var(--danger)}
.badge-origem{background:var(--bg-elev3); color:var(--text-dim); text-transform:uppercase}

.chip{
  display:inline-flex; align-items:center; gap:4px; padding:6px 12px; border-radius:999px;
  border:1px solid var(--border); background:var(--bg-elev2); color:var(--accent);
  text-decoration:none; font-size:.85rem;
}
.chip:hover{background:var(--bg-elev3)}
.file-chip{font-family:var(--mono); font-size:.78rem; color:var(--text-dim)}

.panel{
  background:var(--bg-elev); border:1px solid var(--border); border-radius:var(--radius);
  padding:14px 16px; margin-bottom:14px;
}
.panel h2{font-size:1rem}

.timeline{list-style:none; margin:0; padding:0}
.timeline li{padding:8px 0; border-bottom:1px solid var(--border)}
.timeline li:last-child{border-bottom:none}
.timeline-data{color:var(--text-dim); font-size:.78rem; display:block}
.timeline-msg{display:block; margin-top:2px}
.timeline-files{margin-top:6px; display:flex; flex-wrap:wrap; gap:6px}

.link-list{list-style:none; margin:0; padding:0}
.link-list li{padding:6px 0; border-bottom:1px solid var(--border)}
.link-list li:last-child{border-bottom:none}
.pendente-linhas{margin:4px 0 0; padding-left:1.2em; color:var(--text-dim); font-size:.85rem}

/* ---------- home ---------- */
.cards-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:10px; margin-bottom:8px}
.stat-card{background:var(--bg-elev); border:1px solid var(--border); border-radius:var(--radius); padding:14px; text-align:center}
.stat-num{font-size:1.6rem; font-weight:700}
.stat-label{color:var(--text-dim); font-size:.78rem; margin-top:2px}
.quick-guarda{background:var(--bg-elev); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; margin:16px 0}
.quick-guarda-row{display:flex; gap:8px; flex-wrap:wrap}
.quick-guarda-row input{flex:1; min-width:180px}
#quick-guarda-msg{margin-top:8px; color:var(--text-dim); font-size:.88rem; min-height:1.2em}
.home-grid{display:grid; grid-template-columns:2fr 1fr; gap:14px}
@media (max-width:820px){.home-grid{grid-template-columns:1fr}}

/* ---------- notas ---------- */
.filtros{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px}
.filtros input{flex:1; min-width:160px}
.notas-lista{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}
.nota-row{
  display:block; background:var(--bg-elev); border:1px solid var(--border); border-radius:var(--radius);
  padding:12px 14px; text-decoration:none; color:var(--text);
}
.nota-row:hover{border-color:var(--accent)}
.nota-row-top{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.nota-titulo{font-weight:600; margin-right:4px}
.nota-desc{color:var(--text-dim); font-size:.86rem; margin:4px 0}
.nota-data{color:var(--text-dim); font-size:.76rem}

/* ---------- categorias (chips estáveis por nome) ---------- */
.cat-chip{
  display:inline-flex; align-items:center; padding:3px 10px; border-radius:999px;
  font-size:.74rem; font-weight:600; text-decoration:none; line-height:1.6;
}
.cat-chips-row{display:flex; flex-wrap:wrap; gap:6px; margin:4px 0}
.categoria-cards{display:flex; flex-direction:column; gap:8px}

/* ---------- ecrã de notas (#/notas, #/nota/NOME, #/categoria/NOME): ecrã inteiro ---------- */
:root{ --topbar-h:61px }
body.modo-notas #main{padding:0; max-width:none}
.obsidian-shell{display:none}
body.modo-notas .obsidian-shell{
  display:flex; height:calc(100vh - var(--topbar-h)); overflow:hidden;
}

.explorador{
  width:300px; flex-shrink:0; border-right:1px solid var(--border);
  display:flex; flex-direction:column; overflow:hidden; background:var(--bg-elev);
}
.explorador.escondido{display:none}
.explorador-topo{padding:10px; display:flex; flex-direction:column; gap:8px; border-bottom:1px solid var(--border)}
.explorador-topo input, .explorador-topo select{width:100%}
.explorador-arvore{flex:1; overflow-y:auto; padding:6px}
.exp-grupo summary{
  cursor:pointer; padding:7px 6px; border-radius:var(--radius-sm); font-weight:600; font-size:.85rem;
  display:flex; align-items:center; gap:6px; min-height:36px; list-style:none;
}
.exp-grupo summary::-webkit-details-marker{display:none}
.exp-grupo summary:hover{background:var(--bg-elev2)}
.exp-grupo summary .contagem-mini{color:var(--text-dim); font-weight:400; font-size:.76rem}
.exp-nota-link{
  display:block; padding:7px 10px 7px 20px; border-radius:var(--radius-sm); text-decoration:none;
  color:var(--text-dim); font-size:.85rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  min-height:34px; line-height:20px;
}
.exp-nota-link:hover{background:var(--bg-elev2); color:var(--text)}
.exp-nota-link.activa{background:color-mix(in srgb, var(--accent) 16%, transparent); color:var(--accent); font-weight:600}
.exp-indice-item{
  display:block; padding:6px 10px; border-radius:var(--radius-sm); text-decoration:none;
  color:var(--text-dim); min-height:34px;
}
.exp-indice-item:hover{background:var(--bg-elev2); color:var(--text)}
.exp-indice-item.activa{background:color-mix(in srgb, var(--accent) 16%, transparent); color:var(--accent)}
.exp-indice-titulo{display:block; font-size:.85rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.exp-indice-desc{display:none; font-size:.74rem; color:var(--text-dim); white-space:normal; margin-top:1px}
@media (min-width:1100px){ .exp-indice-desc{display:block} }

.explorador-toggle, .contexto-toggle{
  display:none; width:22px; flex-shrink:0; border:none; border-right:1px solid var(--border);
  background:var(--bg-elev); color:var(--text-dim); cursor:pointer; font-size:.8rem;
}
@media (min-width:721px){ .explorador-toggle, .contexto-toggle{display:block} }
.contexto-toggle{border-right:none; border-left:1px solid var(--border)}

.notas-centro{flex:1; min-width:0; overflow-y:auto; padding:24px}
.notas-centro-topo{display:none}
.nota-largura-wrap{max-width:900px; margin:0 auto}
.nota-largura-wrap.largura-total{max-width:none}
.nuvem-mini{margin-bottom:14px}
.nuvem-mini .cat-chip{font-size:.8rem !important}

.contexto{width:320px; flex-shrink:0; border-left:1px solid var(--border); overflow-y:auto; padding:14px; background:var(--bg-elev)}
.contexto.escondido{display:none}
.contexto h3{font-size:.82rem; text-transform:uppercase; letter-spacing:.04em; color:var(--text-dim); margin:16px 0 6px}
.contexto h3:first-child{margin-top:0}
.estrutura-lista{list-style:none; margin:0; padding:0}
.estrutura-lista li{margin:0}
.estrutura-lista button{
  background:none; border:none; color:var(--text-dim); text-align:left; padding:4px 0; cursor:pointer;
  font-size:.85rem; min-height:30px; width:100%;
}
.estrutura-lista button:hover{color:var(--accent)}
.estrutura-nivel-2{padding-left:12px}
.estrutura-nivel-3{padding-left:24px}

@media (max-width:720px){
  .explorador-toggle, .contexto-toggle{display:none}
  .explorador{width:100%; border-right:none}
  body.modo-notas .obsidian-shell{height:auto; overflow:visible; flex-direction:column}
  body.modo-notas #main{padding:0 0 80px}
  .obsidian-shell:not(.tem-nota-aberta) .notas-centro,
  .obsidian-shell:not(.tem-nota-aberta) .contexto{display:none}
  .obsidian-shell.tem-nota-aberta .explorador{display:none}
  .notas-centro-topo{display:block; padding:10px 16px 0}
  .notas-centro{padding:12px 16px 24px}
  .contexto{width:100%; border-left:none; border-top:1px solid var(--border)}
}

/* ---------- página de categoria (#/categoria/NOME) ---------- */
.categoria-card{
  display:block; background:var(--bg-elev); border:1px solid var(--border); border-radius:var(--radius);
  padding:12px 14px; text-decoration:none; color:var(--text);
}
.categoria-card:hover{border-color:var(--accent)}

/* ---------- índice: categorias + A-Z ---------- */
.nuvem-categorias{display:flex; flex-wrap:wrap; gap:10px; align-items:center}
.az-barra{display:flex; flex-wrap:wrap; gap:4px; margin-bottom:12px; position:sticky; top:0; background:var(--bg); padding:6px 0; z-index:1}
.az-letra{
  min-width:28px; height:28px; padding:0 4px; border-radius:6px; border:1px solid var(--border);
  background:var(--bg-elev2); color:var(--text-dim); text-decoration:none; text-align:center; line-height:26px;
  font-size:.8rem;
}
.az-letra:hover, .az-letra.tem-notas{color:var(--text); border-color:var(--accent)}
.az-grupo-titulo{font-size:1.1rem; font-weight:700; margin:18px 0 6px; scroll-margin-top:44px}
.az-item{padding:6px 0; border-bottom:1px solid var(--border); font-size:.92rem}
.az-item:last-child{border-bottom:none}

/* ---------- Unir (fusão de notas) ---------- */
.unir-btn{margin-left:auto}
.unir-modal{max-width:640px}
.unir-comparacao{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:10px 0}
@media (max-width:600px){.unir-comparacao{grid-template-columns:1fr}}
.unir-coluna{border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px}
.unir-coluna label{display:flex; align-items:flex-start; gap:8px; cursor:pointer; font-size:.9rem; color:var(--text)}
.unir-coluna dl{margin:8px 0 0; font-size:.8rem; color:var(--text-dim)}
.unir-coluna dt{font-weight:600; color:var(--text); margin-top:6px}
.unir-coluna dd{margin:0}
.unir-progresso{padding:14px; background:var(--bg-elev2); border-radius:var(--radius-sm); margin-top:10px}
.unir-estado-badge{display:inline-block; padding:2px 9px; border-radius:999px; font-size:.72rem; font-weight:600}
.unir-estado-badge.feita{background:color-mix(in srgb, var(--success) 20%, transparent); color:var(--success)}
.unir-estado-badge.recusada, .unir-estado-badge.falhou{background:var(--danger-bg); color:var(--danger)}
.unir-estado-badge.na_fila, .unir-estado-badge.a_fundir{background:color-mix(in srgb, var(--warning) 20%, transparent); color:var(--warning)}
.unir-estado-badge.desfeita{background:var(--bg-elev3); color:var(--text-dim)}
.fusoes-lista{list-style:none; margin:0; padding:0}
.fusoes-lista li{padding:10px 0; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.fusoes-lista li:last-child{border-bottom:none}

/* ---------- nota / editor ---------- */
.nota-header{margin-bottom:14px}
.nota-header h1{font-size:1.4rem; margin-bottom:6px}
.nota-badges{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px}
.nota-descricao{color:var(--text-dim); margin:4px 0 10px}
.nota-acoes{display:flex; gap:8px; flex-wrap:wrap}
.markdown-body{line-height:1.65}
.markdown-body h1{font-size:1.5rem; margin-top:1.1em}
.markdown-body h2{font-size:1.25rem; margin-top:1.1em}
.markdown-body h3{font-size:1.08rem; margin-top:1em}
.markdown-body p{margin:.6em 0}
.markdown-body code{
  font-family:var(--mono); background:var(--bg-elev2); padding:1px 5px; border-radius:4px; font-size:.88em;
}
.markdown-body pre.code-block{
  background:var(--bg-elev2); border:1px solid var(--border); border-radius:var(--radius-sm);

}

/* ---------- callouts (compatível Obsidian) ---------- */
.markdown-body .callout{border-radius:var(--radius-sm); border:1px solid var(--border); border-left-width:4px; margin:.7em 0; padding:8px 12px; background:var(--bg-elev2)}

.markdown-body .callout-corpo{margin-top:4px}
.markdown-body .callout-corpo p:first-child{margin-top:0}
.markdown-body .callout-corpo p:last-child{margin-bottom:0}
.markdown-body .callout-note{border-left-color:var(--tag-outros)}
.markdown-body .callout-info{border-left-color:var(--accent)}
.markdown-body .callout-tip{border-left-color:var(--success)}
.markdown-body .callout-warning{border-left-color:var(--warning)}
.markdown-body .callout-danger{border-left-color:var(--danger)}

/* ---------- notas embutidas ![[nome]] ---------- */
.markdown-body .embed-nota{border:1px solid var(--border); border-radius:var(--radius-sm); margin:.7em 0; padding:8px 12px; background:var(--bg-elev2)}

.editor-header{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:10px}

/* a marcação estática do HTML está em português: no arranque, em inglês, traduz-se de uma vez (nós de texto e atributos) */
function traduzirMarcacao(){
  var espacos = /^(\s*)([\s\S]*?)(\s*)$/;
  function traduzir(s){ var m = espacos.exec(s); return m[2] ? m[1] + t(m[2]) + m[3] : s; }
  var ignorar = {SCRIPT:1, STYLE:1, NOSCRIPT:1};
  var w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, {acceptNode: function(n){
    return n.parentNode && !ignorar[n.parentNode.nodeName] ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
  }});
  var nos = [];
  while(w.nextNode()) nos.push(w.currentNode);
  nos.forEach(function(n){ var v = traduzir(n.nodeValue); if(v !== n.nodeValue) n.nodeValue = v; });
  document.querySelectorAll("[placeholder],[title],[aria-label],[alt]").forEach(function(el){
    ["placeholder", "title", "aria-label", "alt"].forEach(function(a){
      var v = el.getAttribute(a);
      if(v) el.setAttribute(a, traduzir(v));
    });
  });
  document.querySelectorAll("button[value],input[type=button][value],input[type=submit][value]").forEach(function(el){
    el.setAttribute("value", traduzir(el.getAttribute("value")));
  });
  document.title = traduzir(document.title);
  var desc = document.querySelector('meta[name="description"]');
  if(desc && desc.content) desc.content = traduzir(desc.content);
}
if(IDIOMA === "en") traduzirMarcacao();

function escapeHtml(s){
  return String(s==null?"":s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

function debounce(fn, ms){
  var t;
  return function(){
    var ctx = this, args = arguments;
    clearTimeout(t);
    t = setTimeout(function(){ fn.apply(ctx, args); }, ms);
  };
}

function fmtDataCurta(d){
  try{
    return d.toLocaleDateString(LOCALE,{day:"2-digit",month:"2-digit",year:"numeric"}) + " " +
           d.toLocaleTimeString(LOCALE,{hour:"2-digit",minute:"2-digit"});
  }catch(e){ return d.toString(); }
}

function showToast(msg){
  var root = document.getElementById("toast-root");
  var el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(function(){
    el.classList.add("toast-out");
    setTimeout(function(){ el.remove(); }, 300);
  }, 2500);
}

function mostrarAvisoOffline(mostrar){
  OFFLINE_ESTADO.semRede = !!mostrar;
  atualizarIndicador();
}

async function handleRes(res){
  mostrarAvisoOffline(res.headers && res.headers.get && res.headers.get("X-Basalt-From-Cache") === "1");
  var data = null;
  try{ data = await res.json(); }catch(e){}
  if(!res.ok){
    var msg = (data && data.erro) ? data.erro : tf("erro {status}", {status: res.status});
    var err = new Error(msg);
    err.status = res.status;
    err.data = data;
    throw err;
  }
  return data;
}

async function apiGet(path, repetido, outraVolta){

  var epocaMem = EPOCA_MEM, epocaLocal = lerLocal("basalt-copia-epoca");   // ronda 13: a época com que partiu (ver lerEpocaCopia)

  if(daCache && res.headers.get("X-Basalt-Protocolo") !== String(PROTOCOLO_COPIA)) return apiGetFalhaRede(path, retrato);

  else if(!DONO || res.headers.get("X-Basalt-Dono") !== DONO) return apiGetFalhaRede(path, retrato);

  if(res.status === 428 && !repetido){ DONO_OK = false; try{ await verificarDono(); }catch(e){} if(DONO) return apiGet(path, true); }
  if(!daCache){

    // corpo é um await, e mudar de conta, «Sair», trancar ou apagar a cópia podia acontecer aí: entregava-se o que era de A.
    var dadosRede = await handleRes(res);                    // um erro (não 2xx) lança aqui, como antes
    var epocaRede = await lerEpocaCopia();                   // o ÚLTIMO await (ver lerEpocaCopia)
    var mudouRede = copiaMudouDesde(retrato, epocaRede);

  var donoAntes = DONO, dados = await handleRes(res);

  var epocaAgora = await lerEpocaCopia();

  // que já está em memória: daqui até ao return não há mais nenhum await.
  if(COPIA_BLOQUEADA || lerLocal("basalt-copia-bloqueada")) throw erroCopiaTrancada();
  if(!DONO || DONO !== donoAntes || OUTRA_CONTA) return apiGetFalhaRede(path, retrato);
  if(COPIA_DESLIGADA || GERACAO_COPIA !== geracaoAntes) throw erroLeituraCopiaApagada();
  // ronda 13: a época mudou desde que o pedido partiu (aviso do service worker, outro separador, este) ou já não é a com que o
  // service worker entregou — esta resposta pode estar revogada e não se entrega. Pede-se outra vez (o service worker decide já

  if(COPIA_DE && dados && typeof dados === "object") COPIA_DE.set(dados, Number(doSw) || 0);   // pendente b: «cópia de <data>»

/* ronda 13b (achado 3 da r13): o «retrato» da cópia com que uma leitura parte — dono, outra conta, geração, época (memória e
   localStorage; a persistente lê-se à parte, em .epoca) e tranca. A MESMA verificação final vale para todas as respostas (rede e
   cópia) e para as vistas que as desenham depois de mais awaits: copiaMudouDesde() só olha para a memória (sem await) e diz o
   que mudou ("" = nada). Destrancar não conta como mudança; uma tranca nova, sim. */
function retratoCopia(){
  return {dono: DONO, outraConta: OUTRA_CONTA, geracao: GERACAO_COPIA, desligada: COPIA_DESLIGADA, epocaMem: EPOCA_MEM,
          epocaLocal: lerLocal("basalt-copia-epoca"), tranca: COPIA_BLOQUEADA ? BLOQUEIO_ID : "",
          trancaLocal: lerLocal("basalt-copia-bloqueada") || "", epoca: null};
}
function copiaMudouDesde(r, epocaAgora){
  var tranca = COPIA_BLOQUEADA ? BLOQUEIO_ID : "", trancaLocal = lerLocal("basalt-copia-bloqueada") || "";
  if((tranca && tranca !== r.tranca) || (trancaLocal && trancaLocal !== r.trancaLocal)) return "trancada";
  if(OUTRA_CONTA !== r.outraConta || DONO !== r.dono) return "conta";         // outra conta, «Sair» (dono "") ou outro dono
  if((COPIA_DESLIGADA && !r.desligada) || GERACAO_COPIA !== r.geracao) return "apagada";
  if(EPOCA_MEM !== r.epocaMem || lerLocal("basalt-copia-epoca") !== r.epocaLocal) return "epoca";
  if(epocaAgora != null && r.epoca != null && epocaAgora !== r.epoca) return "epoca";
  return "";
}
// os dados entregues por apiGet() → o retrato com que se verificaram (a vista continua a verificar a partir dele)
var RETRATO_DE = (typeof WeakMap === "function") ? new WeakMap() : null;
// uma resposta já lida, com a cópia mudada desde que o pedido partiu: não se entrega. Trancada → o erro da tranca; outra conta
// ou «Sair» → como sem rede, sem repetir (no «Sair», verificarDono() voltava a pôr a conta que saiu); o resto → outra vez, uma
function naoEntregar(m, path, retrato, repetido, outraVolta){
  if(m === "trancada") throw erroCopiaTrancada();
  if(m === "conta" || outraVolta) return apiGetFalhaRede(path, retrato);
  return apiGet(path, repetido, true);
}
/* ronda 13b: uma VISTA que leu (apiGet, IndexedDB) e ainda espera por mais alguma coisa antes de desenhar volta a verificar a
   cópia a seguir a cada await. `antes` = retratoCopia() tirado antes da 1.ª leitura; `lidos` = o que apiGet() acabou de entregar
   (cada um com o retrato com que se verificou; nunca o que vem de uma cache em memória, que é de um retrato antigo). A época
   persistente é o último await. "" = pode desenhar. */
async function leituraMudou(antes, lidos){
  var m = copiaMudouDesde(antes, null);
  if(m) return m;
  var ep = await lerEpocaCopia();
  m = copiaMudouDesde(antes, null);
  for(var i = 0; !m && lidos && i < lidos.length; i++){
    var r = (RETRATO_DE && lidos[i] && typeof lidos[i] === "object") ? RETRATO_DE.get(lidos[i]) : null;
    if(r) m = copiaMudouDesde(r, ep);
  }
  return m;

// mudou: com uma conta neste separador (a mesma, ou a confirmada agora) lê-se outra vez, até 2 voltas; trancada, «Sair» ou outra
// conta noutro separador → o erro, no lugar do que se leu (nada da conta anterior)
function vistaPodeRepetir(m, voltas){ return m !== "trancada" && !!DONO && !OUTRA_CONTA && (voltas || 0) < 2; }
function erroVistaMudou(m){
  if(m === "trancada") return erroCopiaTrancada();
  var e = new Error(t("a conta ou a cópia deste aparelho mudou enquanto se lia — não mostro o que se leu. Recarrega a página."));
  e.copiaMudou = m;
  return e;
}
/* ronda 13b: as caches em memória (grafo, pré-visualizações, embeds, lista do salto rápido) são da conta e da cópia com que se
   encheram: mudou a conta ou a geração da cópia → deitam-se fora. A árvore das notas guarda a chave dela (NOTAS_SHELL.chave). */
var CACHES_DA_CONTA = null;
function chaveDaConta(r){ return r ? [r.dono, r.outraConta ? 1 : 0, r.geracao].join("|") : [DONO, OUTRA_CONTA ? 1 : 0, GERACAO_COPIA].join("|"); }
function cachesDaConta(){
  var chave = chaveDaConta();
  if(CACHES_DA_CONTA === chave) return;
  if(CACHES_DA_CONTA !== null){ EMBED_CACHE = {}; previewCache = {}; GRAFO_CACHE_PROMESSA = null; SALTO_NOTAS_CACHE = null; }
  CACHES_DA_CONTA = chave;
}
/* ronda 9 (achado 3 da ronda 8): uma resposta da cópia do service worker que chega DEPOIS de «apagar a cópia» (o SW pode tê-la lido

   marca do SW e a geração persistente (outro separador). Na dúvida, não se mostra. */
async function copiaApagadaDesde(geracao){
  if(COPIA_DESLIGADA || GERACAO_COPIA !== geracao) return true;
  try{ if("caches" in window && await caches.has(MARCA_DESLIGADA)) return true; }catch(e){ return true; }
  var actual = await geracaoActual();
  return COPIA_DESLIGADA || actual !== geracao;
}
function erroLeituraCopiaApagada(){
  var e = new Error(t("precisa de rede — a cópia deste aparelho foi apagada"));
  e.semRede = true;

}
/* a cópia está trancada se QUALQUER das marcas o diz — memória, localStorage, IndexedDB ou a marca que só o
   service worker pôs (quando o separador fechou antes de a página saber do 401). Uma tranca só do service worker passa a
   ser também da página (mesmo id), para a resposta boa seguinte a destrancar pelo caminho normal. */
async function copiaTrancadaAqui(){
  if(COPIA_BLOQUEADA) return true;
  var id = lerLocal("basalt-copia-bloqueada") || await marcaPersistente("bloqueada") || await trancaDoServiceWorker();
  if(!id) return false;
  COPIA_BLOQUEADA = true; BLOQUEIO_ID = id;
  gravarLocal("basalt-copia-bloqueada", id);
  try{ await idbPut("meta", {chave:"bloqueada", valor:true, id:id}); }catch(e){}
  return true;

function erroCopiaTrancada(){
  var trancada = new Error(t("a cópia deste aparelho está trancada até voltares a entrar (a sessão tinha expirado)"));
  trancada.sessaoExpirada = true;
  return trancada;

/* o servidor respondeu (não é falta de rede) — uma recusa tranca a cópia deste aparelho; uma nota que deixou
   de existir (404) sai também da cópia; qualquer resposta boa destranca. */
async function reagirResposta(res, path, bloqAntes, inicio, trancasAntes, geracaoAntes){
  try{
    // só destranca o trancar que já existia quando ESTE pedido partiu (uma resposta boa atrasada, de antes de
    // a sessão expirar, não pode destrancar o que outro pedido/separador acabou de trancar)
    if(res.ok){
      // ronda 5 (auditoria externa, ronda 4): um 200 que não seja JSON (a página de login em HTML) não prova que a sessão está boa —
      // não destranca. O service worker já o evitava (ronda 4 G4); a página voltava a destrancar ao receber a mesma resposta.
      var tipoOk = (res.headers && res.headers.get && res.headers.get("content-type")) || "";
      if(/json/i.test(tipoOk) && COPIA_BLOQUEADA && BLOQUEIO_ID === bloqAntes) await desbloquearCopiaLocal(bloqAntes, inicio, trancasAntes);
      return;
    }
    if(res.status === 401){ mostrarSessaoExpirada(); return; }      // inclui o 401 que o service worker faz do login
    if(ehOutraConta(res)){ mostrarOutraConta(); return; }          // ronda 8: entrou outra conta — não é a sessão, não tranca
    if(res.status === 403){ await bloquearCopiaLocal(); return; }
    if((res.status === 404 || res.status === 410) && path.indexOf("/api/nota?") === 0){   // o 410 também tira a nota da cópia
      var nomeApagado = new URLSearchParams(path.split("?")[1] || "").get("nome");
      if(nomeApagado) await marcarApagadaAqui(nomeApagado, inicio, geracaoAntes);   // ronda 6 M8: com lápide — um pacote que partiu antes não a repõe
    }
  }catch(e){}
}

async function apiSend(method, path, body, opcoes){

  // (um pedido só por separador; sem rede falha depressa e a escrita segue para a fila como antes)
  if(!DONO_OK && !OUTRA_CONTA){ try{ await verificarDono(); }catch(e){} }
  if(!DONO) throw erroSemDono();                         // ronda 9 (achado G2 da ronda 2): antes seguia sem dono
  // ronda 10 (achado G1 da r3): a escrita de uma edição leva o dono com que ela foi aberta; se a conta do separador mudou
  // entretanto (verificarDono acabou de adoptar outra), não se envia — nem com o dono novo, nem com o antigo
  if(opcoes && opcoes.dono !== undefined && DONO !== opcoes.dono) throw erroEdicaoDeOutraConta();
  var res, inicio = agora(), geracaoAntes = GERACAO_COPIA;   // ronda 7
  try{
    res = await fetch(path, {
      method: method,
      credentials: "same-origin",
      headers: cabecalhoDono({"Content-Type":"application/json","X-Basalt":"1"}),   // ronda 8
      body: JSON.stringify(body || {}),
      signal: (opcoes && opcoes.signal) || undefined,
    });

    if(e && e.name === "AbortError") throw e;   // cancelado por quem pediu — não é «sem rede»

  if((res.status === 404 || res.status === 410) && path.indexOf("/api/nota?") === 0){
    try{

}

/* ========================================================================

   local (notas/fila/conflitos/meta), sincronização do pacote e da fila.
   ==================================================================== */

var OFFLINE_ESTADO = {semRede:false, quando:null, fila:0, aSincronizar:false};

   - COPIA_DESLIGADA (ronda 2, apagar cópia): o utilizador carregou em «Apagar cópia deste aparelho» → não se volta a descarregar nada sozinho

   - COPIA_BLOQUEADA (ronda 2, sessão recusada): a sessão expirou ou o servidor recusou o acesso → a cópia deste aparelho não se mostra

   /api/eu («dono»: opaco, conta + espaço). DONO = o dono da cópia que este separador conhece; DONO_OK = o servidor já
   confirmou que é a conta que está agora no browser (só então se sincroniza; o X-Basalt-Dono vai sempre que haja DONO — ronda 9); OUTRA_CONTA = o
   servidor recusou um pedido deste separador por ser de outra conta (alguém entrou noutro separador) — pede-se para

function cabecalhoDono(h){

}
function erroSemDono(){
  var e = new Error(t("ainda não sei de que conta é este browser — não gravei; tenta outra vez daqui a pouco (o texto continua aqui)."));
  e.semDono = true;
  return e;
}
function ehOutraConta(res){
  return !!(res && res.status === 403 && res.headers && res.headers.get && res.headers.get("X-Basalt-Outra-Conta") === "1");

function lerLocal(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function gravarLocal(k, v){ try{ if(v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); }catch(e){} }
/* ronda 6 (achado G5 da ronda 4): hora monótona para ordenar pedidos, trancas e lápides — nunca desce, mesmo que o relógio ande
   para trás (acerto NTP, mudança de hora). O service worker faz o mesmo e manda a hora do pedido dele em X-Basalt-Inicio,
   que a página adopta (a mesma régua nos dois). Para mostrar horas ao utilizador continua a usar-se Date.now(). */
var ULTIMO_INSTANTE = 0;
function agora(){ var t = Date.now(); if(t <= ULTIMO_INSTANTE) t = ULTIMO_INSTANTE + 1; ULTIMO_INSTANTE = t; return t; }
function viuInstante(t){ t = Number(t) || 0; if(t > ULTIMO_INSTANTE) ULTIMO_INSTANTE = t; }
/* ronda 9 (achados 3/4 da ronda 7): o corpo de cada tranca é «hora.ficha» (9 algarismos ao acaso) — a mesma chave reposta com a
   mesma hora é OUTRA tranca, e compara-se pelo corpo inteiro. As que vêm de antes («/__quando», só a hora) nunca saem por
   uma resposta: convertem-se primeiro numa entrada própria, debaixo do trinco. */
function horaDe(corpo){ return Math.floor(Number(String(corpo).split(".")[0])) || 0; }
function ficha(){ return ("000000000" + Math.floor(Math.random() * 1e9)).slice(-9); }

/* ronda 9 (achados 4/8 da ronda 7): o MESMO trinco do service worker («basalt-copia», Web Locks) — ler as trancas, decidir e
   apagar fazem-se sem ninguém escrever no meio. Nunca à espera de rede; partilhado para servir, exclusivo para escrever.
   Ocupado mais de 3 s → {ok:false} e quem chama decide (trancar e apagar fazem na mesma; destrancar e religar não).
   Sem Web Locks: uma fila de promessas (só protege dentro deste separador). «basalt-fila» pode pedir este; nunca o contrário. */
var TRINCO = "basalt-copia", TRINCO_MS = 3000, TRINCO_CADEIA = Promise.resolve();
function comTrincoCadeia(fn){
  var p = TRINCO_CADEIA.then(function(){ return fn(); }).then(function(v){ return {ok:true, valor:v}; });
  TRINCO_CADEIA = p.catch(function(){});
  return p;
}
function comTrincoCopia(modo, fn){
  var locks = navigator.locks;
  if(!locks || !locks.request || typeof AbortController !== "function") return comTrincoCadeia(fn);
  var ac = new AbortController(), entrou = false;
  var relogio = setTimeout(function(){ ac.abort(); }, TRINCO_MS);
  try{
    return locks.request(TRINCO, {mode: modo, signal: ac.signal}, function(){ entrou = true; clearTimeout(relogio); return Promise.resolve().then(fn); })
      .then(function(v){ return {ok:true, valor:v}; }, function(e){ clearTimeout(relogio); if(entrou) throw e; return ac.signal.aborted ? {ok:false} : comTrincoCadeia(fn); });
  }catch(e){ clearTimeout(relogio); return comTrincoCadeia(fn); }
}

async function apagarCachesApi(){
  if(!("caches" in window)) return;
  try{
    var nomes = await caches.keys();
    await Promise.all(nomes.filter(function(n){ return /^basalt-.*-api(-[A-Za-z0-9_-]+)?$/.test(n); }).map(function(n){ return caches.delete(n); }));   // ronda 9: uma por dono
  }catch(e){}
}
async function bloquearCopiaLocal(){
  var q = agora(), id = q.toString(36) + "-" + Math.random().toString(36).slice(2, 8);   // ronda 6 G5: hora monótona
  COPIA_BLOQUEADA = true; BLOQUEIO_ID = id;
  gravarLocal("basalt-copia-bloqueada", id);                 // os outros separadores sabem pelo evento «storage»
  await comecarRevogacao();                                  // ronda 13: a época primeiro (ver lerEpocaCopia), depois o resto

  try{ await idbPut("meta", {chave:"bloqueada", valor:true, id:id}); }catch(e){}
  var fazer = async function(){
    try{                                                    // 1.º a marca (com a hora), depois apagar
      // ronda 3 G2: entrada própria desta tranca (o service worker e os outros separadores põem as deles) — destrancar
      // apaga entradas, nunca a cache inteira, para uma tranca mais nova posta no meio ficar
      if("caches" in window) await (await caches.open(MARCA_TRANCADA)).put("/__tranca/" + id, new Response(corpoTranca(q)));   // ronda 9: hora.ficha
    }catch(e){}

  };
  var r = await comTrincoCopia("exclusive", fazer);          // ronda 9: sem ninguém a guardar no meio
  if(!r.ok) await fazer();                                  // trancar nunca fica por fazer: ocupado, faz-se na mesma

/* as trancas que o service worker (ou outro separador) deixou na cache-marca: [{chave, quando}] */
async function trancasNaMarca(){
  if(!("caches" in window)) return [];
  try{
    if(!(await caches.has(MARCA_TRANCADA))) return [];
    var c = await caches.open(MARCA_TRANCADA), chaves = await c.keys(), out = [];
    for(var i = 0; i < chaves.length; i++){
      var corpo = "";
      try{ var r = await c.match(chaves[i]); corpo = r ? await r.text() : ""; }catch(e){}
      var q = horaDe(corpo);
      viuInstante(q);
      var caminho = ""; try{ caminho = new URL(chaves[i].url).pathname; }catch(e){}
      out.push({chave: chaves[i], quando: q, corpo: corpo, id: caminho.indexOf("/__tranca/") === 0 ? caminho.slice(10) : "antigo"});
    }
    return out;
  }catch(e){ return [{chave:null, quando:0, corpo:"", id:"antigo"}]; }     // na dúvida, trancada
}
// ronda 6 G5: a chave (URL) de uma tranca e a fotografia de um conjunto delas — «já existia quando o pedido partiu» sem relógio
function chaveDe(t){ return t && t.chave ? (t.chave.url || String(t.chave)) : ""; }
// ronda 7 (chave reutilizada): chave → corpo; ronda 9: o corpo traz uma ficha — a mesma chave e a mesma hora repostas são outra tranca
function chavesDe(lista){ var s = {}; for(var i = 0; i < lista.length; i++){ var u = chaveDe(lista[i]); if(u) s[u] = lista[i].corpo; } return s; }
/* ronda 9: «/__quando» (de antes) → entrada própria «/__tranca/legado-…», debaixo do trinco — como o service worker faz */
async function converterTrancasLegadas(){
  if(!("caches" in window)) return;
  try{
    await comTrincoCopia("exclusive", async function(){
      var lista = await trancasNaMarca();
      for(var i = 0; i < lista.length; i++){
        if(!lista[i].chave || lista[i].id !== "antigo") continue;
        var c = await caches.open(MARCA_TRANCADA);
        await c.put("/__tranca/legado-" + ficha(), new Response(corpoTranca(lista[i].quando || agora())));   // 1.º a nova, depois sai a velha
        await c.delete(lista[i].chave);
      }
    });
  }catch(e){}
}
async function trancaDoServiceWorker(){
  var lista = await trancasNaMarca();
  return lista.length ? lista[0].id : "";
}
/* destranca só se o trancar em vigor ainda é o `id` que a resposta boa provou estar ultrapassado.
   na cache-marca saem só a entrada deste `id` e as anteriores a `inicio` (a hora a que partiu o pedido que
   trouxe a resposta boa) — uma tranca posta no meio, por outro pedido ou separador, fica.
   ronda 6 G5: «anterior» é estar na fotografia das chaves tirada quando o pedido partiu (chavesAntes), que não depende do
   relógio — este pode andar para trás e outra parte pode pôr uma tranca com hora mais baixa. Sem fotografia, a hora. */
async function desbloquearCopiaLocal(id, inicio, chavesAntes){
  if(id == null) id = BLOQUEIO_ID;
  if(inicio == null) inicio = agora();
  var feito = false;
  try{
    feito = await transacao(["meta"], function(tx, saida){
      var meta = tx.objectStore("meta"), g = meta.get("bloqueada");
      saida.valor = true;
      g.onsuccess = function(){
        var r = g.result, actual = r && r.valor ? (r.id || "antigo") : "";
        if(actual && actual !== id && !(actual === "antigo" && id === "1")){ saida.valor = false; return; }
        if(r) meta.delete("bloqueada");
      };
    });
  }catch(e){ feito = true; }
  if(!feito) return;
  var local = lerLocal("basalt-copia-bloqueada");
  if(local && local !== id) return;
  COPIA_BLOQUEADA = false; BLOQUEIO_ID = "";
  gravarLocal("basalt-copia-bloqueada", null);
  // ronda 9 (achados 3/4 da ronda 7): ler, comparar e apagar debaixo do trinco — ninguém troca uma tranca no meio. Sai a tranca
  // desta id e as que estão na fotografia COM O MESMO CORPO; sem fotografia, só a própria (nunca pela hora). As de antes
  // («antigo», chave fixa) nunca saem por uma resposta: convertem-se aqui numa entrada própria, que só uma resposta a um
  // pedido que parta DEPOIS pode tirar (como no service worker). Ocupado: não se apaga nada (fica trancada).
  var antes = chavesAntes || {};

      if(!lista.length || !("caches" in window)) return;
      var c = await caches.open(MARCA_TRANCADA);
      for(var i = 0; i < lista.length; i++){
        var t = lista[i], u = chaveDe(t);
        if(!t.chave) continue;
        if(t.id === "antigo"){
          await c.put("/__tranca/legado-" + ficha(), new Response(corpoTranca(t.quando || agora())));   // 1.º a nova, depois sai a velha
          await c.delete(t.chave);
          continue;
        }
        if(t.id === id || (Object.prototype.hasOwnProperty.call(antes, u) && antes[u] === t.corpo)) await c.delete(t.chave);
      }
    });
  }catch(e){}
}
/* o que outro separador decidiu vale aqui também, logo (evento «storage») e ao ir buscar a cópia (marcas
   persistentes na IndexedDB — também quando o localStorage não funciona) */
async function marcaPersistente(chave){

window.addEventListener("storage", function(e){

  if(e.key === null || ["basalt-copia-epoca", "basalt-copia-bloqueada", "basalt-copia-desligada", "basalt-copia-geracao"].indexOf(e.key) !== -1) EPOCA_MEM++;

/* ronda 13 (achados 1A/1B do porte, 2 da revisão externa r10): a ÉPOCA da cópia. Quem revoga a cópia — trancar, apagar a cópia,

   separadores sabem pelo evento «storage») e «/__epoca» na cache «basaltcfg-epoca» (a mesma que o service worker muda e manda em

async function comecarRevogacao(){

// no fim: muda outra vez (o que se leu durante a revogação também não vale) e pede ao service worker que avise as páginas e
// mude a dele — espera pela resposta, até AVISO_SW_MS (um service worker de antes não responde)

}

/* ronda 8: este separador ainda é da conta anterior. Não se tranca nada nem se apaga nada daqui: a página que abrir com a
   conta nova é que arruma a cópia (guarda à parte o que a anterior tinha por enviar). Fechar deixa copiar o que estava a meio;
   este separador não sincroniza nem grava na cópia até recarregar. */
function mostrarOutraConta(){
  OUTRA_CONTA = true;
  if(PACOTE_CONTROLO){ try{ PACOTE_CONTROLO.abort(); }catch(e){} }
  if(OUTRA_CONTA_MOSTRADA) return;
  OUTRA_CONTA_MOSTRADA = true;
  var root = document.getElementById("modal-root");
  if(!root) return;
  root.innerHTML =
    '<div class="modal-backdrop" id="outra-conta-backdrop">' +
      '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="outra-conta-titulo">' +
        '<h2 id="outra-conta-titulo">' + t("Entrou outra conta neste browser") + '</h2>' +
        '<p class="dim-note">' + t("Este separador ainda era da conta anterior. Recarrega para continuar com a conta que entrou agora. O que estava por enviar fica guardado à parte e volta quando essa conta entrar outra vez; o que ainda não gravaste neste separador, copia-o antes.") + '</p>' +
        '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">' +
          '<button id="outra-conta-fechar" class="btn" type="button">' + t("Fechar") + '</button>' +
          '<button id="outra-conta-recarregar" class="btn btn-primary" type="button">' + t("Recarregar") + '</button>' +
      "</div></div></div>";
  document.getElementById("outra-conta-recarregar").addEventListener("click", function(){ location.reload(); });
  document.getElementById("outra-conta-fechar").addEventListener("click", function(){ root.innerHTML = ""; });
}

// ronda 13b: `retrato` = o da leitura que falhou (retratoCopia) — a cópia da IndexedDB só se entrega se a conta e a cópia ainda são
// as com que essa leitura partiu (não a de outra conta que, entretanto, a passou a ter)
async function apiGetFalhaRede(path, retrato){
  var tipo = await diagnosticarFalha();
  if(tipo === "sessao-expirada"){
    mostrarSessaoExpirada();
    var er = new Error(t("a sessão expirou"));
    er.sessaoExpirada = true;
    throw er;
  }
  if(tipo === "offline"){
    var dados = await tentarOffline(path);
    var mudou = (retrato && dados !== undefined) ? copiaMudouDesde(retrato, null) : "";
    if(mudou === "trancada") throw erroCopiaTrancada();
    if(mudou && mudou !== "epoca") throw erroCopiaNaoVerificada();   // a época: a IndexedDB lê-se já com as guardas dela
    if(dados !== undefined){
      OFFLINE_ESTADO.semRede = true;
      atualizarIndicador();
      if(RETRATO_DE && dados && typeof dados === "object") RETRATO_DE.set(dados, retratoCopia());   // verificada agora, sem await no meio
      return dados;
    }
    var erSemSuporte = new Error(t("precisa de rede"));
    erSemSuporte.semRede = true;
    throw erSemSuporte;
  }
  var erTransitorio = new Error(t("sem ligação ao servidor"));
  erTransitorio.semRede = true;
  throw erTransitorio;
}

async function apiSendFalhaRede(){
  var tipo = await diagnosticarFalha();
  if(tipo === "sessao-expirada"){
    mostrarSessaoExpirada();
    var er = new Error(t("a sessão expirou"));
    er.sessaoExpirada = true;
    throw er;
  }
  var erRede = new Error(tipo === "offline" ? t("precisa de rede") : t("sem ligação ao servidor"));
  erRede.semRede = true;
  throw erRede;
}

/* ---- IndexedDB: notas (espelho do /api/pacote), fila (edições por enviar), conflitos, meta ---- */
var DB_NOME = "basalt", DB_VERSAO = 1;
var DB_PROMESSA = null;
function abrirDB(){
  if(DB_PROMESSA) return DB_PROMESSA;
  DB_PROMESSA = new Promise(function(resolve, reject){
    if(!window.indexedDB){ reject(new Error(t("IndexedDB indisponível"))); return; }
    var req = indexedDB.open(DB_NOME, DB_VERSAO);
    req.onupgradeneeded = function(e){
      var db = e.target.result;
      if(!db.objectStoreNames.contains("notas")) db.createObjectStore("notas", {keyPath:"nome"});
      if(!db.objectStoreNames.contains("fila")) db.createObjectStore("fila", {keyPath:"nome"});
      if(!db.objectStoreNames.contains("meta")) db.createObjectStore("meta", {keyPath:"chave"});
      if(!db.objectStoreNames.contains("conflitos")) db.createObjectStore("conflitos", {keyPath:"nome"});
    };
    req.onsuccess = function(e){ resolve(e.target.result); };
    req.onerror = function(){ reject(req.error || new Error(t("falha a abrir a base de dados local"))); };
  });
  return DB_PROMESSA;
}
function idbGetAll(loja){
  return abrirDB().then(function(db){
    return new Promise(function(resolve, reject){
      var req = db.transaction(loja, "readonly").objectStore(loja).getAll();
      req.onsuccess = function(){ resolve(req.result || []); };
      req.onerror = function(){ reject(req.error); };
    });
  });
}
function idbGet(loja, chave){
  return abrirDB().then(function(db){
    return new Promise(function(resolve, reject){
      var req = db.transaction(loja, "readonly").objectStore(loja).get(chave);
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ reject(req.error); };
    });
  });
}
function idbPut(loja, valor){
  return abrirDB().then(function(db){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(loja, "readwrite");
      tx.objectStore(loja).put(valor);
      tx.oncomplete = function(){ resolve(); };
      tx.onerror = function(){ reject(tx.error); };
    });
  });
}
function idbDelete(loja, chave){
  return abrirDB().then(function(db){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(loja, "readwrite");
      tx.objectStore(loja).delete(chave);
      tx.oncomplete = function(){ resolve(); };
      tx.onerror = function(){ reject(tx.error); };
    });
  });
}
function idbClear(loja){
  return abrirDB().then(function(db){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(loja, "readwrite");
      tx.objectStore(loja).clear();
      tx.oncomplete = function(){ resolve(); };
      tx.onerror = function(){ reject(tx.error); };
    });
  });
}
function idbReplaceAll(loja, valores){
  return abrirDB().then(function(db){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(loja, "readwrite");
      var store = tx.objectStore(loja);
      store.clear();
      (valores || []).forEach(function(v){ store.put(v); });
      tx.oncomplete = function(){ resolve(); };
      tx.onerror = function(){ reject(tx.error); };
    });
  });
}

function atualizarContadorFila(){
  return idbGetAll("fila").then(function(f){
    OFFLINE_ESTADO.fila = f.length;
    atualizarIndicador();
    return f.length;
  }).catch(function(){ return 0; });
}

/* ---- pacote completo (para funcionar sem rede) e fila de edições offline ---- */
var A_SINCRONIZAR_PACOTE = false;
async function sincronizarPacote(){
  if(!navigator.onLine || A_SINCRONIZAR_PACOTE || COPIA_DESLIGADA) return false;
  A_SINCRONIZAR_PACOTE = true;
  if(!(await donoConfirmado())){ A_SINCRONIZAR_PACOTE = false; return false; }   // ronda 8: só se sabe de quem é a cópia

  var geracao = await geracaoActual();                     // ronda 6 G6: a geração persistente (e a deste separador posta em dia)
  try{ var piAntes = await idbGet("meta", "pacoteInicio"); if(piAntes) viuInstante(piAntes.valor); }catch(e){}   // ronda 7: acima do último pacote guardado
  var inicio = await reservarInstante();                 // ronda 4 G3 / ronda 9 (achado 7): a hora a que o pedido partiu — única entre separadores
  var bloqMem = BLOQUEIO_ID;
  var bloqAntes = await marcaPersistente("bloqueada");      // o trancar que já existia quando o pedido partiu
  var trancasAntes = (COPIA_BLOQUEADA || bloqAntes) ? chavesDe(await trancasNaMarca()) : null;   // ronda 6 G5: fotografia das trancas ao partir
  var controlo = (typeof AbortController !== "undefined") ? new AbortController() : null;
  PACOTE_CONTROLO = controlo;
  try{
    var res = await fetch("/api/pacote", {credentials:"same-origin", cache:"no-store", redirect:"manual",
                                           headers: cabecalhoDono(), signal: controlo ? controlo.signal : undefined});
    if(ehOutraConta(res)){ mostrarOutraConta(); return false; }   // ronda 8: o pacote seria de outra conta — nada entra, nada tranca
    if(res.type === "opaqueredirect" || res.status === 401 || res.status === 403){ await bloquearCopiaLocal(); return false; }
    if(!res.ok) return false;
    var tipo = res.headers.get("content-type") || "";
    if(tipo.indexOf("application/json") === -1) return false; // sessão expirada devolveria HTML de login — nunca guardar
    var dados = await res.json();
    // apagada (ou desligada) enquanto o pedido corria → não repor nada
    if(COPIA_DESLIGADA || geracao !== GERACAO_COPIA) return false;
    var g = await guardarPacoteLocal(dados.notas || [], dados.gerado, geracao, bloqAntes, inicio);
    if(!g) return false;
    // ronda 4 G3: uma tranca posta DEPOIS de o pacote partir fica — ronda 9: destranca-se só o trancar de quando partiu (nunca o actual)
    var bloqDoPedido = bloqAntes || bloqMem;
    if(COPIA_BLOQUEADA && bloqDoPedido) await desbloquearCopiaLocal(bloqDoPedido, inicio, trancasAntes);
    OFFLINE_ESTADO.quando = Date.now();
    atualizarIndicador();
    return true;
  }catch(e){
    return false;
  }finally{
    if(PACOTE_CONTROLO === controlo) PACOTE_CONTROLO = null;
    A_SINCRONIZAR_PACOTE = false;
  }
}

/* ronda 9 (achado 7 da ronda 7): a hora de partida de um pacote vem de um contador na IndexedDB (meta.relogio), lido e subido na
   mesma transacção — dois separadores nunca recebem o mesmo valor, mesmo com o relógio igual ou para trás */
function reservarInstante(){
  return transacao(["meta"], function(tx, saida){
    instanteNaTx(tx, function(q){ saida.valor = q; });
  }).then(function(q){ return q || agora(); }, function(){ return agora(); });
}
/* ronda 9 (achado 4 da ronda 8): o contador partilhado (meta.relogio) lido e subido DENTRO de uma transacção que já tem «meta».
   As gravações deste aparelho (guardadoEm) tiram a hora daqui, como os pacotes: com o relógio para trás, uma gravação feita
   depois de um pacote partir fica sempre acima da hora dele (antes: agora() local — o pacote atrasado repunha o texto velho). */
function instanteNaTx(tx, fn){
  var meta = tx.objectStore("meta"), g = meta.get("relogio");
  g.onsuccess = function(){
    var q = Math.max(agora(), ((g.result && Number(g.result.valor)) || 0) + 1);
    viuInstante(q);
    meta.put({chave:"relogio", valor:q});
    fn(q);
  };
}
/* notas + meta numa só transacção, e só se ninguém apagou a cópia entretanto */
function guardarPacoteLocal(notas, gerado, geracao, bloqAntes, inicio){
  return abrirDB().then(function(db){
    return new Promise(function(resolve, reject){
      if(COPIA_DESLIGADA || geracao !== GERACAO_COPIA){ resolve(false); return; }
      var tx = db.transaction(["notas", "meta", "fila"], "readwrite"), recusado = false, sg = {};   // ronda 9 (achado 6): + fila
      var loja = tx.objectStore("notas"), meta = tx.objectStore("meta"), filaLoja = tx.objectStore("fila");
      // as marcas lêem-se DENTRO da transacção — «apagar cópia» noutro separador (transacção sobre as mesmas
      // lojas) ou fica antes (e aqui vê-se a marca) ou depois (e apaga isto); nunca no meio
      var gd = meta.get("copiaDesligada");
      gd.onsuccess = function(){
        if(gd.result && gd.result.valor){ recusado = true; return; }
        var gb = meta.get("bloqueada");
        gb.onsuccess = function(){
          var actual = gb.result && gb.result.valor ? (gb.result.id || "antigo") : "";
          if(actual && actual !== (bloqAntes || "")){ recusado = true; return; }     // trancou-se durante o pedido
          if(COPIA_DESLIGADA || geracao !== GERACAO_COPIA){ recusado = true; return; }
          // ronda 6 (achado G6 da ronda 4): a geração PERSISTENTE compara-se aqui dentro — outro separador pode ter apagado e religado
          // sem este saber (sem localStorage, ou com este pedido já em curso). Ronda 6 M8: as lápides de notas apagadas DEPOIS de este
          // pacote partir protegem-nas de voltar; as anteriores a ele saem (se a nota foi recriada, este pacote traz-a).
          seGeracaoIgual(tx, sg, geracao, function(){
            var gp = meta.get("pacoteInicio");
            gp.onsuccess = function(){
            // ronda 7 (ordem dos pacotes): um pacote que partiu ANTES do último guardado (noutro separador) é mais velho — não entra
            // ronda 9 (achado 7): nem um com a mesma hora (o contador não as repete; igual = não é mais novo)
            if(inicio != null && ((gp.result && Number(gp.result.valor)) || 0) >= inicio){ recusado = true; return; }
            var lapides = {}, cur = meta.openCursor(IDBKeyRange.bound("apagada:", "apagada:\uffff"));
            cur.onsuccess = function(){
              var k = cur.result;
              if(k){ lapides[String(k.key).slice(8)] = Number(k.value && k.value.valor) || 0; k.continue(); return; }
              // ronda 9 (achado 6 da ronda 7): nota a nota, em vez de apagar tudo e repor — o que este aparelho gravou DEPOIS de o
              // pacote partir (guardadoEm > inicio) e o que está por enviar (fila) ficam; só sai o que é de antes dele
              var gf = filaLoja.getAllKeys();
              gf.onsuccess = function(){
                var naFila = {}; (gf.result || []).forEach(function(n){ naFila[n] = true; });
                var gl = loja.getAll();
                gl.onsuccess = function(){
                  var locais = {}; (gl.result || []).forEach(function(v){ locais[v.nome] = v; });
                  var noPacote = {};
                  notas.forEach(function(v){
                    noPacote[v.nome] = true;
                    if(inicio != null){
                      if(lapides[v.nome] >= inicio || naFila[v.nome]) return;
                      if(locais[v.nome] && Number(locais[v.nome].guardadoEm) > inicio) return;
                    }
                    v.guardadoEm = inicio != null ? inicio : agora(); loja.put(v);   // ronda 7: guardadoEm
                  });
                  Object.keys(locais).forEach(function(n){
                    if(noPacote[n]) return;
                    if(inicio != null && (naFila[n] || Number(locais[n].guardadoEm) > inicio)) return;
                    loja.delete(n);
                  });
                  Object.keys(lapides).forEach(function(n){ if(inicio == null || lapides[n] < inicio) meta.delete("apagada:" + n); });
                  meta.put({chave:"pacoteGerado", valor: gerado});
                  meta.put({chave:"ultimaSync", valor: Date.now()});
                  if(inicio != null) meta.put({chave:"pacoteInicio", valor: inicio});
                };
              };
            };
            };
          });
        };
      };
      tx.oncomplete = function(){ resolve(!recusado && sg.valor !== "desligada"); };
      tx.onerror = function(){ reject(tx.error); };
      tx.onabort = function(){ reject(tx.error || new Error("transacção abortada")); };
    });
  });
}
/* ronda 6 (achado M8 da ronda 4): a nota sai da cópia E fica uma lápide em «meta» (apagada:<nome> = hora a que partiu o pedido que
   trouxe o 404/410, monótona). Um pacote que tenha partido ANTES dessa hora (atrasado) já não a repõe; um pacote posterior
   limpa as lápides anteriores a ele. */
/* ronda 7 (404/410 atrasado): só com a MESMA geração da cópia com que o pedido partiu, e só se a nota guardada é de antes
   dele (guardadoEm = hora do pedido/escrita que a pôs lá). Uma nota recriada que um pacote posterior já trouxe fica.
   Sem guardadoEm (cópias de antes desta versão) sai, como antes. */
function marcarApagadaAqui(nome, inicio, geracao){
  if(inicio == null) inicio = agora();
  EPOCA_MEM++;                                               // ronda 13: o que este separador tinha a meio da cópia já não se entrega
  return transacao(["notas", "meta"], function(tx, saida){
    seGeracaoIgual(tx, saida, geracao, function(){
      var meta = tx.objectStore("meta"), notas = tx.objectStore("notas"), n = notas.get(nome);
      n.onsuccess = function(){
        var local = n.result;
        if(local && Number(local.guardadoEm) > inicio){ saida.valor = "mais-nova"; return; }
        var g = meta.get("apagada:" + nome);
        g.onsuccess = function(){
          var q = (g.result && Number(g.result.valor)) || 0;
          meta.put({chave:"apagada:" + nome, valor: Math.max(q, inicio)});
          notas.delete(nome);
        };
      };
    });
  });
}
/* ronda 6 (achado G6 da ronda 4): a geração da cópia lê-se DENTRO da transacção que escreve — se já não é a que o pedido capturou,
   alguém apagou (e religou) a cópia entretanto e nada se escreve (saida.valor = "desligada"). Uma geração persistente acima
   da que este separador conhece (outro separador apagou, sem localStorage) passa a ser a dele. geracao == null: só isso. */
function seGeracaoIgual(tx, saida, geracao, fn, dono){
  // ronda 10 (achado G1 da r3): `dono` = o dono com que a edição foi ABERTA. Se este separador já mudou de conta, ou a cópia é de
  // outra, nada se escreve (saida.valor = "outra-conta") — antes comparava-se só com o DONO actual, que já podia ser o novo.
  if(dono !== undefined && DONO !== dono){ saida.valor = "outra-conta"; return; }
  var g = tx.objectStore("meta").get("geracao");
  g.onsuccess = function(){
    var actual = (g.result && Number(g.result.valor)) || 0;
    if(actual > GERACAO_COPIA) GERACAO_COPIA = actual;
    if(geracao != null && (actual !== geracao || GERACAO_COPIA !== geracao)){ saida.valor = "desligada"; return; }
    // ronda 8: a cópia passou a ser de outra conta (a página dela abriu noutro separador) — este já não escreve nela.
    // Sem dono gravado (cópia de antes desta versão, ainda por confirmar) não há com que comparar.
    var d = tx.objectStore("meta").get("dono");
    d.onsuccess = function(){
      var md = d.result ? d.result.valor : undefined;
      if(md !== undefined && md !== null && md !== DONO){ saida.valor = "desligada"; return; }
      fn();
    };
  };
}

/* ronda 8 (contas no mesmo browser): pergunta ao servidor quem está no browser (/api/eu, sem cache e sem seguir o login) e
   põe a cópia em nome dessa conta. Só depois disto se sincroniza. Falha (sem rede, sessão caída, servidor sem «dono"):
   DONO_OK fica falso e nada sobe nem desce — tenta-se outra vez na próxima sincronização. Um pedido de cada vez. */
function verificarDono(){
  if(DONO_A_VERIFICAR) return DONO_A_VERIFICAR;
  DONO_A_VERIFICAR = (async function(){
    try{
      var r = await fetch("/api/eu", {credentials:"same-origin", cache:"no-store", redirect:"manual"});
      // a sessão caiu (login, 401, 403 que não é «outra conta»): tranca-se como faria o pacote a seguir — sem isto, a
      // verificação do dono calava a tranca que o pedido do pacote punha
      if(r.type === "opaqueredirect" || r.status === 401 || (r.status === 403 && !ehOutraConta(r))){ await bloquearCopiaLocal(); return; }
      var tipo = (r.headers && r.headers.get && r.headers.get("content-type")) || "";
      if(!r.ok || !/json/i.test(tipo)) return;
      var eu = await r.json();
      if(!eu || typeof eu.dono !== "string" || !eu.dono) return;
      await trocarDono(eu.dono);
      DONO_OK = (DONO === eu.dono);
      if(DONO_OK && typeof eu.email === "string" && eu.email) await guardarContaDaCopia(eu.dono, eu.email);   // ronda 13 (pendente a)
      atualizarAvisoPendentes();                             // ronda 12 (A): o que ficou à parte (ex.: de uma versão anterior) vê-se
    }catch(e){}
  })();
  DONO_A_VERIFICAR.then(function(){ DONO_A_VERIFICAR = null; });
  return DONO_A_VERIFICAR;
}
/* ronda 13 (pendente a): o email da conta dona da cópia («meta.conta»), só se a cópia ainda for dela — é o que se diz quando o que
   ela deixar por enviar ficar à parte («São edições de outra conta (<email>)») */
function guardarContaDaCopia(dono, email){
  return transacao(["meta"], function(tx){
    var meta = tx.objectStore("meta"), gd = meta.get("dono");
    gd.onsuccess = function(){
      if(gd.result && gd.result.valor === dono) meta.put({chave: "conta", valor: {dono: dono, email: email}});
    };
  }).catch(function(){});
}
async function donoConfirmado(){
  if(OUTRA_CONTA) return false;
  if(!DONO_OK) await verificarDono();
  return DONO_OK && !OUTRA_CONTA;
}
/* ronda 8: a cópia passa a ser de `novo` ("" = ninguém: terminou a sessão). Mesmo dono: nada. Cópia sem dono gravado (de
   antes desta versão) e alguém a entrar: fica dele só se estiver VAZIA (ronda 9, achado G3 da ronda 2: não há como saber de quem
   eram as notas e as edições por enviar). Com alguma coisa, trata-se como de outra conta e o que havia por enviar fica à parte
   em «pendentes-de:?» — nunca sobe em nome de quem entrou.
   Outro dono: o que a conta anterior tinha por enviar (fila e conflitos) fica guardado À PARTE em «pendentes-de:<dono>» —
   nunca sobe em nome de outra conta e volta quando ela entrar outra vez —, a cópia (notas, cursores do pacote, lápides)
   apaga-se, e a geração sobe: nada que estivesse a meio (pacote, gravação, resposta do service worker) escreve nela. */
function juntarPorNome(velhos, novos){
  var vistos = {}, out = [];
  (novos || []).forEach(function(i){ vistos[i.nome] = true; out.push(i); });
  (velhos || []).forEach(function(i){ if(!vistos[i.nome]) out.push(i); });
  return out;
}
async function trocarDono(novo){
  var r = await transacao(["notas", "fila", "conflitos", "meta"], function(tx, saida){
    var meta = tx.objectStore("meta"), fila = tx.objectStore("fila"), confl = tx.objectStore("conflitos");
    saida.valor = {mudou: false};
    var gd = meta.get("dono");
    gd.onsuccess = function(){
      var antigo = gd.result ? gd.result.valor : undefined;
      if(antigo === novo) return;
      var semDono = (antigo === undefined || antigo === null);
      var gf = fila.getAll();
      gf.onsuccess = function(){
        var gc = confl.getAll();
        gc.onsuccess = function(){
          var gq = tx.objectStore("notas").count();
          gq.onsuccess = function(){
          if(semDono && novo && !gf.result.length && !gc.result.length && !gq.result){ meta.put({chave:"dono", valor: novo}); return; }
          // ronda 9: de quem não se sabe. Ronda 12: também com dono "" (depois de «Terminar sessão») — antes, o que lá estivesse
          // por enviar perdia-se aqui (nem ia para a fila de quem entrou, nem ficava à parte)

                  if(!i || typeof i.nome !== "string" || ocupado[i.nome] || !vistas[chavePendente("fila", i)]){ restoF.push(i); return; }
                  ocupado[i.nome] = true;
                  var item = {nome: i.nome, base_texto: i.base_texto, texto: i.texto, quando: i.quando || Date.now(), rev: i.rev || novaRevisao()};
                  fila.put(item);

                  var n = notas.get(i.nome);
                  n.onsuccess = function(){
                    var local = n.result;

                  };
                });
                (v.conflitos || []).forEach(function(c){
                  if(!c || typeof c.nome !== "string" || ocupado[c.nome] || !vistas[chavePendente("conflito", c)]){ restoC.push(c); return; }
                  ocupado[c.nome] = true;
                  confl.put(c);
                  saida.valor.conflitos++;

            };
          };
        }, dono); });

    }catch(e){ r = null; }
    if(!r || typeof r !== "object"){

    }

    await atualizarContadorFila();
    await atualizarAvisoPendentes();

    var partes = [];
    if(r.filas) partes.push(r.filas === 1 ? t("1 edição entrou na fila para enviar em teu nome") : tf("{n} edições entraram na fila para enviar em teu nome", {n: r.filas}));
    if(r.conflitos) partes.push(r.conflitos === 1 ? t("1 conflito passou para a nota, para o resolveres lá") : tf("{n} conflitos passaram para as notas, para os resolveres lá", {n: r.conflitos}));
    if(r.ficaram) partes.push(r.ficaram === 1 ? t("1 ficou guardada à parte: já há outra alteração dessa nota por enviar ou por resolver")
                                              : tf("{n} ficaram guardadas à parte: já há outras alterações dessas notas por enviar ou por resolver", {n: r.ficaram}));
    showToast(partes.length ? partes.join(" · ") + "." : t("não havia nada para enviar."));
    if(r.filas) sincronizarFila();

    A_ENVIAR_PENDENTES = false;
  }
}
/* «Descarregar»: tudo feito aqui (sem rede) — uma edição dá um .md; várias, um .zip sem compressão (um ficheiro por edição) */
function nomeFicheiroSeguro(s){
  var n = String(s == null ? "" : s).replace(/[\\\/:*?"<>|\u0000-\u001f]/g, "_").replace(/^\.+/, "_").slice(0, 120);
  return n || "nota";
}
var CRC32_TABELA = null;
function crc32(bytes){
  if(!CRC32_TABELA){
    CRC32_TABELA = new Uint32Array(256);
    for(var n = 0; n < 256; n++){
      var c = n;
      for(var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      CRC32_TABELA[n] = c >>> 0;
    }
  }
  var crc = 0xFFFFFFFF;
  for(var i = 0; i < bytes.length; i++) crc = CRC32_TABELA[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
  return (crc ^ 0xFFFFFFFF) >>> 0;
}
function zipSemCompressao(ficheiros){
  var enc = new TextEncoder(), partes = [], central = [], desloc = 0, d = new Date();
  var hora = ((d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1)) & 0xFFFF;
  var dia = ((Math.max(d.getFullYear() - 1980, 0) << 9) | ((d.getMonth() + 1) << 5) | d.getDate()) & 0xFFFF;
  ficheiros.forEach(function(f){
    var nome = enc.encode(f.nome), dados = enc.encode(f.texto), crc = crc32(dados);
    var loc = new DataView(new ArrayBuffer(30));                     // cabeçalho local (método 0 = guardado; 0x0800 = nome em UTF-8)
    loc.setUint32(0, 0x04034b50, true); loc.setUint16(4, 20, true); loc.setUint16(6, 0x0800, true); loc.setUint16(8, 0, true);
    loc.setUint16(10, hora, true); loc.setUint16(12, dia, true); loc.setUint32(14, crc, true);
    loc.setUint32(18, dados.length, true); loc.setUint32(22, dados.length, true); loc.setUint16(26, nome.length, true); loc.setUint16(28, 0, true);
    partes.push(loc.buffer, nome, dados);
    var cen = new DataView(new ArrayBuffer(46));                     // entrada do directório central
    cen.setUint32(0, 0x02014b50, true); cen.setUint16(4, 20, true); cen.setUint16(6, 20, true); cen.setUint16(8, 0x0800, true);
    cen.setUint16(10, 0, true); cen.setUint16(12, hora, true); cen.setUint16(14, dia, true); cen.setUint32(16, crc, true);
    cen.setUint32(20, dados.length, true); cen.setUint32(24, dados.length, true); cen.setUint16(28, nome.length, true);
    cen.setUint16(30, 0, true); cen.setUint16(32, 0, true); cen.setUint16(34, 0, true); cen.setUint16(36, 0, true);
    cen.setUint32(38, 0, true); cen.setUint32(42, desloc, true);
    central.push(cen.buffer, nome);
    desloc += 30 + nome.length + dados.length;
  });
  var tamCentral = central.reduce(function(s, p){ return s + p.byteLength; }, 0);
  var fim = new DataView(new ArrayBuffer(22));
  fim.setUint32(0, 0x06054b50, true); fim.setUint16(4, 0, true); fim.setUint16(6, 0, true);
  fim.setUint16(8, ficheiros.length, true); fim.setUint16(10, ficheiros.length, true);
  fim.setUint32(12, tamCentral, true); fim.setUint32(16, desloc, true); fim.setUint16(20, 0, true);
  return new Blob(partes.concat(central, [fim.buffer]), {type: "application/zip"});
}
function descarregarBlob(blob, nome){
  var url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = nome; a.style.display = "none";
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 2000);
}
function descarregarPendentes(){
  var itens = PENDENTES_ULTIMO.itens || [];
  if(!itens.length) return;
  descarregarItensPendentes(itens, "basalt-edicoes-por-enviar-");
}
function descarregarItensPendentes(itens, prefixo){
  var usados = {}, ficheiros = itens.map(function(i){
    var base = nomeFicheiroSeguro(i.nome) + (i.tipo === "conflito" ? " (" + t("conflito") + ")" : ""), nome = base + ".md", k = 2;
    while(usados[nome.toLowerCase()]){ nome = base + " (" + k + ").md"; k++; }
    usados[nome.toLowerCase()] = true;
    return {nome: nome, texto: i.texto};
  });
  if(ficheiros.length === 1){
    descarregarBlob(new Blob([ficheiros[0].texto], {type: "text/markdown;charset=utf-8"}), ficheiros[0].nome);
    return;
  }
  var d = new Date(), dois = function(x){ return (x < 10 ? "0" : "") + x; };
  descarregarBlob(zipSemCompressao(ficheiros), prefixo + d.getFullYear() + "-" + dois(d.getMonth() + 1) + "-" + dois(d.getDate()) + ".zip");
}
async function esconderAvisoPendentes(){
  try{ await idbPut("meta", {chave: PENDENTES_ESCONDIDO, valor: {assinatura: PENDENTES_ULTIMO.assinatura, dono: DONO}}); }catch(e){}
  mostrarAvisoPendentes(0);
  showToast(t("aviso escondido. As edições continuam guardadas neste aparelho: estão no Início, em «Edições guardadas à parte neste aparelho»."));
}
/* ronda 6 G6: a geração que vale AGORA — a persistente, posta em dia com a deste separador nos dois sentidos (a IndexedDB
   pode ter sido limpa pelo browser e o localStorage não, ou o contrário). É o que cada pedido captura antes de partir. */
function geracaoActual(){
  return transacao(["meta"], function(tx, saida){
    var meta = tx.objectStore("meta"), g = meta.get("geracao");
    saida.valor = GERACAO_COPIA;
    g.onsuccess = function(){
      var actual = (g.result && Number(g.result.valor)) || 0;
      if(actual > GERACAO_COPIA) GERACAO_COPIA = actual;
      else if(actual < GERACAO_COPIA) meta.put({chave:"geracao", valor: GERACAO_COPIA});
      saida.valor = GERACAO_COPIA;
    };
  }).catch(function(){ return GERACAO_COPIA; });
}

/* cada gravação na fila leva uma REVISÃO nova. A sincronização só apaga da fila a revisão que enviou — se
   entretanto se guardou outra (B depois de A), essa fica, com a base passada para o texto que acabou de subir. Tudo em
   transacções (ler + escrever juntos), e só um separador de cada vez sincroniza (Web Locks). */
function novaRevisao(){ return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10); }

function transacao(lojas, fn){
  return abrirDB().then(function(db){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(lojas, "readwrite"), saida = {valor: undefined};
      fn(tx, saida);
      tx.oncomplete = function(){ resolve(saida.valor); };
      tx.onerror = function(){ reject(tx.error); };
      tx.onabort = function(){ reject(tx.error || new Error(t("transacção abortada"))); };
    });
  });
}

/* nenhum destes escritores (fila/conflitos/notas) escreve com a cópia apagada — a marca lê-se DENTRO da
   transacção, como no pacote: «apagar cópia» ou fica antes (e vê-se a marca) ou depois (e limpa isto), nunca no meio. */
function erroCopiaDesligada(){
  return new Error(t("a cópia deste aparelho está apagada — não guardo edições aqui até voltares a ligar a cópia (no Início)"));
}
function erroCopiaRefeita(){
  return new Error(t("a cópia deste aparelho foi apagada entretanto (noutro separador) — não guardo esta edição nela; copia o teu texto e grava outra vez"));
}
function seCopiaLigada(tx, saida, fn){
  var gd = tx.objectStore("meta").get("copiaDesligada");
  gd.onsuccess = function(){
    if((gd.result && gd.result.valor) || COPIA_DESLIGADA){ saida.valor = "desligada"; return; }
    fn();
  };
}
/* ronda 7 (geração na gravação offline): `geracao` é a da cópia quando a edição começou a gravar — se outro separador apagou
   e religou a cópia entretanto (sem localStorage este não sabe), a edição é de uma cópia que já não existe: não entra */
function guardarEdicaoOffline(nome, baseTexto, texto, geracao, dono){
  if(COPIA_DESLIGADA) return Promise.reject(erroCopiaDesligada());
  if(dono !== undefined && DONO !== dono) return Promise.reject(erroEdicaoDeOutraConta());   // ronda 10 (G1)
  return transacao(["fila", "notas", "meta"], function(tx, saida){
    var fila = tx.objectStore("fila"), notas = tx.objectStore("notas");
    seCopiaLigada(tx, saida, function(){ seGeracaoIgual(tx, saida, geracao, function(){
      var g = fila.get(nome);
      g.onsuccess = function(){
        var item = g.result || {nome: nome, base_texto: baseTexto};
        item.texto = texto;
        item.quando = Date.now();
        item.rev = novaRevisao();
        fila.put(item);
        var n = notas.get(nome);
        n.onsuccess = function(){
          var local = n.result;
          if(local) instanteNaTx(tx, function(q){ local.texto = texto; local.porEnviar = true; local.guardadoEm = q; notas.put(local); });   // ronda 9 (achado 4 da ronda 8)
        };
      };
    }, dono); });
  }).then(function(v){
    if(v === "outra-conta") throw erroEdicaoDeOutraConta();
    if(v === "desligada") throw (COPIA_DESLIGADA ? erroCopiaDesligada() : erroCopiaRefeita());
    return atualizarContadorFila();
  });
}
/* ronda 10 (achado G1 da r3): uma edição aberta com a conta A, que este separador só vai gravar depois de ter passado a ser de B
   (abriu sem rede com a cópia de A, e entretanto B entrou), NUNCA sobe nem fica na cópia de B. Fica à parte em
   «pendentes-de:A» — como o resto do que A tinha por enviar (trocarDono) — e sobe em nome de A quando A voltar a entrar.
   Se a cópia voltou entretanto a ser de A (outro separador), vai directa para a fila dela. Sem dono conhecido (""): não se guarda
   (não se sabe de quem é) — o texto fica no editor, com o botão de copiar.
   Ronda 13 (achado 3 da revisão externa r4): a fila da cópia de A só com as guardas dos outros escritores da fila — a cópia
   ligada e a MESMA geração (`geracao`, a de quando se começou a gravar) lidas dentro desta transacção. Se A apagou a cópia
   entretanto (ou a apagou e religou), devolve "desligada" e nada se escreve. */
function guardarEdicaoDeOutraConta(dono, nome, baseTexto, texto, geracao){
  if(!dono) return Promise.resolve("sem-dono");
  return transacao(["fila", "meta"], function(tx, saida){
    var meta = tx.objectStore("meta"), gd = meta.get("dono");
    saida.valor = "pendente";
    gd.onsuccess = function(){
      var actual = gd.result ? gd.result.valor : undefined;
      function item(ja){
        var i = {nome: nome, base_texto: ja && ja.base_texto != null ? ja.base_texto : baseTexto, texto: texto, quando: Date.now(), rev: novaRevisao()};
        return i;
      }
      if(actual === dono){                                   // a cópia é outra vez de A: fila normal dela
        seCopiaLigada(tx, saida, function(){                 // ronda 13 (r4-3): com a cópia apagada, não
          var gg = meta.get("geracao");
          gg.onsuccess = function(){
            var gv = (gg.result && Number(gg.result.valor)) || 0;
            if(gv > GERACAO_COPIA) GERACAO_COPIA = gv;
            if(geracao != null && (gv !== geracao || GERACAO_COPIA !== geracao)){ saida.valor = "desligada"; return; }
            var fila = tx.objectStore("fila"), gf = fila.get(nome);
            gf.onsuccess = function(){ fila.put(item(gf.result)); saida.valor = "fila"; };
          };
        });
        return;
      }
      var gp = meta.get("pendentes-de:" + dono);
      gp.onsuccess = function(){
        var ja = gp.result || {chave: "pendentes-de:" + dono, fila: [], conflitos: []};
        var antes = (ja.fila || []).filter(function(i){ return i.nome === nome; })[0];
        meta.put({chave: "pendentes-de:" + dono, fila: juntarPorNome(ja.fila, [item(antes)]), conflitos: ja.conflitos || [], conta: ja.conta || null});
      };
    };
  });
}
function erroEdicaoDeOutraConta(){
  var e = new Error(t("esta nota foi aberta com outra conta, e entretanto entrou outra neste browser — não gravei em nome da conta nova."));
  e.edicaoDeOutraConta = true;
  return e;
}

/* a revisão `rev` subiu: tira-a da fila SÓ se ainda for a que lá está; devolve "removida" ou "mais-nova" */
function confirmarEnvioFila(nome, rev, textoEnviado, textoServidor, hash, geracao){
  return transacao(["fila", "notas", "meta"], function(tx, saida){
    var fila = tx.objectStore("fila"), notas = tx.objectStore("notas");
    saida.valor = "removida";
    seCopiaLigada(tx, saida, function(){ seGeracaoIgual(tx, saida, geracao, function(){   // ronda 6 G6
      var g = fila.get(nome);
      g.onsuccess = function(){
        var item = g.result, maisNova = !!(item && item.rev !== rev);
        if(item && !maisNova) fila.delete(nome);
        if(maisNova){ item.base_texto = textoEnviado; fila.put(item); saida.valor = "mais-nova"; }
        var n = notas.get(nome);
        n.onsuccess = function(){
          var local = n.result;
          if(!local) return;
          local.hash = hash;
          if(!maisNova){ local.texto = textoServidor; local.porEnviar = false; }
          instanteNaTx(tx, function(q){ local.guardadoEm = q; notas.put(local); });   // ronda 9 (achado 4 da ronda 8)
        };
      };
    }); });
  });
}

/* conflito na revisão `rev`: se entretanto há uma revisão mais nova, é ESSA que entra no conflito como «a tua» */
function registarConflitoFila(nome, rev, d, geracao){
  return transacao(["fila", "conflitos", "meta"], function(tx, saida){
    var fila = tx.objectStore("fila"), conflitos = tx.objectStore("conflitos");
    seCopiaLigada(tx, saida, function(){ seGeracaoIgual(tx, saida, geracao, function(){   // ronda 6 G6
      var g = fila.get(nome);
      g.onsuccess = function(){
        var item = g.result, maisNova = !!(item && item.rev !== rev);
        conflitos.put({
          nome: nome, actual: d.actual, teu: maisNova ? item.texto : d.teu, hash_actual: d.hash_actual, copia: d.copia,
          proposta: maisNova ? null : (d.proposta || null), proposta_hash: maisNova ? null : (d.proposta_hash || null),
          proposta_tipo: maisNova ? null : (d.proposta_tipo || "ia"),
          resumo: maisNova ? "" : (d.resumo || ""), quando: Date.now(),
          rev: item ? item.rev : rev                            // ronda 9 (achado G3 da ronda 2): a revisão que ficou «a tua»
        });
        if(item) fila.delete(nome);
      };
    }); });
  });
}

/* gravou-se com rede. Sai da fila SÓ a revisão `revIncluida` (null = nenhuma: o editor com rede nunca parte de
   uma edição por enviar). Outra revisão — de outro separador, ou guardada durante o pedido — fica na fila com a base DELA:
   sobe depois pela junção de 3 vias, nunca por cima desta gravação (e a cópia do aparelho continua a mostrá-la). */
function confirmarGravacaoComRede(nome, revIncluida, texto, hash, geracao){
  return transacao(["fila", "notas", "meta"], function(tx, saida){
    var fila = tx.objectStore("fila"), notas = tx.objectStore("notas");
    saida.valor = "sem-fila";
    // ronda 6 (achado G6 da ronda 4): a cópia apagada — ou apagada E religada (geração diferente) — enquanto o PUT corria: não se
    // escreve nela (saida.valor = "desligada"); a verificação é DENTRO da transacção, não antes de a abrir
    seCopiaLigada(tx, saida, function(){ seGeracaoIgual(tx, saida, geracao, function(){
    var g = fila.get(nome);
    g.onsuccess = function(){
      var item = g.result, ficou = !!item && (revIncluida == null || item.rev !== revIncluida);
      if(item && !ficou){ fila.delete(nome); saida.valor = "removida"; }
      if(ficou) saida.valor = "ficou";
      var n = notas.get(nome);
      n.onsuccess = function(){
        var local = n.result;
        if(!local || ficou) return;
        instanteNaTx(tx, function(q){                                 // ronda 9 (achado 4 da ronda 8): a hora do contador partilhado
          local.texto = texto; local.hash = hash; local.porEnviar = false; local.guardadoEm = q;
          notas.put(local);
        });
      };
    };
    }); });
  });
}
/* altera o conflito guardado só se ainda é o que está no ecrã (mesmo `quando`); devolve true se alterou */
function alterarConflitoSeIgual(nome, quando, alterar, geracao){
  return transacao(["conflitos", "meta"], function(tx, saida){
    var loja = tx.objectStore("conflitos");
    saida.valor = false;
    seGeracaoIgual(tx, saida, geracao, function(){                 // ronda 6 G6 (geracao opcional)
      var g = loja.get(nome);
      g.onsuccess = function(){
        if(!g.result || g.result.quando !== quando) return;
        alterar(g.result); loja.put(g.result); saida.valor = true;
      };
    });
  });
}
/* apaga o conflito só se ainda é o que está no ecrã (outro separador pode ter registado um mais novo) */
function apagarConflitoSeIgual(nome, quando, geracao){
  return transacao(["conflitos", "meta"], function(tx, saida){
    var loja = tx.objectStore("conflitos");
    seGeracaoIgual(tx, saida, geracao, function(){                 // ronda 6 G6 (geracao opcional)
      var g = loja.get(nome);
      g.onsuccess = function(){ if(g.result && g.result.quando === quando) loja.delete(nome); };
    });
  });
}
/* ronda 9 (achado 5 da ronda 7): «ficar com a do servidor» numa SÓ transacção — o conflito tem de ser ainda o do ecrã (mesmo
   `quando`) e a cópia a mesma geração (e o mesmo dono) de quando ele foi mostrado; só então sai, e da fila só a REVISÃO que o
   conflito guardou como «a tua» (achado G3 da ronda 2: o texto igual não prova que é a mesma edição — nem a mesma conta).
   Devolve "ok", "outra" (há outra alteração por enviar, que fica), "mudou" ou "desligada" (nada se tocou). */
function ficarComServidor(nome, quando, geracao){
  return transacao(["conflitos", "fila", "meta"], function(tx, saida){
    var conflitos = tx.objectStore("conflitos"), fila = tx.objectStore("fila");
    saida.valor = "mudou";
    seGeracaoIgual(tx, saida, geracao, function(){
      var gc = conflitos.get(nome);
      gc.onsuccess = function(){
        if(!gc.result || gc.result.quando !== quando) return;
        conflitos.delete(nome);
        saida.valor = "ok";
        var gf = fila.get(nome);
        gf.onsuccess = function(){
          if(!gf.result) return;
          if(gc.result.rev != null && gf.result.rev === gc.result.rev) fila.delete(nome); else saida.valor = "outra";
        };
      };
    });
  });
}

function atualizarNotaCacheAposGravar(nome, texto, hash){
  return idbGet("notas", nome).then(function(local){
    if(!local) return;
    local.texto = texto;
    local.hash = hash;
    local.porEnviar = false;
    local.guardadoEm = agora();
    return idbPut("notas", local);
  }).catch(function(){});
}

var A_SINCRONIZAR_FILA = false;
function sincronizarFila(){
  if(!navigator.onLine || A_SINCRONIZAR_FILA) return Promise.resolve();
  if(navigator.locks && navigator.locks.request){
    return navigator.locks.request("basalt-fila", {ifAvailable: true}, function(lock){
      return lock ? sincronizarFilaAqui() : undefined;     // outro separador já está a sincronizar
    }).catch(function(){});
  }
  return sincronizarFilaAqui();
}
async function sincronizarFilaAqui(){
  if(A_SINCRONIZAR_FILA || COPIA_DESLIGADA) return;
  if(!(await donoConfirmado())) return;                    // ronda 8: a fila sobe só em nome da conta de quem é
  var pendentes, geracao = await geracaoActual();          // ronda 6 G6: a geração persistente
  // ronda 10 (G1/G2 da r3): o dono e a fila lêem-se na MESMA transacção, e cada envio leva esse dono (apiSend recusa se o
  // separador mudar de conta a meio) — antes, uma troca entre as duas leituras, ou dentro do apiSend, enviava a fila de A como B
  var donoFila = DONO;
  try{
    pendentes = await transacao(["fila", "meta"], function(tx, saida){
      saida.valor = null;
      seGeracaoIgual(tx, saida, geracao, function(){
        var gf = tx.objectStore("fila").getAll();
        gf.onsuccess = function(){ saida.valor = gf.result || []; };
      }, donoFila);
    });
  }catch(e){ return; }
  if(!Array.isArray(pendentes) || DONO !== donoFila) return;
  if(!pendentes.length) return;
  A_SINCRONIZAR_FILA = true;
  OFFLINE_ESTADO.aSincronizar = true;
  atualizarIndicador();
  // «apagar cópia» a meio (neste ou noutro separador) pára o ciclo — o que o utilizador descartou não sobe
  function apagada(){ return COPIA_DESLIGADA || OUTRA_CONTA || geracao !== GERACAO_COPIA || DONO !== donoFila; }   // ronda 8: ou entrou outra conta
  try{
    for(var i = 0; i < pendentes.length; i++){
      var item = pendentes[i];
      if(apagada()) break;
      try{
        var res = await apiSend("POST", "/api/sincronizar", {nome: item.nome, base_texto: item.base_texto, texto: item.texto}, {dono: donoFila});
        if(apagada()) break;
        if(res.estado === "gravado"){
          await confirmarEnvioFila(item.nome, item.rev, item.texto, item.texto, res.hash, geracao);
        }else if(res.estado === "juntado"){
          await confirmarEnvioFila(item.nome, item.rev, item.texto, res.texto, res.hash, geracao);
          showToast(tf("a tua edição de «{nome}» foi juntada: {resumo}.", {nome: item.nome, resumo: res.resumo || t("sem perdas detectadas")}));
        }
      }catch(e){
        if(apagada()) break;
        if(e.status === 409 && e.data && e.data.estado === "conflito"){
          await registarConflitoFila(item.nome, item.rev, e.data, geracao);
          showToast(tf("conflito em «{nome}» — resolve na nota.", {nome: item.nome}));
        }else if(e.status === 503 || e.status === 429){
          break;          // servidor ocupado: fica tudo na fila e tenta-se no próximo ciclo
        }
        // falha de rede a meio ou outro erro transitório: fica na fila, tenta-se de novo no próximo ciclo
      }
      await atualizarContadorFila();
    }
  }finally{
    A_SINCRONIZAR_FILA = false;
    OFFLINE_ESTADO.aSincronizar = false;
    atualizarIndicador();
  }
}

/* ---- leitura sem rede: /api/notas, /api/nota, /api/procura (só texto), /api/grafo, /api/categorias ---- */
/* ronda 10 (achado G2 da r3): as notas da cópia lêem-se na MESMA transacção em que se confirma que a cópia está ligada, não
   trancada, na geração que este separador conhece e em nome do DONO dele. Antes o dono via-se numa transacção e as notas liam-se
   noutra: entre as duas, outro separador (ou este) podia trocar de conta e guardar o pacote de B — e a página de A mostrava-o.
   Depois da transacção volta-se a ver se nada mudou neste separador (dono, geração, cópia apagada, outra conta). Falha =
   «não há cópia» (precisa de rede), nunca dados de outra. */
function erroCopiaNaoVerificada(){
  var e = new Error(t("precisa de rede"));
  e.copiaNaoVerificada = true;
  e.semRede = true;
  return e;
}
async function notasDaCopia(){
  var dono = DONO, g = GERACAO_COPIA;
  if(COPIA_DESLIGADA || OUTRA_CONTA) throw erroCopiaNaoVerificada();
  var r = await transacao(["notas", "meta"], function(tx, saida){
    seCopiaLigada(tx, saida, function(){ seGeracaoIgual(tx, saida, g, function(){
      var b = tx.objectStore("meta").get("bloqueada");
      b.onsuccess = function(){
        if(b.result && b.result.valor){ saida.valor = "trancada"; return; }
        var ga = tx.objectStore("notas").getAll();
        ga.onsuccess = function(){ saida.valor = {notas: ga.result || []}; };
      };
    }, dono); });
  });
  if(r === "trancada") throw erroCopiaTrancada();
  if(!r || typeof r !== "object" || DONO !== dono || GERACAO_COPIA !== g || COPIA_DESLIGADA || OUTRA_CONTA || COPIA_BLOQUEADA)
    throw erroCopiaNaoVerificada();
  return r.notas;
}
/* ronda 13 (achado 2 da revisão externa r4): o que a vista da nota põe por cima do texto do servidor — a edição por enviar e o
   conflito por resolver — lê-se com as guardas de notasDaCopia(): numa SÓ transacção que confirma a cópia ligada, não trancada,
   na geração `g` e em nome de `dono` (a conta com que a nota foi lida). Antes eram dois idbGet() soltos: entre eles e a
   verificação do dono, outro separador podia trocar a cópia para B — e a vista de A mostrava a fila ou o conflito de B.
   Falha = nada por cima (fica o texto do servidor), nunca o que é de outra conta. */
async function filaEConflitoDaCopia(nome, dono, g){
  var nada = {fila: null, conflito: null};
  if(COPIA_DESLIGADA || OUTRA_CONTA) return nada;
  var r = await transacao(["fila", "conflitos", "meta"], function(tx, saida){
    seCopiaLigada(tx, saida, function(){ seGeracaoIgual(tx, saida, g, function(){
      var b = tx.objectStore("meta").get("bloqueada");
      b.onsuccess = function(){
        if(b.result && b.result.valor){ saida.valor = "trancada"; return; }
        var c = tx.objectStore("conflitos").get(nome);
        c.onsuccess = function(){
          var f = tx.objectStore("fila").get(nome);
          f.onsuccess = function(){ saida.valor = {fila: f.result || null, conflito: c.result || null}; };
        };
      };
    }, dono); });
  }).catch(function(){ return null; });
  if(!r || typeof r !== "object" || DONO !== dono || GERACAO_COPIA !== g || COPIA_DESLIGADA || OUTRA_CONTA || COPIA_BLOQUEADA) return nada;
  return r;
}
function escaparRegex(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

function offlineListaNotas(){
  return notasDaCopia().then(function(notas){
    return notas.slice().sort(function(a, b){ return (b.mtime||0) - (a.mtime||0); });
  });
}
function offlineNota(nome){
  return notasDaCopia().then(function(todas){
    var alvo = null;
    for(var i = 0; i < todas.length; i++){ if(todas[i].nome === nome){ alvo = todas[i]; break; } }
    if(!alvo){ var e = new Error(t("Nota não encontrada na cópia deste aparelho.")); e.status = 404; throw e; }
    var alvoBase = nome.indexOf(":") !== -1 ? nome.split(":").slice(1).join(":") : nome;
    var rx = new RegExp("\\[\\[" + escaparRegex(alvoBase) + "(?:[#|][^\\]]*)?\\]\\]");
    var backlinks = [];
    todas.forEach(function(o){
      if(o.nome === nome) return;
      var linhas = String(o.texto || "").split("\n");
      for(var li = 0; li < linhas.length; li++){
        if(rx.test(linhas[li])){
          backlinks.push({nome: o.nome, contexto: linhas[li].trim().replace(/\s+/g, " ").slice(0, 220)});
          break;
        }
      }
    });
    return {
      nome: alvo.nome, projeto: alvo.projeto, editavel: alvo.editavel,
      texto: alvo.texto, hash: alvo.hash,
      meta: {name: alvo.titulo, description: alvo.desc, type: alvo.tipo},
      backlinks: backlinks, parecidas: [], historico: [], categorias: alvo.categorias || []
    };
  });
}
function offlineGrafo(){
  return notasDaCopia().then(function(todas){
    var ids = {}, baseDe = {};
    todas.forEach(function(o){
      ids[o.nome] = true;
      var base = o.nome.indexOf(":") !== -1 ? o.nome.split(":").slice(1).join(":") : o.nome;
      baseDe[base] = o.nome;
    });
    var links = [], grau = {}, ligRx = /\[\[([^\]|#]+)(?:#[^\]|]*)?(?:\|[^\]]*)?\]\]/g;
    todas.forEach(function(o){
      var texto = String(o.texto || ""), vistos = {}, m;
      ligRx.lastIndex = 0;
      while((m = ligRx.exec(texto))){
        var alvoNome = m[1].trim();
        var t = ids[alvoNome] ? alvoNome : baseDe[alvoNome];
        if(t && t !== o.nome && !vistos[t]){
          vistos[t] = true;
          links.push({source: o.nome, target: t});
          grau[o.nome] = (grau[o.nome]||0) + 1;
          grau[t] = (grau[t]||0) + 1;
        }
      }
    });
    return {nodes: todas.map(function(o){ return {id:o.nome, tipo:o.tipo, grau: grau[o.nome]||0, projeto:o.projeto}; }), links: links};
  });
}
function offlineCategorias(){
  return notasDaCopia().then(function(todas){
    var conta = {}, porNota = {};
    todas.forEach(function(o){
      var cats = o.categorias || [];
      porNota[o.nome] = cats;
      cats.forEach(function(c){ conta[c] = (conta[c]||0) + 1; });
    });
    var lista = Object.keys(conta).map(function(k){ return {nome:k, n:conta[k]}; }).sort(function(a, b){ return b.n - a.n; });
    return {categorias: lista, notas: porNota};
  });
}
function extrairTrecho(texto, q){
  var norm = normalizarBusca(texto), qn = normalizarBusca(q);
  var i = norm.indexOf(qn);
  if(i === -1) return String(texto).slice(0, 140);
  var ini = Math.max(0, i - 50), fim = Math.min(texto.length, i + qn.length + 80);
  return (ini > 0 ? "…" : "") + texto.slice(ini, fim).replace(/\s+/g, " ").trim() + (fim < texto.length ? "…" : "");
}
function offlineProcura(q, n){
  return notasDaCopia().then(function(todas){
    var out = [{titulo: t("pesquisa sem rede — só texto"), trecho: "", fonte: ""}];
    var qn = normalizarBusca(q || "");
    if(!qn) return out;
    var achados = [];
    todas.forEach(function(o){
      var alvo = normalizarBusca((o.titulo||"") + " " + (o.desc||"") + " " + (o.texto||""));
      var pos = alvo.indexOf(qn);
      if(pos === -1) return;
      var origem = String(o.texto || o.desc || o.titulo || "");
      achados.push({nome: o.nome, titulo: o.titulo, trecho: extrairTrecho(origem, q), fonte: t("neste aparelho"), sim: pos === 0 ? 1 : 0.7});
    });
    achados.sort(function(a, b){ return b.sim - a.sim; });
    return out.concat(achados.slice(0, n || 10));
  });
}
async function tentarOffline(path){
  if(COPIA_DESLIGADA || lerLocal("basalt-copia-desligada") === "1" || await marcaPersistente("copiaDesligada")) return undefined;
  if(await copiaTrancadaAqui()) throw erroCopiaTrancada();   // inclui a tranca que só o service worker pôs
  if(OUTRA_CONTA) return undefined;                         // ronda 8: a cópia já não é deste separador
  try{ var mdLer = await idbGet("meta", "dono"); if(mdLer && mdLer.valor !== DONO) return undefined; }catch(e){ return undefined; }
  var u = path.split("?")[0];
  var qs = new URLSearchParams(path.indexOf("?") !== -1 ? path.split("?")[1] : "");
  try{                                                      // ronda 10 (G2): a cópia não se confirmou na leitura → como se não houvesse
    if(u === "/api/notas") return await offlineListaNotas();
    if(u === "/api/nota") return await offlineNota(qs.get("nome") || "");
    if(u === "/api/procura") return await offlineProcura(qs.get("q") || "", parseInt(qs.get("n") || "10", 10));
    if(u === "/api/grafo") return await offlineGrafo();
    if(u === "/api/categorias") return await offlineCategorias();
  }catch(e){
    if(e && e.copiaNaoVerificada) return undefined;
    throw e;
  }
  return undefined;
}

/* ---- apagar a cópia deste aparelho (IndexedDB + caches do service worker) ----
   apagar DESLIGA a cópia — cancela o pedido em curso, impede o temporizador, o «online» e o service worker
   de a repor, e recarrega a página para não ficar nada em memória. Volta-se a ligar no mesmo sítio, no Início. */
function abrirApagarCopiaModal(){
  if(COPIA_DESLIGADA){ religarCopiaLocal(); return; }
  idbGetAll("fila").then(function(pendentes){
    var root = document.getElementById("modal-root");
    var aviso = pendentes.length
      ? '<p class="state-error">' + (pendentes.length === 1
          ? tf("⚠️ Tens {n} alteração por enviar — vais perdê-la(s) se apagares agora.", {n: pendentes.length})
          : tf("⚠️ Tens {n} alterações por enviar — vais perdê-la(s) se apagares agora.", {n: pendentes.length})) + "</p>"
      : '<p class="dim-note">' + t("Isto não apaga nada no servidor — só a cópia guardada neste aparelho para funcionar sem rede. Este aparelho deixa de guardar cópia até voltares a ligar (no Início).") + "</p>";
    root.innerHTML =
      '<div class="modal-backdrop" id="apagar-copia-backdrop">' +
        '<div class="modal" role="dialog" aria-modal="true"><h2>' + t("Apagar cópia deste aparelho") + '</h2>' + aviso +
          '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">' +
            '<button id="apagar-copia-cancelar" class="btn" type="button">' + t("Cancelar") + '</button>' +
            '<button id="apagar-copia-confirmar" class="btn btn-primary" type="button">' + t("Apagar") + '</button>' +
          "</div></div></div>";
    var backdrop = document.getElementById("apagar-copia-backdrop");
    function fechar(){ root.innerHTML = ""; }
    backdrop.addEventListener("click", function(e){ if(e.target === backdrop) fechar(); });
    document.getElementById("apagar-copia-cancelar").addEventListener("click", fechar);
    document.getElementById("apagar-copia-confirmar").addEventListener("click", async function(){
      try{
        await desligarCopiaLocal();
        fechar();
        gravarLocal("basalt-aviso-pos-recarga", t("cópia deste aparelho apagada — deixou de guardar cópia até voltares a ligar."));
        location.reload();
      }catch(e){ showToast(tf("falhou a apagar: {erro}", {erro: e.message})); }
    });
  });
}

async function desligarCopiaLocal(){
  COPIA_DESLIGADA = true;
  GERACAO_COPIA++;
  gravarLocal("basalt-copia-desligada", "1");
  gravarLocal("basalt-copia-geracao", String(GERACAO_COPIA));   // ronda 6 G6: os outros separadores sobem a geração por aqui
  if(PACOTE_CONTROLO){ try{ PACOTE_CONTROLO.abort(); }catch(e){} }
  await comecarRevogacao();                                  // ronda 13: a época antes de apagar (ver lerEpocaCopia)
  // marca + limpeza numa SÓ transacção (um pacote de outro separador não entra no meio)
  // ronda 6 (achado G6 da ronda 4): a geração fica também em «meta», na mesma transacção, sempre acima da que lá estava — quem
  // escreve na cópia compara-a DENTRO da sua transacção (mesmo sem localStorage, ou com o pedido já em curso)
  var nova = await transacao(["notas", "fila", "meta", "conflitos"], function(tx, saida){
    var meta = tx.objectStore("meta"), g = meta.get("geracao");
    saida.valor = GERACAO_COPIA;
    g.onsuccess = function(){
      var n = Math.max(((g.result && Number(g.result.valor)) || 0) + 1, GERACAO_COPIA);
      saida.valor = n;
      // ronda 8: o que OUTRAS contas deixaram por enviar neste browser (guardado à parte) não é de quem apaga — fica
      var gp = meta.getAll(IDBKeyRange.bound("pendentes-de:", "pendentes-de:\uffff"));
      gp.onsuccess = function(){ var gd = meta.get("dono"); gd.onsuccess = function(){
        var deOutras = gp.result || [], dono = gd.result;
        ["notas", "fila", "meta", "conflitos"].forEach(function(l){ tx.objectStore(l).clear(); });
        deOutras.forEach(function(v){ meta.put(v); });
        if(dono) meta.put(dono);
        meta.put({chave:"copiaDesligada", valor:true});
        meta.put({chave:"geracao", valor:n});
      }; };
    };
  });
  if(nova > GERACAO_COPIA){ GERACAO_COPIA = nova; gravarLocal("basalt-copia-geracao", String(nova)); }
  if("caches" in window){
    var limpar = async function(){
      // ronda 7 (geração): 0.º a geração nova da cópia — um pedido do SW que partiu antes não guarda nada, mesmo que a cópia
      // seja religada antes de a resposta chegar
      try{ await (await caches.open(MARCA_GERACAO)).put("/__geracao", new Response(String(GERACAO_COPIA) + "-" + Math.random().toString(36).slice(2, 10))); }catch(e){}
      await caches.open(MARCA_DESLIGADA);          // 1.º a marca (o service worker deixa de guardar e de servir), depois apagar
      var nomes = await caches.keys();
      await Promise.all(nomes.filter(function(n){ return n.indexOf("basalt-") === 0; }).map(function(n){ return caches.delete(n); }));
    };
    var r = await comTrincoCopia("exclusive", limpar);   // ronda 9: o service worker não guarda nada a meio
    if(!r.ok) await limpar();                            // apagar nunca fica por fazer
  }
  await acabarRevogacao();                               // ronda 13
  OFFLINE_ESTADO.quando = null;
}

/* ronda 9 (achado 2 da ronda 7): a versão do protocolo da cópia que esta página espera do service worker. O SW activo (o que
   serve TODOS os separadores) responde a {tipo:"protocolo"}; um SW antigo não responde. */
var PROTOCOLO_COPIA = 5;   // ronda 9: 4 = cache da API por dono; ronda 13: 5 = época da cópia (X-Basalt-Epoca) e aviso «revogada»
function perguntarProtocolo(sw, ms){
  return new Promise(function(resolve){
    var feito = false, canal;
    var relogio = setTimeout(function(){ if(!feito){ feito = true; resolve(0); } }, ms);
    try{
      canal = new MessageChannel();
      canal.port1.onmessage = function(e){
        if(feito) return;
        feito = true; clearTimeout(relogio);
        resolve(Number(e.data && e.data.protocolo) || -1);       // respondeu, mas sem número: diferente (definitivo)
      };
      sw.postMessage({tipo:"protocolo"}, [canal.port2]);
    }catch(e){ if(!feito){ feito = true; clearTimeout(relogio); resolve(0); } }
  });
}
// {ok:true} sem service worker activo (os pedidos não passam por nenhum) ou com um que fala este protocolo
async function swDaCopiaPronto(){
  if(!("serviceWorker" in navigator)) return {ok:true};
  var reg = null;
  try{ reg = await navigator.serviceWorker.getRegistration(); }catch(e){}
  var sw = (reg && reg.active) || navigator.serviceWorker.controller;
  if(!sw) return {ok:true};
  var p = await perguntarProtocolo(sw, 5000);
  return {ok: p === PROTOCOLO_COPIA, reg: reg};   // ronda 9 (achado 5 da ronda 8): só o MESMO protocolo (um SW mais novo também não serve esta página)
}

async function religarCopiaLocal(){
  // ronda 9 (achado 2): um service worker de antes (sem gerações nem trinco) ainda a servir → não se religa: actualiza-se e recarrega-se
  var pronto = await swDaCopiaPronto();
  if(!pronto.ok){
    try{ if(pronto.reg) pronto.reg.update(); }catch(e){}
    showToast(t("a app está a actualizar-se — recarrega a página (fecha os outros separadores do Basalt) e volta a ligar a cópia."));
    return false;
  }
  var r = await comTrincoCopia("exclusive", async function(){   // ronda 9: nada a meio de um «guardar» do service worker
    try{ if("caches" in window) await caches.delete(MARCA_DESLIGADA); }catch(e){}
  });
  if(!r.ok){ showToast(t("a cópia deste aparelho está ocupada — tenta ligar outra vez daqui a pouco.")); return false; }
  COPIA_DESLIGADA = false;
  gravarLocal("basalt-copia-desligada", null);
  try{ await idbDelete("meta", "copiaDesligada"); }catch(e){}
  showToast(t("este aparelho volta a guardar cópia para funcionar sem rede."));
  await sincronizarPacote();
  if(location.hash === "" || location.hash === "#/") route();
}

async function iniciarOffline(){
  try{
    var mdono = await idbGet("meta", "dono");                  // ronda 8: de quem é a cópia (confirma-se com o servidor antes de sincronizar)
    if(mdono && typeof mdono.valor === "string") DONO = mdono.valor;
    var md = await idbGet("meta", "copiaDesligada");
    if(md && md.valor){ COPIA_DESLIGADA = true; gravarLocal("basalt-copia-desligada", "1"); }
    await geracaoActual();                                     // ronda 6 G6: a geração persistente passa a ser a deste separador
    var mb = await idbGet("meta", "bloqueada");
    if(mb && mb.valor){ COPIA_BLOQUEADA = true; BLOQUEIO_ID = mb.id || BLOQUEIO_ID || "antigo"; gravarLocal("basalt-copia-bloqueada", BLOQUEIO_ID); }
    await converterTrancasLegadas();                           // ronda 9: «/__quando» → entrada própria (nunca sai por uma resposta)
    if(!COPIA_BLOQUEADA) await copiaTrancadaAqui();            // ronda 3 G3: a tranca que só o service worker pôs passa a ser da página
    var m = await idbGet("meta", "ultimaSync");
    if(m && m.valor){ OFFLINE_ESTADO.quando = m.valor; atualizarIndicador(); }
  }catch(e){}
  var aviso = lerLocal("basalt-aviso-pos-recarga");
  if(aviso){ gravarLocal("basalt-aviso-pos-recarga", null); showToast(aviso); }
  atualizarContadorFila();
  atualizarAvisoPendentes();                                   // ronda 12 (A)
  if(navigator.onLine){ sincronizarPacote(); sincronizarFila(); }
  setInterval(function(){
    if(navigator.onLine && document.visibilityState === "visible") sincronizarPacote();
  }, 10 * 60 * 1000);
  setInterval(sincronizarFila, 30 * 1000);
  window.addEventListener("online", function(){ atualizarIndicador(); sincronizarPacote(); sincronizarFila(); });
  window.addEventListener("offline", atualizarIndicador);
}

/* ========================================================================
   Markdown seguro: 1º escapa & < > " ', 2º aplica transformações.
   ==================================================================== */

function stripFrontmatter(texto){
  var m = texto.match(/^---\n[\s\S]*?\n---\n?/);
  return m ? texto.slice(m[0].length) : texto;
}

function inlineMd(text){
  text = text.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
  text = text.replace(/__([^_\n]+)__/g, "<strong>$1</strong>");
  text = text.replace(/\*([^*\n]+)\*/g, "<em>$1</em>");
  text = text.replace(/(^|[^a-zA-Z0-9])_([^_\n]+)_(?![a-zA-Z0-9])/g, "$1<em>$2</em>");
  text = text.replace(/==([^=\n]+)==/g, "<mark>$1</mark>");
  // etiquetas #tag no meio do texto — nunca dentro de URLs/âncoras/[[wikilinks]] (guarda: não pode vir a seguir
  // a uma letra/número/#//[ ) nem virar uma cor css (#fff, #ffffff…). Código já saiu como placeholder antes disto.
  text = text.replace(/(^|[^\w#\/\[])#([A-Za-z][A-Za-z0-9_\-\/]*)/g, function(m, pre, corpo){
    if(/^[0-9a-fA-F]{3}$|^[0-9a-fA-F]{4}$|^[0-9a-fA-F]{6}$|^[0-9a-fA-F]{8}$/.test(corpo)) return m;
    return pre + '<span class="tag" data-etiqueta="' + corpo + '" role="button" tabindex="0">#' + corpo + "</span>";
  });
  text = text.replace(/\[\[([a-zA-Z0-9_:]+)(?:\|([^\]]+))?\]\]/g, function(m, nome, alt){
    var label = alt || nome;
    return '<a href="#/nota/' + nome + '" class="wiki-link" data-nome="' + nome + '">' + label + '</a>';
  });
  text = text.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function(m, label, url){
    if(/^(https?:|mailto:)/i.test(url)){
      return '<a href="' + url + '" class="ext-link" target="_blank" rel="noopener noreferrer">' + label + '</a>';
    }
    return label;
  });
  return text;
}

/* ---- callouts (> [!tipo] título — compatível Obsidian) ---- */
var CALLOUT_ALIAS = {
  note: "note", nota: "note", info: "info", tip: "tip", dica: "tip",
  warning: "warning", aviso: "warning", danger: "danger", perigo: "danger",
  question: "question", pergunta: "question", success: "success", ok: "success",
  quote: "quote", citacao: "quote", "citação": "quote"
};
var CALLOUT_ICONE = {note:"📝", info:"ℹ️", tip:"💡", warning:"⚠️", danger:"🚫", question:"❓", success:"✅", quote:"❝"};

function renderCalloutOuBlockquote(linhas){
  if(!linhas.length) return "";
  var m = linhas[0].match(/^\[!([^\]]+)\]([+-])?\s*(.*)$/);
  if(!m){
    return "<blockquote>" + linhas.map(function(l){ return l.trim() ? "<p>" + inlineMd(l) + "</p>" : ""; }).join("") + "</blockquote>";
  }
  var tipoCru = m[1].trim().toLowerCase();
  var fechado = m[2] === "-";
  var tituloResto = (m[3] || "").trim();
  var tipo = CALLOUT_ALIAS[tipoCru] || "note";
  var icone = CALLOUT_ICONE[tipo] || "📝";
  var titulo = tituloResto || (tipoCru.charAt(0).toUpperCase() + tipoCru.slice(1));
  var corpoHtml = linhas.slice(1).map(function(l){ return l.trim() ? "<p>" + inlineMd(l) + "</p>" : ""; }).join("");
  if(fechado){
    return '<details class="callout callout-' + tipo + '"><summary class="callout-titulo">' + icone + " " + inlineMd(titulo) +
      '</summary><div class="callout-corpo">' + corpoHtml + "</div></details>";
  }
  return '<div class="callout callout-' + tipo + '"><div class="callout-titulo">' + icone + " " + inlineMd(titulo) + "</div>" +
    '<div class="callout-corpo">' + corpoHtml + "</div></div>";
}

/* ---- diagramas mermaid: fica em placeholder na 1ª passagem; o SVG entra depois via processarMermaidEm() ---- */
function renderMermaidPlaceholder(src){
  return '<div class="mermaid-diagrama" data-mermaid-src="' + escapeHtml(src) + '">' +
    '<pre class="code-block"><code>' + escapeHtml(src) + '</code></pre></div>';
}

/* ---- fórmulas KaTeX: renderToString é síncrono — desde que a lib já esteja carregada (prepararMarkdown trata disso) ---- */
function renderKatex(src, display){
  if(window.katex && window.katex.renderToString){
    try{
      return '<span class="katex-wrap' + (display ? " katex-display-wrap" : "") + '">' +
        window.katex.renderToString(src, {throwOnError:false, displayMode: !!display, trust:false}) + "</span>";
    }catch(e){}
  }
  var literal = display ? ("$$" + src + "$$") : ("$" + src + "$");
  return '<code class="katex-pendente">' + escapeHtml(literal) + "</code>";
}

/* ---- notas embutidas ![[nome]] — 1 nível só (dentro de uma embutida, ![[...]] noutra vira link simples) ---- */
/* anexos: ![[foto.png]] (também ![[foto.png|300]] e ![[doc.pdf#p2]] do Obsidian) — o ficheiro vive em /anexos/ do espaço */
var ANEXO_RX = /^[A-Za-z0-9\u00C0-\u024F][A-Za-z0-9\u00C0-\u024F._ \-]{0,118}[A-Za-z0-9]$/;
function renderAnexo(nome){
  nome = String(nome || "").split("|")[0].split("#")[0].trim();
  var m = /\.([a-z0-9]+)$/i.exec(nome), ext = m ? m[1].toLowerCase() : "";
  if(!ANEXO_RX.test(nome) || !ext){
    return '<div class="embed-nota embed-nota-ficheiro">📎 ' + escapeHtml(nome) + "</div>";
  }
  // ronda 9 (achado G2 da ronda 2): ?d= é o dono da cópia (uma <img> não manda cabeçalhos) — o servidor recusa o de outra conta,
  // e a cache do browser fica separada por conta
  var url = "/anexos/" + encodeURIComponent(nome) + "?d=" + encodeURIComponent(DONO), nomeHtml = escapeHtml(nome);
  if(/^(png|jpe?g|gif|webp|svg)$/.test(ext)){
    return '<a class="embed-anexo-img" href="' + url + '" target="_blank" rel="noopener"><img class="embed-img" src="' + url + '" alt="' + nomeHtml + '" loading="lazy"></a>';
  }
  if(/^(mp3|m4a|wav|ogg)$/.test(ext)) return '<audio class="embed-media" controls preload="none" src="' + url + '"></audio>';
  if(/^(mp4|webm)$/.test(ext)) return '<video class="embed-media" controls preload="none" src="' + url + '"></video>';
  return '<a class="embed-nota embed-nota-ficheiro embed-anexo-link" href="' + url + '" target="_blank" rel="noopener">📎 ' + nomeHtml + "</a>";
}

function renderEmbed(nome, profundidade){
  var pareceNota = /^[a-zA-Z0-9_:]+$/.test(nome);
  if(!pareceNota){
    return renderAnexo(nome);
  }
  var tituloHtml = '<a href="#/nota/' + nome + '" class="wiki-link" data-nome="' + escapeHtml(nome) + '">' + escapeHtml(nome) + "</a>";
  if(profundidade >= 1){
    return '<div class="embed-nota embed-nota-link">📎 ' + tituloHtml + "</div>";
  }
  var registo = EMBED_CACHE.hasOwnProperty(nome) ? EMBED_CACHE[nome] : null;
  if(!registo || !registo.texto){
    return '<div class="embed-nota embed-nota-link">📎 ' + tituloHtml + ' <span class="dim-note">' + t("(não encontrada)") + '</span></div>';
  }
  var htmlEmbutido = renderMarkdown(stripFrontmatter(registo.texto), profundidade + 1);
  return '<div class="embed-nota"><div class="embed-nota-titulo">' + tituloHtml + "</div>" +
    '<div class="embed-nota-corpo markdown-body">' + htmlEmbutido + "</div></div>";
}

function splitTableRow(line){
  var l = line.trim();
  if(l.charAt(0) === "|") l = l.slice(1);
  if(l.charAt(l.length-1) === "|") l = l.slice(0, -1);
  return l.split("|").map(function(c){ return c.trim(); });
}

function renderMarkdown(raw, profundidade){
  profundidade = profundidade || 0;
  var pre = String(raw == null ? "" : raw);

  // extrai do texto CRU (antes do escapeHtml, como os blocos de código) para não escapar duas vezes:
  // mermaid, $$blocos$$, $inline$ (com a regra do dinheiro) e ![[embutidas]] — por esta ordem, para não se
  // atropelarem umas às outras.
  var mermaidBlocks = [];
  pre = pre.replace(/```mermaid\n([\s\S]*?)```/g, function(m, src){
    var idx = mermaidBlocks.length;
    mermaidBlocks.push(src.replace(/\n$/, ""));
    return "\u0000M" + idx + "\u0000";
  });

  var mathBlocks = [];
  pre = pre.replace(/\$\$([\s\S]+?)\$\$/g, function(m, src){
    var idx = mathBlocks.length;
    mathBlocks.push(src.trim());
    return "\u0000D" + idx + "\u0000";
  });

  var mathInline = [];
  pre = pre.replace(/\$([^\s$][^$\n]*?)\$/g, function(m, src, offset, str){
    if(/\s$/.test(src)) return m;                              // espaço logo antes do 2º $: é dinheiro, não fórmula
    var depois = str.charAt(offset + m.length);
    if(/[0-9]/.test(depois)) return m;                          // 2º $ seguido de algarismo ("$5 e $10"): dinheiro
    var idx = mathInline.length;
    mathInline.push(src);
    return "\u0000E" + idx + "\u0000";
  });

  var embeds = [];
  pre = pre.replace(/!\[\[([^\]|#]+)(?:#[^\]|]*)?(?:\|[^\]]*)?\]\]/g, function(m, nomeCru){
    var idx = embeds.length;
    embeds.push(nomeCru.trim());
    return "\u0000N" + idx + "\u0000";
  });

  var s = escapeHtml(pre);

  var blocks = [];
  s = s.replace(/```([a-zA-Z0-9_+-]*)\n([\s\S]*?)```/g, function(m, lang, code){
    var idx = blocks.length;
    blocks.push('<pre class="code-block"><code>' + code.replace(/\n$/, "") + '</code></pre>');
    return "\u0000B" + idx + "\u0000";
  });

  var inlineCodes = [];
  s = s.replace(/`([^`\n]+)`/g, function(m, code){
    var idx = inlineCodes.length;
    inlineCodes.push("<code>" + code + "</code>");
    return "\u0000I" + idx + "\u0000";
  });

  var lines = s.split("\n");
  var out = [];
  var inList = null;
  var inQuote = false;
  var quoteBuf = [];
  var para = [];

  function flushPara(){
    if(para.length){
      out.push("<p>" + inlineMd(para.join(" ")) + "</p>");
      para = [];
    }
  }
  function closeList(){ if(inList){ out.push("</" + inList + ">"); inList = null; } }
  function closeQuote(){
    if(inQuote){
      out.push(renderCalloutOuBlockquote(quoteBuf));
      quoteBuf = [];
      inQuote = false;
    }
  }
  function closeBlocksExcept(kind){
    if(kind !== "para") flushPara();
    if(kind !== "list") closeList();
    if(kind !== "quote") closeQuote();
  }

  var i = 0;
  while(i < lines.length){
    var line = lines[i];
    var m;

    if(/^\s*$/.test(line)){
      closeBlocksExcept("");
      i++; continue;
    }
    if((m = line.match(/^(#{1,6})\s+(.*)$/))){
      closeBlocksExcept("heading");
      var lvl = m[1].length;
      out.push("<h" + lvl + ">" + inlineMd(m[2]) + "</h" + lvl + ">");
      i++; continue;
    }
    if(/^(-{3,}|\*{3,}|_{3,})$/.test(line.trim())){
      closeBlocksExcept("hr");
      out.push("<hr>");
      i++; continue;
    }
    if((m = line.match(/^\u0000B(\d+)\u0000$/))){
      closeBlocksExcept("codeblock");
      out.push(blocks[+m[1]]);
      i++; continue;
    }
    if((m = line.match(/^\u0000M(\d+)\u0000$/))){
      closeBlocksExcept("mermaid");
      out.push(renderMermaidPlaceholder(mermaidBlocks[+m[1]]));
      i++; continue;
    }
    if((m = line.match(/^\u0000D(\d+)\u0000$/))){
      closeBlocksExcept("math");
      out.push(renderKatex(mathBlocks[+m[1]], true));
      i++; continue;
    }
    if((m = line.match(/^\u0000N(\d+)\u0000$/))){
      closeBlocksExcept("embed");
      out.push(renderEmbed(embeds[+m[1]], profundidade));
      i++; continue;
    }
    if((m = line.match(/^&gt;\s?(.*)$/))){
      closeBlocksExcept("quote");
      inQuote = true;
      quoteBuf.push(m[1]);
      i++; continue;
    }
    if((m = line.match(/^\s*([-*])\s+(.*)$/))){
      closeBlocksExcept("list");
      if(inList !== "ul"){ closeList(); out.push("<ul>"); inList = "ul"; }
      out.push("<li>" + inlineMd(m[2]) + "</li>");
      i++; continue;
    }
    if((m = line.match(/^\s*\d+\.\s+(.*)$/))){
      closeBlocksExcept("list");
      if(inList !== "ol"){ closeList(); out.push("<ol>"); inList = "ol"; }
      out.push("<li>" + inlineMd(m[1]) + "</li>");
      i++; continue;
    }
    if(line.indexOf("|") !== -1 && lines[i+1] &&
       /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)+\|?\s*$/.test(lines[i+1])){
      closeBlocksExcept("table");
      var header = splitTableRow(line);
      i += 2;
      var rows = [];
      while(i < lines.length && lines[i].indexOf("|") !== -1 && !/^\s*$/.test(lines[i])){
        rows.push(splitTableRow(lines[i]));
        i++;
      }
      var t = "<table><thead><tr>" + header.map(function(c){ return "<th>" + inlineMd(c) + "</th>"; }).join("") + "</tr></thead><tbody>";
      rows.forEach(function(row){
        t += "<tr>" + row.map(function(c){ return "<td>" + inlineMd(c) + "</td>"; }).join("") + "</tr>";
      });
      t += "</tbody></table>";
      out.push(t);
      continue;
    }
    closeBlocksExcept("para");
    para.push(line);
    i++;
  }
  closeBlocksExcept("");

  var html = out.join("\n");
  html = html.replace(/\u0000B(\d+)\u0000/g, function(m, idx){ return blocks[+idx]; });
  html = html.replace(/\u0000I(\d+)\u0000/g, function(m, idx){ return inlineCodes[+idx]; });
  html = html.replace(/\u0000E(\d+)\u0000/g, function(m, idx){ return renderKatex(mathInline[+idx], false); });
  return html;
}

/* ========================================================================
   Bibliotecas a pedido (KaTeX, mermaid) + notas embutidas
   Só carregam quando a nota realmente as usa. renderMarkdown() é síncrona
   (para não obrigar a reescrever todas as chamadas); por isso quem vai
   renderizar chama primeiro prepararMarkdown(textoCru) e só depois
   renderMarkdown() — assim, quando ela corre, o que precisar já lá está.
   ==================================================================== */

var EMBED_CACHE = {};

function carregarCssUmaVez(href){
  if(document.querySelector('link[href="' + href + '"]')) return;
  var link = document.createElement("link");
  link.rel = "stylesheet";
  link.href = href;
  document.head.appendChild(link);
}
function carregarScriptUmaVez(src){
  return new Promise(function(resolve, reject){
    var existente = document.querySelector('script[src="' + src + '"]');
    if(existente){
      if(existente.getAttribute("data-carregado") === "1") return resolve();
      existente.addEventListener("load", function(){ resolve(); });
      existente.addEventListener("error", function(){ reject(new Error(tf("falhou a carregar {src}", {src: src}))); });
      return;
    }
    var s = document.createElement("script");
    s.src = src;
    s.onload = function(){ s.setAttribute("data-carregado", "1"); resolve(); };
    s.onerror = function(){ reject(new Error(tf("falhou a carregar {src}", {src: src}))); };
    document.body.appendChild(s);
  });
}
function garantirKatex(){
  carregarCssUmaVez("/static/vendor/katex/katex.min.css");
  if(window.katex) return Promise.resolve();
  return carregarScriptUmaVez("/static/vendor/katex/katex.min.js");
}
function garantirMermaid(){
  if(window.mermaid) return Promise.resolve();
  return carregarScriptUmaVez("/static/vendor/mermaid.min.js");
}
function precisaMermaid(raw){ return /```mermaid\b/.test(raw); }
function precisaKatex(raw){ return /\$\$[\s\S]+?\$\$/.test(raw) || /\$[^\s$]/.test(raw); }

function nomesEmbutidosDe(raw){
  var nomes = [], vistos = {}, rx = /!\[\[([a-zA-Z0-9_:]+)(?:#[^\]|]*)?(?:\|[^\]]*)?\]\]/g, m;
  while((m = rx.exec(String(raw || "")))){
    if(!vistos[m[1]]){ vistos[m[1]] = true; nomes.push(m[1]); }
  }
  return nomes;
}
function obterEmbedCache(nome){
  cachesDaConta();                                           // ronda 13b
  if(EMBED_CACHE.hasOwnProperty(nome)) return Promise.resolve(EMBED_CACHE[nome]);
  var cache = EMBED_CACHE;                                   // ronda 13b: a da conta com que partiu (mudou → já é outra)
  return apiGet("/api/nota?nome=" + encodeURIComponent(nome)).then(function(n){
    cache[nome] = n;
    return n;
  }).catch(function(){
    cache[nome] = null;
    return null;
  });
}

// chamar SEMPRE antes de renderMarkdown(cru) num sítio novo (não é preciso dentro de embeds/preview recursivos)
async function prepararMarkdown(raw){
  var texto = String(raw || "");
  var nomes = nomesEmbutidosDe(texto);
  if(nomes.length){
    await Promise.all(nomes.map(obterEmbedCache));
    nomes.forEach(function(n){
      var e = EMBED_CACHE[n];
      if(e && e.texto) texto += "\n" + e.texto;
    });
  }
  var tarefas = [];
  if(precisaKatex(texto)) tarefas.push(garantirKatex().catch(function(){}));
  if(precisaMermaid(texto)) tarefas.push(garantirMermaid().catch(function(){}));
  if(tarefas.length) await Promise.all(tarefas);
}

// depois de meter o HTML no DOM, troca os placeholders .mermaid-diagrama pelo SVG de verdade.
var MERMAID_CONTADOR = 0;
async function processarMermaidEm(container){
  if(!container) return;
  var nos = container.querySelectorAll(".mermaid-diagrama[data-mermaid-src]:not(.mermaid-ok):not(.mermaid-erro)");
  if(!nos.length) return;
  if(!window.mermaid){
    try{ await garantirMermaid(); }catch(e){ return; }
  }
  if(!window.mermaid || !window.mermaid.render) return;
  try{
    var tema = document.documentElement.getAttribute("data-theme") === "light" ? "default" : "dark";
    window.mermaid.initialize({startOnLoad:false, securityLevel:"strict", theme: tema});
  }catch(e){}
  for(var i = 0; i < nos.length; i++){
    var el = nos[i];
    var src = el.getAttribute("data-mermaid-src") || "";
    var id = "basalt-mermaid-" + (MERMAID_CONTADOR++);
    try{
      var res = await window.mermaid.render(id, src);
      el.innerHTML = res.svg;
      el.classList.add("mermaid-ok");
    }catch(e){
      el.classList.add("mermaid-erro");
      var aviso = document.createElement("p");
      aviso.className = "dim-note mermaid-erro-msg";
      aviso.textContent = t("diagrama com erro.");
      el.appendChild(aviso);
      var perdido = document.getElementById(id);
      if(perdido && perdido.parentNode) perdido.parentNode.removeChild(perdido);
    }
  }
}

/* ========================================================================
   Tema
   ==================================================================== */

function applyTheme(theme){
  if(theme === "light") document.documentElement.setAttribute("data-theme","light");
  else document.documentElement.removeAttribute("data-theme");
  var btn = document.getElementById("theme-toggle");
  if(btn) btn.textContent = theme === "light" ? "🌙" : "☀️";
  if(EDITOR_ACTIVO && typeof EDITOR_ACTIVO.definirTema === "function"){    // #41 fase 3b
    EDITOR_ACTIVO.definirTema(theme === "light" ? "claro" : "escuro");
  }
}
function initTheme(){
  var theme = "dark";
  try{ theme = localStorage.getItem("basalt-theme") || "dark"; }catch(e){}
  applyTheme(theme);
  var btn = document.getElementById("theme-toggle");
  btn.addEventListener("click", function(){
    var atual = document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark";
    var novo = atual === "light" ? "dark" : "light";
    applyTheme(novo);
    try{ localStorage.setItem("basalt-theme", novo); }catch(e){}
  });
}

var cmdInput, cmdPanel;

function openPanel(html){
  cmdPanel.innerHTML = html;
  cmdPanel.classList.remove("hidden");
}
function closePanel(){
  cmdPanel.classList.add("hidden");
  cmdPanel.innerHTML = "";
}

function linkifyCitations(escapedText, fontes){
  return escapedText.replace(/\[(\d+)\]/g, function(m, num){
    var f = (fontes || []).filter(function(x){ return String(x.n) === num; })[0];
    if(f && f.nome){
      return '<a href="#/nota/' + f.nome + '" class="cite">[' + num + ']</a>';
    }
    if(f && f.fonte && f.fonte !== "nota" && f.ref){
      return '<a href="' + hrefFonte(f.fonte, f.ref) + '" class="cite">[' + num + ']</a>';
    }
    return '<span class="cite cite-static">[' + num + "]</span>";
  });
}

async function executarProcura(q){
  if(!q || !q.trim()){ closePanel(); return; }
  openPanel('<div class="cmd-loading"><span class="spinner"></span>' + t("a procurar…") + '</div>');
  try{
    var results = await apiGet("/api/procura?q=" + encodeURIComponent(q) + "&n=10");
    if(!results.length){
      openPanel('<div class="cmd-empty">' + t("nada de confiança; tenta outras palavras.") + '</div>');
      return;
    }
    var rows = results.map(function(r){
      var pct = Math.round((r.sim||0) * 100);
      if(r.nome){
        return '<a class="cmd-result" href="#/nota/' + r.nome + '">' +
          '<div class="cmd-result-top"><span class="cmd-result-titulo">' + escapeHtml(r.titulo || t("(sem título)")) +
          '</span><span class="cmd-result-sim">' + pct + '%</span></div>' +
          '<div class="cmd-result-trecho">' + escapeHtml(r.trecho || "") + '</div>' +
          '<div class="cmd-result-fonte">' + escapeHtml(r.fonte) + '</div></a>';
      }
      if(r.fonte && r.fonte !== "nota" && r.ref){            // ronda 12: fonte externa ([fontes_extra]) → abre só para ler
        return '<a class="cmd-result cmd-result-externa" href="' + hrefFonte(r.fonte, r.ref) + '">' +
          '<div class="cmd-result-top"><span class="cmd-result-titulo">' + escapeHtml(r.titulo || t("(sem título)")) +
          '</span><span class="cmd-result-sim">' + pct + '%</span></div>' +
          '<div class="cmd-result-trecho">' + escapeHtml(r.trecho || "") + '</div>' +
          '<div class="cmd-result-fonte">' + escapeHtml(r.fonte) + " · " + t("só leitura") + '</div></a>';
      }
      return '<div class="cmd-result cmd-result-static">' +
        '<div class="cmd-result-top"><span class="cmd-result-titulo">' + escapeHtml(r.titulo || t("(sem título)")) +
        '</span><span class="cmd-result-sim">' + pct + '%</span></div>' +

        '<div class="cmd-result-fonte">' + escapeHtml(r.fonte) + " · " + t("não navegável") + "</div></div>";

function initTopbar(){
  cmdInput = document.getElementById("cmd-input");
  cmdPanel = document.getElementById("cmd-panel");

  cmdPanel.addEventListener("click", function(e){
    var a = e.target.closest("a");
    if(a){ closePanel(); cmdInput.value = ""; }
  });

  cmdInput.addEventListener("input", function(){
    var v = cmdInput.value;
    if(/^\s*guarda:/i.test(v) || /\?\s*$/.test(v)){ closePanel(); return; }
    procuraDebounced(v);
  });

  cmdInput.addEventListener("keydown", function(e){
    if(e.key === "Escape"){ cmdInput.value = ""; closePanel(); cmdInput.blur(); return; }
    if(e.key !== "Enter") return;
    var v = cmdInput.value.trim();
    if(!v) return;
    if(/^guarda:/i.test(v)){
      executarGuarda(v.slice(v.indexOf(":") + 1).trim());
      return;
    }
    if(v.endsWith("?")){
      executarPergunta(v);
      return;
    }
    executarProcura(v);
  });

  document.addEventListener("keydown", function(e){
    var ae = document.activeElement;
    var tag = ae ? ae.tagName : "";
    var editable = tag === "INPUT" || tag === "TEXTAREA" || (ae && ae.isContentEditable);
    if((e.key === "k" || e.key === "K") && (e.ctrlKey || e.metaKey)){
      e.preventDefault();
      cmdInput.focus(); cmdInput.select();
      return;
    }
    if((e.key === "o" || e.key === "O") && (e.ctrlKey || e.metaKey)){
      e.preventDefault();
      abrirSaltoRapido();
      return;
    }
    if(e.key === "/" && !editable){
      e.preventDefault();
      cmdInput.focus(); cmdInput.select();
    }
  });

  var btnSalto = document.getElementById("salto-rapido-btn");
  if(btnSalto) btnSalto.addEventListener("click", abrirSaltoRapido);
}

/* anexos: colar/largar ficheiros no editor → POST /api/anexos (corpo = o ficheiro) → ![[nome]] no cursor */
var ANEXO_EXT_POR_TIPO = {"image/png":"png","image/jpeg":"jpg","image/gif":"gif","image/webp":"webp","image/svg+xml":"svg",
  "application/pdf":"pdf","audio/mpeg":"mp3","audio/mp4":"m4a","audio/x-m4a":"m4a","audio/wav":"wav","audio/x-wav":"wav",
  "audio/ogg":"ogg","video/mp4":"mp4","video/webm":"webm","text/csv":"csv","application/json":"json","text/plain":"txt"};
function nomeParaAnexo(ficheiro){
  var nome = String(ficheiro.name || "").trim();
  var generico = !nome || /^(image|imagem)\.(png|jpe?g|gif|webp)$/i.test(nome);   // o browser chama "image.png" ao que se cola
  if(generico){
    var d = new Date(), z = function(n){ return (n < 10 ? "0" : "") + n; };
    var ext = ANEXO_EXT_POR_TIPO[ficheiro.type] || (nome.split(".").pop() || "png");
    nome = "colado-" + d.getFullYear() + z(d.getMonth() + 1) + z(d.getDate()) + "-" + z(d.getHours()) + z(d.getMinutes()) + z(d.getSeconds()) + "." + ext;
  }
  return nome.replace(/[^A-Za-z0-9À-ɏ._ \-]+/g, "_").slice(0, 120);
}
async function enviarAnexo(ficheiro, opcoes){
  var nome = nomeParaAnexo(ficheiro);
  // ronda 9 (achado G2 da ronda 2): o envio ia sem dono — com outra conta entrada noutro separador, gravava no espaço dela
  if(!DONO_OK && !OUTRA_CONTA){ try{ await verificarDono(); }catch(e){} }
  if(!DONO) throw erroSemDono();
  // ronda 13 (achado 1 da revisão externa r4): o anexo vai com a conta com que a edição foi ABERTA (como o PUT da nota) — se o
  // separador passou entretanto a ser de outra (verificarDono acabou de a adoptar), não se envia, nem em nome da nova
  if(opcoes && opcoes.dono !== undefined && DONO !== opcoes.dono) throw erroEdicaoDeOutraConta();
  var res;
  try{
    res = await fetch("/api/anexos?nome=" + encodeURIComponent(nome), {
      method: "POST", credentials: "same-origin",
      headers: cabecalhoDono({"X-Basalt": "1", "Content-Type": ficheiro.type || "application/octet-stream"}),
      body: ficheiro,
    });
  }catch(e){ return apiSendFalhaRede(); }
  if(ehOutraConta(res)) mostrarOutraConta();
  return handleRes(res);
}
function ligarAnexosNoEditor(alvo, obterEditor, dono){   // ronda 13: `dono` = a conta com que a edição foi aberta
  function tratar(e, lista){
    var fich = [], i;
    for(i = 0; i < lista.length; i++){ if(lista[i] && lista[i].size > 0) fich.push(lista[i]); }
    if(!fich.length) return;
    e.preventDefault(); e.stopPropagation();
    if(!navigator.onLine){ showToast(t("precisa de rede para guardar anexos.")); return; }
    fich.forEach(function(f){
      enviarAnexo(f, dono !== undefined ? {dono: dono} : undefined).then(function(r){
        var ed = obterEditor();
        if(ed && r && r.nome) ed.inserirNoCursor("![[" + r.nome + "]]");
        showToast(tf("anexo guardado: {nome}", {nome: r.nome}));
      }).catch(function(er){ showToast(tf("anexo não guardado: {erro}", {erro: (er && er.message) || er})); });
    });
  }
  alvo.addEventListener("paste", function(e){ var cd = e.clipboardData; if(cd && cd.files && cd.files.length) tratar(e, cd.files); }, true);
  alvo.addEventListener("drop", function(e){ var dt = e.dataTransfer; if(dt && dt.files && dt.files.length) tratar(e, dt.files); }, true);
  alvo.addEventListener("dragover", function(e){
    var dt = e.dataTransfer;
    if(dt && dt.types && Array.prototype.indexOf.call(dt.types, "Files") >= 0) e.preventDefault();   // senão o browser abre o ficheiro
  }, true);
}

  if(NOTAS_SHELL && NOTAS_SHELL.chave !== chaveDaConta()) NOTAS_SHELL = null;   // nem a árvore e o índice das notas

  }

    if(NOTAS_SHELL && main.contains(NOTAS_SHELL.root)){
      return NOTAS_SHELL.abrir(alvo);

    return montarNotasShell(main, alvo);

  main.scrollTop = 0;

function ligarBlocoToken(origem, url, token){

async function ligarVerificar(d, alvo){
  var ok = [], mal = [];
  function linha(passou, texto){ (passou ? ok : mal).push((passou ? "✓ " : "✗ ") + texto); }
  if(!d.url_publico){
    linha(false, t("falta o url_publico no basalt.toml (o Claude e o ChatGPT precisam de um endereço público https)"));
  }else{
    linha(d.url_publico.indexOf("https://") === 0, t("o endereço público é https"));
    if(d.url_publico !== location.origin){
      linha(false, tf("estás a abrir o Basalt por {aqui}: para verificar, abre-o por {publico}", {aqui: location.origin, publico: d.url_publico}));
    }else{
      try{
        var prm = await (await fetch("/.well-known/oauth-protected-resource", {credentials: "omit", cache: "no-store"})).json();
        linha(prm.resource === d.mcp, t("os metadados do recurso respondem e apontam para este endereço"));
      }catch(e){ linha(false, t("os metadados do recurso não respondem")); }
      try{
        var asm = await (await fetch("/.well-known/oauth-authorization-server", {credentials: "omit", cache: "no-store"})).json();
        linha((asm.code_challenge_methods_supported || []).indexOf("S256") >= 0 && asm.authorization_response_iss_parameter_supported === true,
              t("o servidor de autorização responde (PKCE S256, iss)"));
      }catch(e){ linha(false, t("o servidor de autorização não responde")); }
      try{
        var r = await fetch("/mcp", {method: "POST", credentials: "omit", cache: "no-store", headers: {"Content-Type": "application/json"},
                                     body: JSON.stringify({jsonrpc: "2.0", id: 1, method: "tools/list"})});
        linha(r.status === 401 && /resource_metadata=/.test(r.headers.get("WWW-Authenticate") || ""), t("o /mcp sem token pede a ligação (401 com resource_metadata)"));
      }catch(e){ linha(false, t("o /mcp não responde")); }
    }
  }
  alvo.innerHTML = '<ul class="ligar-verif-lista">' + ok.concat(mal).map(function(x){ return "<li>" + escapeHtml(x) + "</li>"; }).join("") + "</ul>" +
    '<p class="dim-note">' + t("O que daqui não se prova: se o Basalt só se vê na tua rede de casa, o Claude e o ChatGPT não lhe chegam — ligam-se a partir da nuvem deles (o Claude sai de 160.79.104.0/21). A prova real é a ligação aparecer na lista abaixo com o último uso.") + "</p>";
}

function normalizarBusca(s){
  var t = String(s == null ? "" : s);
  try{ t = t.normalize("NFD").replace(/[̀-ͯ]/g, ""); }catch(e){}
  return t.toLowerCase();
}

function correspondeFuzzy(alvo, consulta){
  if(!consulta) return true;
  var ai = 0;
  for(var qi = 0; qi < consulta.length; qi++){
    var c = consulta[qi];
    var achou = false;
    while(ai < alvo.length){
      if(alvo[ai] === c){ achou = true; ai++; break; }
      ai++;
    }
    if(!achou) return false;
  }
  return true;
}

var SALTO_NOTAS_CACHE = null;
async function abrirSaltoRapido(){
  var root = document.getElementById("modal-root");
  root.innerHTML =
    '<div class="modal-backdrop" id="salto-backdrop">' +
      '<div class="modal salto-modal" role="dialog" aria-modal="true">' +
        '<input id="salto-input" type="text" placeholder="' + t("Saltar para uma nota… (nome, título ou descrição)") + '" autocomplete="off">' +
        '<div id="salto-lista" class="salto-lista"></div>' +
      "</div></div>";
  var backdrop = document.getElementById("salto-backdrop");
  var input = document.getElementById("salto-input");
  var listaEl = document.getElementById("salto-lista");
  var selecionado = 0;
  var resultados = [];

  function fechar(){
    root.innerHTML = "";
    document.removeEventListener("keydown", tratarTeclado, true);
  }
  backdrop.addEventListener("click", function(e){ if(e.target === backdrop) fechar(); });

  function marcarActivo(){
    var itens = listaEl.querySelectorAll(".salto-item");
    itens.forEach(function(el, i){ el.classList.toggle("activo", i === selecionado); });
    var activo = listaEl.querySelector(".salto-item.activo");
    if(activo) activo.scrollIntoView({block: "nearest"});
  }
  function abrir(i){
    var n = resultados[i];
    if(!n) return;
    fechar();
    location.hash = "#/nota/" + n.nome;
  }
  function renderResultados(){
    listaEl.innerHTML = resultados.length
      ? resultados.map(function(n, i){
          var meta = (n.categorias && n.categorias[0]) || n.tipo;
          return '<div class="salto-item' + (i === selecionado ? " activo" : "") + '" data-i="' + i + '">' +
            '<span class="salto-titulo">' + escapeHtml(n.titulo) + "</span>" +
            '<span class="salto-meta">' + escapeHtml(meta) + "</span>" +
          "</div>";
        }).join("")
      : '<p class="dim-note" style="padding:12px">' + t("nenhuma nota corresponde.") + '</p>';
    listaEl.querySelectorAll(".salto-item").forEach(function(el){
      el.addEventListener("mouseenter", function(){ selecionado = +el.dataset.i; marcarActivo(); });
      el.addEventListener("click", function(){ abrir(+el.dataset.i); });
    });
    marcarActivo();
  }
  function aplicarFiltro(){
    var q = normalizarBusca(input.value);
    var todas = SALTO_NOTAS_CACHE || [];
    if(!q){
      resultados = todas.slice().sort(function(a, b){ return b.mtime - a.mtime; }).slice(0, 40);
    }else{
      resultados = todas.filter(function(n){
        return correspondeFuzzy(normalizarBusca(n.nome + " " + n.titulo + " " + (n.desc || "")), q);
      }).sort(function(a, b){
        var ta = normalizarBusca(a.titulo), tb = normalizarBusca(b.titulo);
        var pa = ta.indexOf(q); if(pa === -1) pa = 999;
        var pb = tb.indexOf(q); if(pb === -1) pb = 999;
        if(pa !== pb) return pa - pb;
        return ta.length - tb.length;
      }).slice(0, 40);
    }
    selecionado = 0;
    renderResultados();
  }
  input.addEventListener("input", debounce(aplicarFiltro, 60));

  function tratarTeclado(e){
    if(e.key === "Escape"){ e.preventDefault(); fechar(); return; }
    if(e.key === "ArrowDown"){ e.preventDefault(); selecionado = Math.min(selecionado + 1, resultados.length - 1); marcarActivo(); return; }
    if(e.key === "ArrowUp"){ e.preventDefault(); selecionado = Math.max(selecionado - 1, 0); marcarActivo(); return; }
    if(e.key === "Enter"){ e.preventDefault(); abrir(selecionado); return; }
  }
  document.addEventListener("keydown", tratarTeclado, true);

  input.focus();
  listaEl.innerHTML = '<div class="state-loading"><span class="spinner"></span>' + t("a carregar…") + '</div>';
  try{
    cachesDaConta();                                         // ronda 13b
    SALTO_NOTAS_CACHE = await apiGet("/api/notas");
  }catch(e){
    listaEl.innerHTML = '<p class="dim-note">' + tf("não consegui carregar as notas: {erro}", {erro: escapeHtml(e.message)}) + "</p>";
    return;
  }
  aplicarFiltro();
}

function parseLinhaIndice(linha){
  var m = linha.match(/^-\s+\[(.+?)\]\(([^)]+)\)\s*(?:—|-)\s*(.*)$/);
  if(!m) return null;
  return {label: m[1], alvo: m[2].trim(), desc: m[3]};
}

function renderCartaoIndice(item){
  var alvo = item.alvo;
  var mLocal = alvo.match(/^([a-zA-Z0-9_:]+)\.md(?:#.*)?$/);
  var labelHtml = inlineMd(escapeHtml(item.label));
  var descHtml = item.desc ? inlineMd(escapeHtml(item.desc)) : "";
  var tituloHtml;
  if(mLocal){
    tituloHtml = '<a class="indice-titulo" href="#/nota/' + mLocal[1] + '">' + labelHtml + "</a>";
  }else if(/^(https?:|mailto:)/i.test(alvo)){
    tituloHtml = '<a class="indice-titulo" href="' + escapeHtml(alvo) + '" target="_blank" rel="noopener noreferrer">' + labelHtml + "</a>";
  }else{
    tituloHtml = '<span class="indice-titulo indice-titulo-sem-link">' + labelHtml + "</span>";
  }
  var busca = normalizarBusca(item.label + " " + item.desc);
  return '<div class="indice-card" data-busca="' + escapeHtml(busca) + '">' + tituloHtml +
    (descHtml ? '<p class="indice-desc">' + descHtml + "</p>" : "") + "</div>";
}

function construirCartoesIndice(markdown){
  var linhas = String(markdown || "").split("\n");
  var cartoes = [];
  for(var i = 0; i < linhas.length; i++){
    var l = linhas[i].trim();
    if(!l) continue;
    if(/^#{1,6}\s/.test(l)) continue; // título/secção do markdown, não é uma entrada
    var item = parseLinhaIndice(l);
    if(item){
      cartoes.push(renderCartaoIndice(item));
    }else{
      cartoes.push('<div class="indice-card"><p class="indice-desc">' +
        inlineMd(escapeHtml(l.replace(/^-\s+/, ""))) + "</p></div>");
    }
  }
  return cartoes;
}

}

function lerBool(chave, padrao){
  try{
    var v = localStorage.getItem(chave);
    return v === null ? padrao : v === "1";
  }catch(e){ return padrao; }
}
function gravarBool(chave, valor){

}

function anotarEstrutura(html){
  var estrutura = [];
  var contador = 0;
  var novo = html.replace(/<h([1-6])>([\s\S]*?)<\/h\1>/g, function(m, nivel, conteudo){
    var id = "h-" + (contador++);
    estrutura.push({nivel: +nivel, texto: conteudo.replace(/<[^>]+>/g, ""), id: id});
    return "<h" + nivel + ' id="' + id + '">' + conteudo + "</h" + nivel + ">";
  });
  return {html: novo, estrutura: estrutura};
}

    return '<a class="exp-nota-link" href="#/nota/' + n.nome + '" data-nome="' + escapeHtml(n.nome) +
      '" title="' + escapeHtml(n.titulo) + '">' + escapeHtml(n.titulo) + "</a>";
  }
  function expGrupoHtml(titulo, notasGrupo){
    var ordenadas = notasGrupo.slice().sort(function(a, b){ return b.mtime - a.mtime; });
    return '<details class="exp-grupo" open><summary>' + escapeHtml(titulo) +
      ' <span class="contagem-mini">' + ordenadas.length + "</span></summary>" +
      ordenadas.map(expNotaLinkHtml).join("") + "</details>";
  }
  function expIndiceLinkHtml(item){
    var mLocal = item.alvo.match(/^([a-zA-Z0-9_:]+)\.md(?:#.*)?$/);
    var label = item.label.replace(/\*\*/g, "").trim();
    if(!mLocal){
      return '<div class="exp-indice-item" title="' + escapeHtml(item.desc || "") + '">' +
        '<span class="exp-indice-titulo">' + escapeHtml(label) + "</span></div>";
    }
    return '<a class="exp-indice-item" href="#/nota/' + mLocal[1] + '" data-nome="' + escapeHtml(mLocal[1]) +

      (item.desc ? '<span class="exp-indice-desc">' + escapeHtml(item.desc) + "</span>" : "") + "</a>";
  }
  function renderArvore(){
    var modo = NOTAS_SHELL.agrupamento;
    if(modo === "indice"){
      arvoreEl.innerHTML = '<div class="state-loading"><span class="spinner"></span>' + t("a carregar…") + '</div>';
      garantirIndice().then(function(idx){
        var itens = itensIndiceDe(idx.markdown);
        var q = normalizarBusca(NOTAS_SHELL.filtro);
        var filtrados = q ? itens.filter(function(it){
          return normalizarBusca(it.label + " " + it.desc).indexOf(q) !== -1;
        }) : itens;
        arvoreEl.innerHTML = filtrados.length
          ? filtrados.map(expIndiceLinkHtml).join("")
          : '<p class="dim-note" style="padding:10px">' + t("nenhuma entrada corresponde ao filtro.") + '</p>';
        marcarActiva();
      }).catch(function(e){
        renderErrorBox(arvoreEl, tf("não consegui carregar o índice: {erro}", {erro: e.message}), renderArvore);
      });
      return;
    }
    var lista = notasFiltradas();
    if(!lista.length){
      arvoreEl.innerHTML = '<p class="dim-note" style="padding:10px">' + t("nenhuma nota corresponde ao filtro.") + '</p>';
      return;
    }
    var html;
    if(modo === "az"){
      var ordenada = lista.slice().sort(function(a, b){ return a.titulo.localeCompare(b.titulo, "pt"); });
      html = ordenada.map(expNotaLinkHtml).join("");
    }else if(modo === "tipo"){
      html = GRUPOS_TIPO_INDICE.map(function(g){
        var doGrupo = lista.filter(function(n){ return n.tipo === g.tipo; });
        return doGrupo.length ? expGrupoHtml(g.titulo, doGrupo) : "";
      }).join("");
    }else{
      var porCategoria = {};
      lista.forEach(function(n){
        var cats = (n.categorias && n.categorias.length) ? n.categorias : [t("Sem categoria")];
        cats.forEach(function(c){ (porCategoria[c] = porCategoria[c] || []).push(n); });
      });
      var nomes = Object.keys(porCategoria).sort(function(a, b){ return porCategoria[b].length - porCategoria[a].length; });
      html = nomes.map(function(c){ return expGrupoHtml(c, porCategoria[c]); }).join("");
    }
    arvoreEl.innerHTML = html;
    marcarActiva();
  }
  function marcarActiva(){
    arvoreEl.querySelectorAll(".exp-nota-link,.exp-indice-item").forEach(function(a){
      a.classList.toggle("activa", a.dataset.nome === NOTAS_SHELL.nomeActual);
    });

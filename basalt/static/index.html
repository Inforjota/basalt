var SALTO_NOTAS_CACHE = null;
async function abrirSaltoRapido(){
  var root = document.getElementById("modal-root");
  root.innerHTML =
    '<div class="modal-backdrop" id="salto-backdrop">' +
      '<div class="modal salto-modal" role="dialog" aria-modal="true">' +
        '<input id="salto-input" type="text" placeholder="' + t("Saltar para uma nota… (nome, título ou descrição)") + '" autocomplete="off">' +
        '<div id="salto-lista" class="salto-lista"></div>' +
      "</div></div>";
  var backdrop = document.getElementById("salto-backdrop");
  var input = document.getElementById("salto-input");
  var listaEl = document.getElementById("salto-lista");
  var selecionado = 0;
  var resultados = [];

  function fechar(){
    root.innerHTML = "";
    document.removeEventListener("keydown", tratarTeclado, true);
  }
  backdrop.addEventListener("click", function(e){ if(e.target === backdrop) fechar(); });

  function marcarActivo(){
    var itens = listaEl.querySelectorAll(".salto-item");
    itens.forEach(function(el, i){ el.classList.toggle("activo", i === selecionado); });
    var activo = listaEl.querySelector(".salto-item.activo");
    if(activo) activo.scrollIntoView({block: "nearest"});
  }
  function abrir(i){
    var n = resultados[i];
    if(!n) return;
    fechar();
    location.hash = "#/nota/" + n.nome;
  }
  function renderResultados(){
    listaEl.innerHTML = resultados.length
      ? resultados.map(function(n, i){
          var meta = (n.categorias && n.categorias[0]) || n.tipo;
          return '<div class="salto-item' + (i === selecionado ? " activo" : "") + '" data-i="' + i + '">' +
            '<span class="salto-titulo">' + escapeHtml(n.titulo) + "</span>" +
            '<span class="salto-meta">' + escapeHtml(meta) + "</span>" +
          "</div>";
        }).join("")
      : '<p class="dim-note" style="padding:12px">' + t("nenhuma nota corresponde.") + '</p>';
    listaEl.querySelectorAll(".salto-item").forEach(function(el){
      el.addEventListener("mouseenter", function(){ selecionado = +el.dataset.i; marcarActivo(); });
      el.addEventListener("click", function(){ abrir(+el.dataset.i); });
    });
    marcarActivo();
  }
  function aplicarFiltro(){
    var q = normalizarBusca(input.value);
    var todas = SALTO_NOTAS_CACHE || [];
    if(!q){
      resultados = todas.slice().sort(function(a, b){ return b.mtime - a.mtime; }).slice(0, 40);
    }else{
      resultados = todas.filter(function(n){
        return correspondeFuzzy(normalizarBusca(n.nome + " " + n.titulo + " " + (n.desc || "")), q);
      }).sort(function(a, b){
        var ta = normalizarBusca(a.titulo), tb = normalizarBusca(b.titulo);
        var pa = ta.indexOf(q); if(pa === -1) pa = 999;
        var pb = tb.indexOf(q); if(pb === -1) pb = 999;
        if(pa !== pb) return pa - pb;
        return ta.length - tb.length;
      }).slice(0, 40);
    }
    selecionado = 0;
    renderResultados();
  }
  input.addEventListener("input", debounce(aplicarFiltro, 60));

  function tratarTeclado(e){
    if(e.key === "Escape"){ e.preventDefault(); fechar(); return; }
    if(e.key === "ArrowDown"){ e.preventDefault(); selecionado = Math.min(selecionado + 1, resultados.length - 1); marcarActivo(); return; }
    if(e.key === "ArrowUp"){ e.preventDefault(); selecionado = Math.max(selecionado - 1, 0); marcarActivo(); return; }
    if(e.key === "Enter"){ e.preventDefault(); abrir(selecionado); return; }
  }
  document.addEventListener("keydown", tratarTeclado, true);

  input.focus();
  listaEl.innerHTML = '<div class="state-loading"><span class="spinner"></span>' + t("a carregar…") + '</div>';
  try{
    SALTO_NOTAS_CACHE = await apiGet("/api/notas");
  }catch(e){
    listaEl.innerHTML = '<p class="dim-note">' + tf("não consegui carregar as notas: {erro}", {erro: escapeHtml(e.message)}) + "</p>";
    return;
  }
  aplicarFiltro();
}

function parseLinhaIndice(linha){
  var m = linha.match(/^-\s+\[(.+?)\]\(([^)]+)\)\s*(?:—|-)\s*(.*)$/);
  if(!m) return null;
  return {label: m[1], alvo: m[2].trim(), desc: m[3]};
}

function renderCartaoIndice(item){
  var alvo = item.alvo;
  var mLocal = alvo.match(/^([a-zA-Z0-9_:]+)\.md(?:#.*)?$/);
  var labelHtml = inlineMd(escapeHtml(item.label));
  var descHtml = item.desc ? inlineMd(escapeHtml(item.desc)) : "";
  var tituloHtml;
  if(mLocal){
    tituloHtml = '<a class="indice-titulo" href="#/nota/' + mLocal[1] + '">' + labelHtml + "</a>";
  }else if(/^(https?:|mailto:)/i.test(alvo)){
    tituloHtml = '<a class="indice-titulo" href="' + escapeHtml(alvo) + '" target="_blank" rel="noopener noreferrer">' + labelHtml + "</a>";
  }else{
    tituloHtml = '<span class="indice-titulo indice-titulo-sem-link">' + labelHtml + "</span>";
  }
  var busca = normalizarBusca(item.label + " " + item.desc);
  return '<div class="indice-card" data-busca="' + escapeHtml(busca) + '">' + tituloHtml +
    (descHtml ? '<p class="indice-desc">' + descHtml + "</p>" : "") + "</div>";
}

function construirCartoesIndice(markdown){
  var linhas = String(markdown || "").split("\n");
  var cartoes = [];
  for(var i = 0; i < linhas.length; i++){
    var l = linhas[i].trim();
    if(!l) continue;
    if(/^#{1,6}\s/.test(l)) continue; // título/secção do markdown, não é uma entrada
    var item = parseLinhaIndice(l);
    if(item){
      cartoes.push(renderCartaoIndice(item));
    }else{
      cartoes.push('<div class="indice-card"><p class="indice-desc">' +
        inlineMd(escapeHtml(l.replace(/^-\s+/, ""))) + "</p></div>");
    }
  }
  return cartoes;
}

/* ========================================================================
   Categorias (chips estáveis + página de etiqueta)
   ==================================================================== */

function corCategoria(nome){
  var hash = 0;
  for(var i = 0; i < nome.length; i++){ hash = (hash * 31 + nome.charCodeAt(i)) >>> 0; }
  return hash % 360;
}
function chipCategoria(nome){
  var hue = corCategoria(nome);
  var estilo = "background:hsla(" + hue + ",65%,50%,.18);color:hsl(" + hue + ",45%,38%)";
  return '<a class="cat-chip" href="#/categoria/' + encodeURIComponent(nome) + '" style="' + estilo + '">' +
    escapeHtml(nome) + "</a>";
}

/* ========================================================================
   Notas — ecrã inteiro: explorador + nota/categoria/índice + contexto,
   partilhado entre #/notas, #/nota/NOME e #/categoria/NOME (não recarrega).
   A navegação principal vive agora na barra de topo (#topnav / #tabbar).
   ==================================================================== */

function lerBool(chave, padrao){
  try{
    var v = localStorage.getItem(chave);
    return v === null ? padrao : v === "1";
  }catch(e){ return padrao; }
}
function gravarBool(chave, valor){
  try{ localStorage.setItem(chave, valor ? "1" : "0"); }catch(e){}
}

function anotarEstrutura(html){
  var estrutura = [];
  var contador = 0;
  var novo = html.replace(/<h([1-6])>([\s\S]*?)<\/h\1>/g, function(m, nivel, conteudo){
    var id = "h-" + (contador++);
    estrutura.push({nivel: +nivel, texto: conteudo.replace(/<[^>]+>/g, ""), id: id});
    return "<h" + nivel + ' id="' + id + '">' + conteudo + "</h" + nivel + ">";
  });
  return {html: novo, estrutura: estrutura};
}

        '<p class="dim-note">' + tf("actualizado em {data}", {data: escapeHtml(idx.atualizado ? fmtDataCurta(new Date(idx.atualizado * 1000)) : "—")}) + "</p>" +
        '<div id="indice-lista">' + cartoes.join("") + "</div>";
      var todosCartoes = Array.prototype.slice.call(centro.querySelectorAll(".indice-card"));
      var contagemEl = document.getElementById("indice-contagem");
      function aplicar(){
        var q = normalizarBusca(document.getElementById("indice-filtro").value);
        var visiveis = 0;
        todosCartoes.forEach(function(c){
          var ok = !q || (c.dataset.busca || "").indexOf(q) !== -1;

    }catch(e){
      renderErrorBox(centro, tf("não consegui carregar o índice: {erro}", {erro: e.message}), function(){ abrir(null); });
    }
  }

  async function abrir(alvo){
    NOTAS_SHELL.nomeActual = (alvo && alvo.tipo === "nota") ? alvo.nome : null;
    marcarActiva();
    NOTAS_SHELL.root.classList.toggle("tem-nota-aberta", !!alvo);
    var centro = document.getElementById("notas-centro");
    var contexto = document.getElementById("contexto");
    centro.scrollTop = 0;

    if(!alvo){
      return renderIndiceNoCentro(centro, contexto);
    }

    if(alvo.tipo === "categoria"){
      contexto.innerHTML = "";
      renderLoading(centro, t("a carregar…"));
      try{
        var doGrupo = NOTAS_SHELL.notas.filter(function(n){
          return n.categorias && n.categorias.indexOf(alvo.nome) !== -1;
        }).sort(function(a, b){ return b.mtime - a.mtime; });
        centro.innerHTML =
          '<div class="notas-centro-topo"><a class="btn" href="#/notas">' + t("← voltar") + '</a></div>' +
          "<h1>" + tf("Categoria: {nome}", {nome: escapeHtml(alvo.nome)}) + "</h1>" +
          '<p class="dim-note">' + (doGrupo.length === 1 ? tf("{n} nota nesta categoria.", {n: doGrupo.length}) : tf("{n} notas nesta categoria.", {n: doGrupo.length})) + "</p>" +
          (doGrupo.length ? '<div class="categoria-cards">' + doGrupo.map(function(n){
            return '<a class="categoria-card" href="#/nota/' + n.nome + '"><strong>' + escapeHtml(n.titulo) + "</strong>" +
              (n.desc ? '<p class="nota-desc" style="margin:4px 0 0">' + escapeHtml(n.desc) + "</p>" : "") + "</a>";
          }).join("") + "</div>" : "");
      }catch(e){
        renderErrorBox(centro, tf("não consegui carregar a categoria: {erro}", {erro: e.message}), function(){ abrir(alvo); });
      }
      return;
    }

    centro.innerHTML = '<div class="notas-centro-topo"><a class="btn" href="#/notas">' + t("← voltar") + '</a></div>';
    renderLoading(centro, t("a carregar a nota…"));
    contexto.innerHTML = "";
    var nota;
    try{
      nota = await apiGet("/api/nota?nome=" + encodeURIComponent(alvo.nome));
    }catch(e){
      renderErrorBox(centro, tf("não consegui abrir esta nota: {erro}", {erro: e.message}), function(){ abrir(alvo); });
      return;
    }
    // #41: uma edição feita sem rede fica marcada "por enviar" até a fila sincronizar; um conflito por resolver
    // ganha sempre à vista normal da nota (as duas versões lado a lado), online ou offline.
    var conflito = null, filaItem = null;
    try{ conflito = await idbGet("conflitos", alvo.nome); }catch(e){}
    try{ filaItem = await idbGet("fila", alvo.nome); }catch(e){}
    if(conflito){
      renderConflito(nota, conflito, centro, contexto);
      return;
    }
    if(filaItem){
      nota.texto = filaItem.texto;
      nota.porEnviar = true;
    }
    renderNotaCompleta(nota, centro, contexto);
  }
}

/* adaptador com a mesma API do BasaltEditor (obterTexto/selecao/substituir/inserirNoCursor/…)
   por cima do <textarea> antigo — assim a barra de IA/Ligações funciona nos dois modos */
function criarAdaptadorTextarea(textarea){
  function limiteParagrafo(v, pos){
    var linhas = v.split("\n");
    var offsets = [], acc = 0, i;
    for(i = 0; i < linhas.length; i++){ offsets.push(acc); acc += linhas[i].length + 1; }
    var linhaCursor = linhas.length - 1;
    for(i = 0; i < linhas.length; i++){
      if(pos <= offsets[i] + linhas[i].length){ linhaCursor = i; break; }
    }
    var li = linhaCursor, lf = linhaCursor;
    while(li > 0 && linhas[li - 1].trim() !== "") li--;
    while(lf < linhas.length - 1 && linhas[lf + 1].trim() !== "") lf++;
    return {de: offsets[li], ate: offsets[lf] + linhas[lf].length};
  }
  return {
    obterTexto: function(){ return textarea.value; },
    definirTexto: function(t){ textarea.value = t == null ? "" : String(t); },
    focar: function(){ textarea.focus(); },
    destruir: function(){},
    definirTema: function(){},
    selecao: function(){
      var de = textarea.selectionStart, ate = textarea.selectionEnd, v = textarea.value;
      if(de !== ate) return {texto: v.slice(de, ate), de: de, ate: ate};
      var lim = limiteParagrafo(v, de);
      return {texto: v.slice(lim.de, lim.ate), de: lim.de, ate: lim.ate};
    },
    substituir: function(de, ate, t){
      var v = textarea.value, texto = t == null ? "" : String(t);
      textarea.value = v.slice(0, de) + texto + v.slice(ate);
      var pos = de + texto.length;
      textarea.setSelectionRange(pos, pos);
      textarea.dispatchEvent(new Event("input", {bubbles: true}));
    },
    inserirNoCursor: function(t){
      var pos = textarea.selectionStart, v = textarea.value, texto = t == null ? "" : String(t);
      textarea.value = v.slice(0, pos) + texto + v.slice(pos);
      var novaPos = pos + texto.length;
      textarea.setSelectionRange(novaPos, novaPos);
      textarea.focus();
      textarea.dispatchEvent(new Event("input", {bubbles: true}));
    }
  };
}

/* o conflito usa SEMPRE um par coerente (texto do servidor + hash desse texto). Com rede, é a versão que
   acabou de chegar do servidor (a que o utilizador vê); sem rede, a guardada no conflito. «Juntar à mão» não apaga o conflito
   antes de a gravação acabar; a proposta da IA (se houver) só se grava se o utilizador carregar nela. */
function renderConflito(nota, conflito, centro, contexto){
  var fresco = !OFFLINE_ESTADO.semRede && typeof nota.texto === "string" && !!nota.hash;
  var actualTexto = fresco ? nota.texto : (conflito.actual || "");
  var actualHash = fresco ? nota.hash : (conflito.hash_actual || "");
  if(fresco && (conflito.actual !== nota.texto || conflito.hash_actual !== nota.hash)){
    conflito.actual = nota.texto; conflito.hash_actual = nota.hash;
    // só se o guardado ainda é este (outro separador pode ter registado um conflito mais novo entretanto)
    alterarConflitoSeIgual(nota.nome, conflito.quando, function(c){ c.actual = nota.texto; c.hash_actual = nota.hash; }).catch(function(){});
  }
  var temProposta = !!conflito.proposta && !!conflito.proposta_hash && (!fresco || conflito.proposta_hash === actualHash);
  var propostaLinhas = conflito.proposta_tipo === "linhas";       // junção sem IA, também só com confirmação
  contexto.innerHTML = '<p class="dim-note">' + t("esta nota tem um conflito de sincronização por resolver.") + '</p>';
  centro.innerHTML =
    '<div class="notas-centro-topo"><a class="btn" href="#/notas">' + t("← voltar") + '</a></div>' +
    '<div class="conflito-aviso"><h1>' + tf("⚠️ Conflito em «{nome}»", {nome: escapeHtml(nota.meta.name || nota.nome)}) + '</h1>' +
    "<p>" + t("Editaste esta nota sem rede e, entretanto, mudou no servidor (outra sessão ou um agente). Escolhe:") + "</p>" +
    '<div class="conflito-acoes">' +
      '<button id="conf-servidor" class="btn" type="button">' + t("Ficar com a do servidor") + '</button>' +
      '<button id="conf-minha" class="btn" type="button">' + t("Ficar com a minha") + '</button>' +
      (temProposta ? '<button id="conf-proposta" class="btn" type="button">' + (propostaLinhas ? t("Usar a junção automática") : t("Usar a proposta da IA")) + '</button>' : "") +
      '<button id="conf-mao" class="btn btn-primary" type="button">' + t("Juntar à mão") + '</button>' +
    "</div></div>" +
    '<div class="conflito-lado-a-lado">' +
      '<div class="conflito-coluna"><h3>' + t("Servidor (actual)") + '</h3><pre class="conflito-texto">' + escapeHtml(actualTexto) + "</pre></div>" +
      '<div class="conflito-coluna"><h3>' + t("A tua (sem rede)") + '</h3><pre class="conflito-texto">' + escapeHtml(conflito.teu) + "</pre></div>" +
    "</div>" +
    (temProposta
      ? '<div class="conflito-coluna" style="margin-top:12px"><h3>' + (propostaLinhas ? t("Junção automática (linha a linha, sem IA) — revê antes de usar") : t("Proposta da IA — revê antes de usar")) + '</h3>' +
        (conflito.resumo ? '<p class="dim-note">' + escapeHtml(conflito.resumo) + "</p>" : "") +
        '<pre class="conflito-texto">' + escapeHtml(conflito.proposta) + "</pre></div>"
      : "");
  function reabrir(){ if(NOTAS_SHELL) NOTAS_SHELL.abrir({tipo:"nota", nome: nota.nome}); }
  async function gravarEscolha(texto, baseHash, msgOk, aoMudar){
    // ronda 5 (auditoria externa, ronda 4): se a cópia deste aparelho for apagada (e religada) enquanto o PUT corre, a confirmação
    // que chega depois já não lhe toca — o editor já fazia isto (ronda 4 G5); os botões do conflito ainda não.
    var geracao = await geracaoActual();                       // ronda 6 G6: a persistente
    function copiaMudou(){ return COPIA_DESLIGADA || geracao !== GERACAO_COPIA; }
    try{
      var res = await apiSend("PUT", "/api/nota?nome=" + encodeURIComponent(nota.nome), {texto: texto, base_hash: baseHash});
      if(copiaMudou()){
        showToast(msgOk + " " + t("A cópia deste aparelho foi apagada entretanto — não lhe toquei."));
        reabrir();
        return;
      }
      var fila = await confirmarGravacaoComRede(nota.nome, null, texto, res.hash, geracao);
      if(fila === "desligada"){                                  // ronda 6 G6: a transacção viu a geração mudar — nada se escreveu
        showToast(msgOk + " " + t("A cópia deste aparelho foi apagada entretanto — não lhe toquei."));
        reabrir();
        return;
      }
      await apagarConflitoSeIgual(nota.nome, conflito.quando, geracao);
      if(fila === "ficou") showToast(t("há outra alteração deste aparelho por enviar nesta nota — vai ser juntada a seguir."));
      await atualizarContadorFila();
      showToast(msgOk);
      reabrir();
    }catch(e){
      if(e.status === 409){
        if(aoMudar && !copiaMudou()) await aoMudar();   // ronda 5: a cópia apagada entretanto fica sem mexer
        showToast(t("a nota mudou outra vez no servidor — vê a versão nova e escolhe de novo."));
        reabrir();                          // volta a pedir a nota ao servidor: o conflito fica com o texto+hash novos
      }else{
        showToast(tf("falhou: {erro}", {erro: e.message}));
      }
    }
  }
  centro.querySelector("#conf-servidor").addEventListener("click", async function(){
    try{
      await apagarConflitoSeIgual(nota.nome, conflito.quando);
      var outra = await apagarFilaSeTexto(nota.nome, conflito.teu).catch(function(){ return false; });
      await atualizarContadorFila();
      showToast(outra ? t("ficaste com a versão do servidor — há outra alteração deste aparelho por enviar, que fica.")
                      : t("ficaste com a versão do servidor."));
      reabrir();
    }catch(e){ showToast(tf("falhou: {erro}", {erro: e.message})); }
  });
  centro.querySelector("#conf-minha").addEventListener("click", function(){
    gravarEscolha(conflito.teu, actualHash, t("ficaste com a tua versão."));
  });
  if(temProposta){
    centro.querySelector("#conf-proposta").addEventListener("click", function(){
      gravarEscolha(conflito.proposta, conflito.proposta_hash, propostaLinhas ? t("ficou a junção automática.") : t("ficou a proposta da IA."), async function(){
        conflito.proposta = null; conflito.proposta_hash = null;     // feita sobre uma versão que já não é a actual
        await alterarConflitoSeIgual(nota.nome, conflito.quando, function(c){ c.proposta = null; c.proposta_hash = null; }).catch(function(){});   // 
      });
    });
  }
  centro.querySelector("#conf-mao").addEventListener("click", function(){
    var notaMesclada = {
      nome: nota.nome, projeto: nota.projeto, editavel: nota.editavel,
      texto: "<<<<<<< " + t("SERVIDOR (actual)") + "\n" + actualTexto + "\n=======\n" + conflito.teu + "\n>>>>>>> " + t("A TUA VERSÃO (sem rede)") + "\n",
      hash: actualHash, meta: nota.meta, backlinks: nota.backlinks || [],
      parecidas: nota.parecidas || [], historico: nota.historico || [], categorias: nota.categorias || [],
      baseFila: actualTexto,           // se gravar sem rede, a base é a versão do servidor (não o texto com as marcas)
      resolveConflito: true,           // o conflito só sai quando esta gravação acabar bem
      conflitoQuando: conflito.quando  // … e só se ainda for ESTE conflito (não um mais novo, de outro separador)
    };
    ABRIR_EM_EDICAO = nota.nome;
    renderNotaCompleta(notaMesclada, centro, contexto);
  });
}

function renderNotaCompleta(nota, centro, contexto){

    var larguraWrap = centro.querySelector("#nota-largura-wrap");

  function entrarEdicao(ehNova){

    centro.innerHTML =

    var baseTextoEdicao = nota.baseFila != null ? nota.baseFila : nota.texto;    // #41: base para a fila offline (no conflito, a do servidor)
    // aberto sobre uma edição sem rede ainda por enviar, o texto é o da fila mas o hash é o do servidor AGORA —

    var editaSobreFila = !!nota.porEnviar && !nota.resolveConflito;

    }

    function atualizarMarcaDirty(){
      if(dirtyMarca) dirtyMarca.textContent = porGravar ? t("● por gravar") : "";
    }

    // critério p/ "o texto quase não mudou" (não repetir o pedido): o comprimento variou menos de 20
    // caracteres desde a última verificação — barato de calcular e evita chamadas a cada tecla.
    function agendarVerificacaoParecida(texto){
      if(!ehNova) return;
      if(temporizadorParecidas) clearTimeout(temporizadorParecidas);
      temporizadorParecidas = setTimeout(function(){ verificarParecida(texto); }, 3000);
    }
    async function verificarParecida(texto){
      if(!navigator.onLine) return;
      if(String(texto || "").length < 200){
        avisoParecidaEl.classList.add("hidden");
        avisoParecidaEl.innerHTML = "";
        return;
      }
      if(ultimoTextoParecidas !== null && Math.abs(texto.length - ultimoTextoParecidas.length) < 20) return;
      ultimoTextoParecidas = texto;
      try{
        var res = await apiSend("POST", "/api/parecidas", {nome: nota.nome, texto: texto});
        if(res && res.parecidas && res.parecidas.length){
          var p = res.parecidas[0];
          avisoParecidaEl.innerHTML =
            '⚠️ ' + t("Já existe uma nota muito parecida:") + ' <a href="#/nota/' + encodeURIComponent(p.nome) + '">[[' +
            escapeHtml(p.nome) + "]] (" + Math.round(p.semelhanca * 100) + "%)</a> — " +
            '<a href="#/nota/' + encodeURIComponent(p.nome) + '">' + t("abrir") + '</a>';
          avisoParecidaEl.classList.remove("hidden");
        }else{
          avisoParecidaEl.classList.add("hidden");
          avisoParecidaEl.innerHTML = "";
        }
      }catch(e){ /* aviso opcional — falha silenciosa, não incomodar a escrever */ }
    }

    function marcarAlteracoes(texto){
      porGravar = (texto !== baseTextoEdicao);
      atualizarMarcaDirty();
      agendarVerificacaoParecida(texto);
    }

    function ligacoesJaExistentes(texto){
      var set = {}, rx = /\[\[([^\]|#]+)(?:#[^\]|]*)?(?:\|[^\]]*)?\]\]/g, m;
      while((m = rx.exec(String(texto || "")))){ set[m[1].trim()] = true; }
      return set;
    }

    function actualizarEstadoRede(){
      var online = navigator.onLine;
      iaBtn.disabled = !online;
      ligacoesBtn.disabled = !online;
      if(redeAviso) redeAviso.classList.toggle("hidden", online);
      if(!online){ iaMenu.classList.add("hidden"); ligacoesPainel.classList.add("hidden"); }
    }
    function fecharMenusSeForaDe(e){
      if(!iaMenu.classList.contains("hidden") && !iaMenu.contains(e.target) && e.target !== iaBtn){
        iaMenu.classList.add("hidden");
      }
      if(!ligacoesPainel.classList.contains("hidden") && !ligacoesPainel.contains(e.target) && e.target !== ligacoesBtn){
        ligacoesPainel.classList.add("hidden");
      }
    }

    async function abrirPainelLigacoes(){
      if(!navigator.onLine){ showToast(t("precisa de rede para sugerir ligações.")); return; }
      var sel = editorApi.selecao();
      var q = (sel.texto || "").slice(0, 300).trim();
      if(!q){ showToast(t("põe o cursor num parágrafo com texto.")); return; }
      ligacoesPainel.classList.remove("hidden");
      ligacoesPainel.innerHTML = '<div class="cmd-loading"><span class="spinner"></span>' + t("a procurar…") + '</div>';
      try{
        var results = await apiGet("/api/procura?q=" + encodeURIComponent(q) + "&n=8");
        var existentes = ligacoesJaExistentes(editorApi.obterTexto());
        var sugestoes = (results || []).filter(function(r){
          return r && r.nome && r.nome !== nota.nome && !existentes[r.nome];
        }).slice(0, 5);
        if(!sugestoes.length){
          ligacoesPainel.innerHTML = '<div class="cmd-empty">' + t("sem sugestões novas.") + '</div>';
          return;
        }
        ligacoesPainel.innerHTML = sugestoes.map(function(s){
          return '<button type="button" class="editor-dropdown-item" data-nome="' + escapeHtml(s.nome) + '">+ [[' + escapeHtml(s.nome) + "]]</button>";
        }).join("");
        ligacoesPainel.querySelectorAll("button[data-nome]").forEach(function(b){
          b.addEventListener("click", function(){
            editorApi.inserirNoCursor("[[" + b.getAttribute("data-nome") + "]]");
            editorApi.focar();
            b.remove();
            if(!ligacoesPainel.querySelector("button[data-nome]")) ligacoesPainel.classList.add("hidden");
          });
        });
      }catch(e){
        ligacoesPainel.innerHTML = '<div class="cmd-error">' + tf("falhou: {erro}", {erro: escapeHtml(e.message)}) + "</div>";
      }
    }

    async function executarAccaoIa(acao){
      if(!navigator.onLine){ showToast(t("precisa de rede para usar a IA.")); return; }
      var sel = editorApi.selecao();
      if(!sel.texto || !sel.texto.trim()){
        showToast(t("selecciona texto ou põe o cursor num parágrafo."));
        return;
      }
      if(sel.texto.trim().length > IA_MAX_CARACTERES){      // antes o servidor cortava e o «Substituir» apagava o fim
        showToast(tf("a selecção tem {n} caracteres; a IA só trabalha com até {max} — selecciona menos.", {n: sel.texto.trim().length, max: IA_MAX_CARACTERES}));
        return;
      }
      var root = document.getElementById("modal-root");
      var cancelado = false;
      var iaCtrl = (typeof AbortController === "function") ? new AbortController() : null;
      root.innerHTML =
        '<div class="modal-backdrop" id="ia-backdrop">' +
          '<div class="modal ia-modal" role="dialog" aria-modal="true">' +
            "<h2>" + escapeHtml(IA_ACOES_LABEL[acao] || acao) + "</h2>" +
            '<div id="ia-corpo"><div class="state-loading"><span class="spinner"></span>' + t("a pensar…") + '</div></div>' +
            '<div class="modal-actions" id="ia-acoes"><button id="ia-cancelar" class="btn" type="button">' + t("Cancelar") + '</button></div>' +
          "</div></div>";
      var backdrop = document.getElementById("ia-backdrop");
      function fechar(){ cancelado = true; root.innerHTML = ""; if(iaCtrl){ try{ iaCtrl.abort(); }catch(_e){} } }
      backdrop.addEventListener("click", function(e){ if(e.target === backdrop) fechar(); });
      document.getElementById("ia-cancelar").addEventListener("click", fechar);

      var res, erro = null;
      try{
        res = await apiSend("POST", "/api/ia", {acao: acao, texto: sel.texto, contexto: editorApi.obterTexto()}, iaCtrl ? {signal: iaCtrl.signal} : undefined);
      }catch(e){ erro = e; }
      if(cancelado) return;
      var corpo = document.getElementById("ia-corpo");
      if(!corpo) return;   // painel já foi fechado entretanto
      if(erro){
        corpo.innerHTML = '<div class="state-error"><p>⚠️ ' + escapeHtml(erro.message) + "</p></div>";
        return;
      }
      corpo.innerHTML =
        '<div class="ia-comparacao">' +
          '<div class="ia-coluna"><h3>' + t("Original") + '</h3><pre class="ia-texto">' + escapeHtml(sel.texto) + "</pre></div>" +
          '<div class="ia-coluna"><h3>' + t("Proposta") + '</h3><pre class="ia-texto">' + escapeHtml(res.texto) + "</pre></div>" +
        "</div>";
      var acoesEl = document.getElementById("ia-acoes");
      acoesEl.innerHTML =
        '<button id="ia-substituir" class="btn btn-primary" type="button">' + t("Substituir") + '</button>' +
        '<button id="ia-inserir" class="btn" type="button">' + t("Inserir a seguir") + '</button>' +
        '<button id="ia-cancelar2" class="btn" type="button">' + t("Cancelar") + '</button>';
      document.getElementById("ia-substituir").addEventListener("click", function(){
        editorApi.substituir(sel.de, sel.ate, res.texto);
        editorApi.focar();
        fechar();
      });
      document.getElementById("ia-inserir").addEventListener("click", function(){
        editorApi.substituir(sel.ate, sel.ate, "\n\n" + res.texto);
        editorApi.focar();
        fechar();
      });
      document.getElementById("ia-cancelar2").addEventListener("click", fechar);
    }

    iaBtn.addEventListener("click", function(){
      if(!navigator.onLine){ showToast(t("precisa de rede para usar a IA.")); return; }
      ligacoesPainel.classList.add("hidden");
      iaMenu.classList.toggle("hidden");
    });
    iaMenu.querySelectorAll("button[data-acao]").forEach(function(b){
      b.addEventListener("click", function(){
        iaMenu.classList.add("hidden");
        executarAccaoIa(b.getAttribute("data-acao"));
      });
    });
    ligacoesBtn.addEventListener("click", function(){
      iaMenu.classList.add("hidden");
      if(ligacoesPainel.classList.contains("hidden")) abrirPainelLigacoes();
      else ligacoesPainel.classList.add("hidden");
    });
    ligarGlobal(document, "click", fecharMenusSeForaDe);
    ligarGlobal(window, "online", actualizarEstadoRede);
    ligarGlobal(window, "offline", actualizarEstadoRede);
    actualizarEstadoRede();

    function cancelar(){
      limparSessaoEdicao();
      if(nota.resolveConflito && NOTAS_SHELL){ NOTAS_SHELL.abrir({tipo:"nota", nome: nota.nome}); return; }   // o conflito continua
      renderVer();
    }

    // Escape/Ctrl+S num único ouvinte no contentor do editor: se o CodeMirror já tratou a tecla
    // (ex.: Escape a fechar a pesquisa, ou o seu próprio atalho Mod-s) o evento chega com
    // defaultPrevented=true e não fazemos nada — evita cancelar/gravar em duplicado.
    function ligarComandosComuns(alvo){
      ligarAnexosNoEditor(alvo, function(){ return editorApi; });
      alvo.addEventListener("keydown", function(e){
        if(e.defaultPrevented) return;
        if(e.key === "Escape"){ cancelar(); return; }
        if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s"){
          e.preventDefault();
          gravar();
        }
      });
    }

    function montarTextareaFallback(){
      host.innerHTML = '<textarea id="ed-textarea" class="editor-textarea" spellcheck="false"></textarea>';
      var textarea = host.querySelector("#ed-textarea");
      textarea.value = nota.texto;
      editorApi = criarAdaptadorTextarea(textarea);
      textarea.addEventListener("input", debounce(function(){ atualizarPreview(textarea.value); }, 150));
      textarea.addEventListener("input", debounce(function(){ marcarAlteracoes(textarea.value); }, 400));
      ligarComandosComuns(host);
      textarea.focus();
    }

    function montarEditorNovo(){
      carregarEtiquetas();
      editorApi = edInstance = window.BasaltEditor.criar(host, {
        etiquetas: function(){ return ETIQUETAS_CACHE; },
        texto: nota.texto,
        tema: temaEditorActual(),
        listarNotas: function(){
          return ((NOTAS_SHELL && NOTAS_SHELL.notas) || []).map(function(n){ return {nome: n.nome, titulo: n.titulo}; });
        },
        abrirNota: function(nomeNota){
          if(porGravar && !window.confirm(t("Tens alterações por gravar nesta nota. Sair sem gravar?"))) return;
          limparSessaoEdicao();
          location.hash = "#/nota/" + nomeNota;
        },
        aoMudar: function(texto){ atualizarPreview(texto); marcarAlteracoes(texto); },
        aoGravar: function(){ gravar(); }
      });
      EDITOR_ACTIVO = editorApi;
      ligarComandosComuns(host);
      editorApi.focar();
    }

    atualizarPreview(nota.texto);

    var tabs = centro.querySelectorAll(".tab-btn");
    var split = centro.querySelector(".editor-split");
    tabs.forEach(function(t){
      t.addEventListener("click", function(){
        tabs.forEach(function(x){ x.classList.remove("active"); });
        t.classList.add("active");
        split.dataset.activeTab = t.dataset.tab;
      });
    });

    centro.querySelector("#ed-cancelar").addEventListener("click", cancelar);
    centro.querySelector("#ed-gravar").addEventListener("click", gravar);

    async function gravar(){
      banner.innerHTML = '<div class="state-loading"><span class="spinner"></span>' + t("a gravar…") + '</div>';
      var textoActual = editorApi.obterTexto();
      var geracao = await geracaoActual();   // se a cópia for apagada (e religada) enquanto o PUT corre, o resultado já não toca na cópia
      if(editaSobreFila){
        try{
          await guardarEdicaoOffline(nota.nome, baseTextoEdicao, textoActual);
          nota.texto = textoActual;
          banner.innerHTML = "";
          showToast(t("guardado — a juntar com a versão do servidor…"));
          limparSessaoEdicao();
          renderVer();
          sincronizarFila();
        }catch(e2){
          banner.innerHTML = '<div class="state-error"><p>⚠️ ' + tf("não consegui guardar: {erro}", {erro: escapeHtml(e2.message)}) + "</p></div>";
        }
        return;
      }
      try{
        var res = await apiSend("PUT", "/api/nota?nome=" + encodeURIComponent(nota.nome),
          {texto: textoActual, base_hash: nota.hash});
        nota.texto = textoActual;
        nota.hash = res.hash;
        nota.porEnviar = false;
        var filaDepois = (COPIA_DESLIGADA || geracao !== GERACAO_COPIA) ? "" :   // cópia apagada entretanto → não escrever nela
          await confirmarGravacaoComRede(nota.nome, null, textoActual, res.hash, geracao).catch(function(){ return ""; });
        atualizarContadorFila();
        if(filaDepois === "ficou") showToast(t("há outra alteração deste aparelho por enviar nesta nota — vai ser juntada a seguir."));
        if(filaDepois === "desligada") showToast(t("a cópia deste aparelho foi apagada entretanto — a nota ficou gravada no servidor, não lhe toquei aqui."));   // ronda 6 G6
        if(nota.resolveConflito){ nota.resolveConflito = false; nota.baseFila = null; if(geracao === GERACAO_COPIA) await apagarConflitoSeIgual(nota.nome, nota.conflitoQuando, geracao).catch(function(){}); }   // 
        banner.innerHTML = "";
        showToast(t("nota gravada."));
        limparSessaoEdicao();
        renderVer();
      }catch(e){
        if(e.status === 409 && e.data && e.data.pendente){
          banner.innerHTML = '<div class="state-error"><p>⚠️ ' + escapeHtml(e.message) + '</p>' +
            '<button id="ed-de-novo" class="btn btn-primary" type="button">' + t("gravar outra vez") + '</button></div>';
          banner.querySelector("#ed-de-novo").addEventListener("click", gravar);
        }else if(e.status === 409){
          banner.innerHTML =
            '<div class="state-error"><p>⚠️ ' + t("a nota mudou entretanto.") + '</p>' +
            '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
            '<button id="ed-copiar" class="btn" type="button">' + t("copiar o meu texto") + '</button>' +
            '<button id="ed-recarregar" class="btn btn-primary" type="button">' + t("recarregar") + '</button>' +
            "</div></div>";
          banner.querySelector("#ed-copiar").addEventListener("click", async function(){
            try{ await navigator.clipboard.writeText(textoActual); showToast(t("copiado.")); }
            catch(err){
              try{
                var tmp = document.createElement("textarea");
                tmp.value = textoActual; document.body.appendChild(tmp); tmp.select();
                document.execCommand && document.execCommand("copy");
                document.body.removeChild(tmp);
                showToast(t("copiado (modo alternativo)."));
              }
              catch(err2){ showToast(t("não consegui copiar automaticamente — selecciona e copia à mão.")); }
            }
          });
          banner.querySelector("#ed-recarregar").addEventListener("click", function(){
            if(NOTAS_SHELL) NOTAS_SHELL.abrir({tipo: "nota", nome: nota.nome});
          });
        }else if(e.status === 400){
          banner.innerHTML = '<div class="state-error"><p>⚠️ ' + escapeHtml(e.message) + "</p></div>";
        }else if(e.semRede && (COPIA_DESLIGADA || geracao !== GERACAO_COPIA)){
          // sem rede E a cópia deste aparelho apagada — não se volta a criar fila; o texto fica no editor
          // idem se foi apagada (mesmo que religada) enquanto este PUT corria — uma edição descartada não ressuscita na fila
          banner.innerHTML = '<div class="state-error"><p>⚠️ ' + t("sem rede, e a cópia deste aparelho está apagada (ou foi apagada entretanto) — não guardo aqui. Copia o teu texto ou volta a ligar a cópia (no Início) e grava outra vez.") + '</p>' +
            '<button id="ed-copiar-off" class="btn" type="button">' + t("copiar o meu texto") + '</button></div>';
          banner.querySelector("#ed-copiar-off").addEventListener("click", function(){
            try{ navigator.clipboard.writeText(textoActual).then(function(){ showToast(t("copiado.")); }); }catch(err){ showToast(t("não consegui copiar automaticamente — selecciona e copia à mão.")); }
          });
        }else if(e.semRede){
          // #41: sem rede — guarda no aparelho em vez de perder a edição; sobe sozinho quando houver rede
          try{
            await guardarEdicaoOffline(nota.nome, baseTextoEdicao, textoActual);
            if(nota.resolveConflito){ nota.resolveConflito = false; await apagarConflitoSeIgual(nota.nome, nota.conflitoQuando, geracao).catch(function(){}); }   // 
            nota.texto = textoActual;
            nota.porEnviar = true;
            banner.innerHTML = '<div class="state-ok"><p>' + t("guardado no aparelho; sobe quando houver rede.") + '</p></div>';
            showToast(t("guardado no aparelho — sem rede."));
            limparSessaoEdicao();
            renderVer();
          }catch(e2){
            banner.innerHTML = '<div class="state-error"><p>⚠️ ' + tf("não consegui guardar nem no aparelho: {erro}", {erro: escapeHtml(e2.message)}) + "</p></div>";
          }
        }else{
          banner.innerHTML = '<div class="state-error"><p>⚠️ ' + tf("falhou a gravar: {erro}", {erro: escapeHtml(e.message)}) + "</p></div>";
        }
      }
    }

    carregarBasaltEditorLib().then(function(ok){
      if(ok) montarEditorNovo(); else montarTextareaFallback();
    });
  }

  renderVer();
}

function renderContextoLinha(item){
  var textoEscapado = escapeHtml(item.contexto || "");
  var realcado = textoEscapado.replace(/\[\[([a-zA-Z0-9_:]+)(?:\|[^\]]+)?\]\]/g, function(m){
    return '<mark class="contexto-realce">' + m + "</mark>";
  });
  return '<li><a href="#/nota/' + item.nome + '" data-nome="' + escapeHtml(item.nome) + '">' + escapeHtml(item.nome) + "</a>" +
    (item.contexto ? '<p class="backlink-contexto">' + realcado + "</p>" : "") + "</li>";
}

function renderPainelContexto(nota, estrutura, contexto){
  var html = "";
  if(estrutura.length){
    html += "<h3>" + t("Estrutura") + "</h3><ul class=\"estrutura-lista\">" + estrutura.map(function(h){
      var nivelClasse = h.nivel >= 3 ? "estrutura-nivel-3" : (h.nivel === 2 ? "estrutura-nivel-2" : "");
      return '<li class="' + nivelClasse + '"><button type="button" data-alvo="' + h.id + '">' +
        escapeHtml(h.texto) + "</button></li>";
    }).join("") + "</ul>";
  }
  if(nota.categorias && nota.categorias.length){
    html += "<h3>" + t("Categorias") + "</h3><div class=\"cat-chips-row\">" + nota.categorias.map(chipCategoria).join("") + "</div>";
  }
  html += "<h3>" + t("Grafo local") + "</h3><div id=\"mini-grafo-wrap\"></div>";
  html += "<h3>" + t("Quem aponta para aqui") + "</h3>" +
    (nota.backlinks.length ? '<ul class="link-list backlinks-lista">' + nota.backlinks.map(renderContextoLinha).join("") + "</ul>"
      : '<p class="dim-note">' + t("ninguém, por agora.") + '</p>');
  html += "<h3>" + t("Notas parecidas") + "</h3>" +
    (nota.parecidas.length ? '<ul class="link-list">' + nota.parecidas.map(function(p){
      return '<li><a href="#/nota/' + p.nome + '" data-nome="' + escapeHtml(p.nome) + '">' + escapeHtml(p.nome) +
        '</a> <span class="dim-note">' + Math.round(p.sim * 100) + "%</span></li>";
    }).join("") + "</ul>" : '<p class="dim-note">' + t("nenhuma semelhança forte.") + '</p>');
  html += "<h3>" + t("Histórico") + "</h3>" +
    (nota.historico.length ? '<ul class="timeline">' + nota.historico.map(function(h){
      return '<li><span class="timeline-data">' + escapeHtml(h.data) + '</span><span class="timeline-msg">' + escapeHtml(h.msg) + "</span></li>";
    }).join("") + "</ul>" : '<p class="dim-note">' + t("sem histórico.") + '</p>');
  contexto.innerHTML = html;
  contexto.querySelectorAll("[data-alvo]").forEach(function(btn){
    btn.addEventListener("click", function(){
      var el = document.getElementById(btn.dataset.alvo);
      if(el) el.scrollIntoView({behavior: "smooth", block: "start"});
    });
  });
  var miniWrap = contexto.querySelector("#mini-grafo-wrap");
  if(miniWrap) renderMiniGrafo(miniWrap, nota.nome);
}

function renderNotaRow(n){
  var d = new Date(n.mtime * 1000);
  return '<li><a class="nota-row" href="#/nota/' + n.nome + '">' +
    '<div class="nota-row-top"><span class="nota-titulo">' + escapeHtml(n.titulo) + "</span>" +
    '<span class="badge" data-tipo="' + escapeHtml(n.tipo) + '">' + escapeHtml(n.tipo) + "</span>" +
    "</div>" +
    '<p class="nota-desc">' + escapeHtml(n.desc || "") + "</p>" +
    '<span class="nota-data">' + fmtDataCurta(d) + "</span>" +
    "</a></li>";
}

function openNovaNotaModal(preenchido){
  // 25/09: preenchido = {desc, corpo} — usado pela Entrada («Criar nota com isto»), para pré-preencher
  // a descrição e o corpo da nota com a ideia; o utilizador só escolhe o nome. Sem argumento, comporta-se como antes.
  var root = document.getElementById("modal-root");
  root.innerHTML =
    '<div class="modal-backdrop" id="modal-backdrop">' +
      '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">' +
        '<h2 id="modal-title">' + t("Nova nota") + '</h2>' +
        '<label>' + t("Nome (snake_case)") + '<input id="nn-nome" type="text" autocomplete="off" placeholder="' + t("ex: project_novo_site") + '"></label>' +
        '<p class="field-error" id="nn-nome-erro"></p>' +
        '<label>' + t("Tipo") + '<select id="nn-tipo">' +
          '<option value="user">user</option><option value="feedback">feedback</option>' +
          '<option value="project" selected>project</option><option value="reference">reference</option>' +
          '<option value="outros">outros</option></select></label>' +
        '<label>' + t("Descrição") + '<input id="nn-desc" type="text" placeholder="' + t("uma frase a descrever a nota") + '"></label>' +
        '<p class="field-error" id="nn-erro-geral"></p>' +
        '<div class="modal-actions"><button class="btn" id="nn-cancelar" type="button">' + t("Cancelar") + '</button>' +
        '<button class="btn btn-primary" id="nn-criar" type="button">' + t("Criar") + '</button></div>' +
      "</div></div>";
  var backdrop = document.getElementById("modal-backdrop");
  var nomeInput = document.getElementById("nn-nome");
  var nomeErro = document.getElementById("nn-nome-erro");

    return ok && !!v;
  }
  nomeInput.addEventListener("input", validarNome);
  function closeModal(){ root.innerHTML = ""; document.removeEventListener("keydown", escHandler); }
  function escHandler(e){ if(e.key === "Escape") closeModal(); }
  backdrop.addEventListener("click", function(e){ if(e.target === backdrop) closeModal(); });
  document.getElementById("nn-cancelar").addEventListener("click", closeModal);
  document.addEventListener("keydown", escHandler);
  document.getElementById("nn-criar").addEventListener("click", async function(){
    if(!validarNome()) return;
    var nome = nomeInput.value.trim();

    var desc = document.getElementById("nn-desc").value.trim();
    var geralErro = document.getElementById("nn-erro-geral");

    var texto = "---\nname: " + nome + '\ndescription: "' + descYaml + '"\nmetadata:\n  type: ' + tipo + "\n---\n\n" +
      (preenchido && preenchido.corpo ? preenchido.corpo + "\n" : "");
    geralErro.style.color = "var(--text-dim)";
    geralErro.textContent = t("a criar…");
    try{
      await apiSend("POST", "/api/nota", {nome: nome, texto: texto});
      ABRIR_EM_EDICAO = nome;
      NOTA_RECEM_CRIADA = nome;   // #41 fase 3b: só esta 1ª edição mostra o aviso de "nota parecida"
      if(NOTAS_SHELL){
        try{
          NOTAS_SHELL.notas = await apiGet("/api/notas");
          if(NOTAS_SHELL.agrupamento !== "indice") NOTAS_SHELL.renderArvore();
        }catch(e2){}
      }
      closeModal();
      location.hash = "#/nota/" + nome;
    }catch(e){
      geralErro.style.color = "var(--danger)";
      geralErro.textContent = e.message;
    }
  });
  nomeInput.focus();
}

function abrirSeletorNotaParaJuntar(aoEscolher){
  // 25/09: selector de notas para "outra nota…" / "Juntar a uma nota…" na Entrada — reaproveita o
  // aspecto do salto rápido (mesmas classes CSS), mas filtra só as editáveis e chama aoEscolher(nome) em vez de navegar.
  var root = document.getElementById("modal-root");
  root.innerHTML =
    '<div class="modal-backdrop" id="salto-backdrop">' +
      '<div class="modal salto-modal" role="dialog" aria-modal="true">' +
        '<input id="salto-input" type="text" placeholder="' + t("Escolher nota… (nome ou título)") + '" autocomplete="off">' +
        '<div id="salto-lista" class="salto-lista"></div>' +
      "</div></div>";
  var backdrop = document.getElementById("salto-backdrop");
  var input = document.getElementById("salto-input");
  var listaEl = document.getElementById("salto-lista");
  var selecionado = 0;
  var todas = [];
  var resultados = [];

  function fechar(){
    root.innerHTML = "";
    document.removeEventListener("keydown", tratarTeclado, true);
  }
  backdrop.addEventListener("click", function(e){ if(e.target === backdrop) fechar(); });

  function marcarActivo(){
    var itens = listaEl.querySelectorAll(".salto-item");
    itens.forEach(function(el, i){ el.classList.toggle("activo", i === selecionado); });
    var activo = listaEl.querySelector(".salto-item.activo");
    if(activo) activo.scrollIntoView({block: "nearest"});
  }
  function escolher(i){
    var n = resultados[i];
    if(!n) return;
    fechar();
    aoEscolher(n.nome);
  }
  function renderResultados(){
    listaEl.innerHTML = resultados.length
      ? resultados.map(function(n, i){
          return '<div class="salto-item' + (i === selecionado ? " activo" : "") + '" data-i="' + i + '">' +
            '<span class="salto-titulo">' + escapeHtml(n.titulo) + "</span>" +
            '<span class="salto-meta">' + escapeHtml(n.nome) + "</span>" +
          "</div>";
        }).join("")
      : '<p class="dim-note" style="padding:12px">' + t("nenhuma nota corresponde.") + '</p>';
    listaEl.querySelectorAll(".salto-item").forEach(function(el){
      el.addEventListener("mouseenter", function(){ selecionado = +el.dataset.i; marcarActivo(); });
      el.addEventListener("click", function(){ escolher(+el.dataset.i); });
    });
    marcarActivo();
  }
  function aplicarFiltro(){
    var q = normalizarBusca(input.value);
    if(!q){
      resultados = todas.slice(0, 40);
    }else{
      resultados = todas.filter(function(n){
        return correspondeFuzzy(normalizarBusca(n.nome + " " + n.titulo + " " + (n.desc || "")), q);
      }).slice(0, 40);
    }
    selecionado = 0;
    renderResultados();
  }
  input.addEventListener("input", debounce(aplicarFiltro, 60));

  function tratarTeclado(e){
    if(e.key === "Escape"){ e.preventDefault(); fechar(); return; }
    if(e.key === "ArrowDown"){ e.preventDefault(); selecionado = Math.min(selecionado + 1, resultados.length - 1); marcarActivo(); return; }
    if(e.key === "ArrowUp"){ e.preventDefault(); selecionado = Math.max(selecionado - 1, 0); marcarActivo(); return; }
    if(e.key === "Enter"){ e.preventDefault(); escolher(selecionado); return; }
  }
  document.addEventListener("keydown", tratarTeclado, true);

  input.focus();
  listaEl.innerHTML = '<div class="state-loading"><span class="spinner"></span>' + t("a carregar…") + '</div>';
  apiGet("/api/notas").then(function(notas){
    todas = notas.filter(function(n){ return n.editavel; }).sort(function(a, b){ return b.mtime - a.mtime; });
    aplicarFiltro();
  }).catch(function(e){
    listaEl.innerHTML = '<p class="dim-note">' + tf("não consegui carregar as notas: {erro}", {erro: escapeHtml(e.message)}) + "</p>";
  });
}

async function juntarIdeia(t, nota, btn, recarregar){
  // 25/09: usado pelo botão principal "Juntar a «X»" e pelo selector "outra nota…" — acrescenta a
  // ideia no fim da nota escolhida (com data e origem) e tira-a da Entrada.
  if(!navigator.onLine){ showToast(basaltT("precisa de rede.")); return; }
  var textoOriginal = btn.textContent;
  btn.disabled = true;
  btn.textContent = basaltT("a juntar…");
  try{
    var res = await apiSend("POST", "/api/entrada/juntar", {t: t, nota: nota});
    showToast(res.mensagem || basaltT("junto."));
    await recarregar();
  }catch(e){
    btn.disabled = false;
    btn.textContent = textoOriginal;
    showToast(tf("falhou: {erro}", {erro: e.message}));
  }
}

    window.removeEventListener("online", atualizarEntradaRede);
    window.removeEventListener("offline", atualizarEntradaRede);
  };

  await carregar();
  async function carregar(){
    try{
      // 25/09: o Basalt arruma sozinho a cada 3 min (processar_entrada, no servidor) — /api/entrada só traz
      // o que sobrou por decidir; /api/entrada/auto traz o que ele já tratou (com Desfazer).

          "</div>" +

        "</div>" +
        '<section id="entrada-decidir"><h2>' + t("Para decidires") + '</h2>' +

            : '<p class="dim-note">' + t("nada a decidir — o Basalt tratou de tudo sozinho.") + '</p>') +
        "</section>" +
        (automaticas.length
          ? '<section id="entrada-auto"><h2>' + t("Arrumadas sozinhas (últimas)") + '</h2>' +
              '<ul class="entrada-lista">' + automaticas.map(renderEntradaAutoItem).join("") + "</ul></section>"
          : "");
      atualizarEntradaRede();

      body.querySelector("#quick-guarda-btn").addEventListener("click", async function(){ await quickGuarda(body); await carregar(); });
      body.querySelector("#quick-guarda-input").addEventListener("keydown", async function(e){
        if(e.key === "Enter"){ await quickGuarda(body); await carregar(); }
      });
      body.querySelectorAll(".arquivar-btn").forEach(function(btn){
        btn.addEventListener("click", async function(){
          if(!navigator.onLine){ showToast(t("precisa de rede.")); return; }
          btn.disabled = true;
          btn.textContent = t("a arquivar…");
          try{
            await apiSend("POST", "/api/entrada/arquivar", {n: Number(btn.dataset.n)});
            showToast(t("arquivado."));
            await carregar();
          }catch(e){
            btn.disabled = false;
            btn.textContent = t("Arquivar");
            showToast(tf("falhou: {erro}", {erro: e.message}));
          }
        });
      });
      body.querySelectorAll(".juntar-btn").forEach(function(btn){
        btn.addEventListener("click", function(){ juntarIdeia(btn.dataset.t, btn.dataset.nota, btn, carregar); });
      });
      body.querySelectorAll(".outra-nota-btn").forEach(function(btn){
        btn.addEventListener("click", function(){
          if(!navigator.onLine){ showToast(t("precisa de rede.")); return; }
          abrirSeletorNotaParaJuntar(function(nomeEscolhido){
            juntarIdeia(btn.dataset.t, nomeEscolhido, btn, carregar);
          });
        });
      });
      body.querySelectorAll(".criar-nota-btn").forEach(function(btn){
        btn.addEventListener("click", function(){
          openNovaNotaModal({desc: btn.dataset.texto, corpo: btn.dataset.texto});
        });
      });
      body.querySelectorAll(".eliminar-btn").forEach(function(btn){
        btn.addEventListener("click", async function(){
          if(!navigator.onLine){ showToast(t("precisa de rede.")); return; }
          if(!window.confirm(t("Eliminar esta ideia? Não fica em nenhuma nota."))) return;
          btn.disabled = true;
          btn.textContent = t("a eliminar…");
          try{
            var res2 = await apiSend("POST", "/api/entrada/apagar", {t: btn.dataset.t});
            showToast(res2.mensagem || t("eliminada."));
            await carregar();
          }catch(e){
            btn.disabled = false;
            btn.textContent = t("Eliminar");
            showToast(tf("falhou: {erro}", {erro: e.message}));
          }
        });
      });
      body.querySelectorAll(".desfazer-auto-btn").forEach(function(btn){
        btn.addEventListener("click", async function(){
          if(!navigator.onLine){ showToast(t("precisa de rede.")); return; }
          btn.disabled = true;
          btn.textContent = t("a desfazer…");
          try{
            var res3 = await apiSend("POST", "/api/entrada/desfazer", {t: btn.dataset.t});
            showToast(res3.mensagem || t("desfeito."));
            await carregar();   // recarrega as duas listas
          }catch(e){
            btn.disabled = false;
            btn.textContent = t("Desfazer");
            showToast(tf("falhou: {erro}", {erro: e.message}));
          }
        });
      });
    }catch(e){
      renderErrorBox(body, tf("não consegui carregar a entrada: {erro}", {erro: e.message}), carregar);
    }
  }
}
function renderEntradaItem(item){
  var d = new Date(item.t);
  var tAttr = escapeHtml(item.t);
  var acaoPrincipal = item.sugestao
    ? '<button class="btn btn-primary juntar-btn" type="button" data-t="' + tAttr + '" data-nota="' + escapeHtml(item.sugestao) +
      '">' + tf("Juntar a «{nome}»", {nome: escapeHtml(item.sugestao)}) + '</button>' +
      '<button class="btn-link outra-nota-btn" type="button" data-t="' + tAttr + '">' + t("outra nota…") + '</button>'
    : '<button class="btn criar-nota-btn" type="button" data-texto="' + escapeHtml(item.texto) + '">' + t("Criar nota com isto") + '</button>' +
      '<button class="btn outra-nota-btn" type="button" data-t="' + tAttr + '">' + t("Juntar a uma nota…") + '</button>';
  // "duvida": quando o Basalt já olhou para a ideia mas não teve a certeza — a entrada() do servidor ainda
  // não devolve este campo (só a entrada_auto() o tem); fica pronto para quando o trouxer, sem partir nada agora.
  var motivoDuvida = (item.auto && item.auto.acao === "duvida" && item.auto.motivo) ? item.auto.motivo : "";
  return '<li class="entrada-item" data-t="' + tAttr + '"><div class="entrada-top">' +
    '<span class="badge badge-origem">' + escapeHtml(item.de) + '</span>' +
    '<span class="dim-note">' + fmtDataCurta(d) + "</span></div>" +
    "<p>" + escapeHtml(item.texto) + "</p>" +
    (item.sugestao && item.porque && item.porque.length
      ? '<p class="dim-note entrada-porque">' + tf("em comum: {lista}", {lista: escapeHtml(item.porque.join(", "))}) + "</p>" : "") +
    (!item.sugestao ? '<p class="dim-note entrada-porque">' + t("sem nota certa") + '</p>' : "") +
    (motivoDuvida ? '<p class="dim-note entrada-porque">' + escapeHtml(motivoDuvida) + "</p>" : "") +

      '<span class="dim-note rede-aviso hidden">' + t("precisa de rede") + '</span>' +
    "</div></li>";
}

    "</div></div>";

  function fechar(){ root.innerHTML = ""; document.removeEventListener("keydown", escFechar); }
  function escFechar(e){ if(e.key === "Escape") fechar(); }
  backdrop.addEventListener("click", function(e){ if(e.target === backdrop) fechar(); });
  document.addEventListener("keydown", escFechar);

  var conteudo = document.getElementById("unir-conteudo");

  try{
    var res = await Promise.all([
      apiGet("/api/nota?nome=" + encodeURIComponent(nomeA)),
      apiGet("/api/nota?nome=" + encodeURIComponent(nomeB)),
    ]);
    notaA = res[0]; notaB = res[1];
  }catch(e){
    conteudo.innerHTML = '<div class="state-error"><p>⚠️ ' + tf("não consegui carregar as notas: {erro}", {erro: escapeHtml(e.message)}) + "</p></div>";
    return;
  }

  var backlinksA = notaA.backlinks.length, backlinksB = notaB.backlinks.length;
  var tamA = stripFrontmatter(notaA.texto).length, tamB = stripFrontmatter(notaB.texto).length;
  var sugereA = backlinksA !== backlinksB ? backlinksA > backlinksB : tamA >= tamB;

  function coluna(nota, backlinksN, tamanho, sugerida){
    var dataAlt = nota.historico && nota.historico.length ? nota.historico[0].data : "—";
    return '<div class="unir-coluna">' +
      '<label><input type="radio" name="unir-fica" value="' + escapeHtml(nota.nome) + '" ' + (sugerida ? "checked" : "") + "> " +

      "<dt>" + t("Caracteres") + "</dt><dd>" + tamanho + "</dd>" +
      "<dt>" + t("Quem aponta") + "</dt><dd>" + backlinksN + "</dd>" +
      "<dt>" + t("Última alteração") + "</dt><dd>" + escapeHtml(dataAlt) + "</dd></dl></div>";
  }

  conteudo.innerHTML =
    '<div class="unir-comparacao">' + coluna(notaA, backlinksA, tamA, sugereA) + coluna(notaB, backlinksB, tamB, !sugereA) + "</div>" +
    '<p class="dim-note">' + t("A outra desaparece: o conteúdo junta-se nesta, as ligações [[…]] nas outras notas passam a apontar para esta e o índice é actualizado. Fica uma fotografia antes e podes desfazer.") + "</p>" +
    '<p class="field-error" id="unir-erro"></p>' +
    '<div class="modal-actions"><button class="btn" id="unir-cancelar" type="button">' + t("Cancelar") + '</button>' +
    '<button class="btn btn-primary" id="unir-confirmar" type="button">' + t("Unir") + '</button></div>';

  document.getElementById("unir-cancelar").addEventListener("click", fechar);
  document.getElementById("unir-confirmar").addEventListener("click", async function(){
    var radio = conteudo.querySelector("input[name='unir-fica']:checked");
    var erroEl = document.getElementById("unir-erro");
    if(!radio){ erroEl.textContent = t("escolhe qual fica."); return; }
    var manter = radio.value;
    var fundir = manter === notaA.nome ? notaB.nome : notaA.nome;
    erroEl.textContent = "";
    try{
      var res2 = await apiSend("POST", "/api/unir", {manter: manter, fundir: fundir});
      document.removeEventListener("keydown", escFechar);
      abrirProgressoUnir(res2.job, main);
    }catch(e){
      erroEl.textContent = e.status === 409 ? t("já há uma fusão a correr — espera que acabe.") : e.message;
    }
  });
}

function abrirProgressoUnir(jobId, main){

        }catch(e){

function fmtDataISO(d){
  var ano = d.getFullYear(), mes = String(d.getMonth() + 1).padStart(2, "0"), dia = String(d.getDate()).padStart(2, "0");
  return ano + "-" + mes + "-" + dia;
}
function parseISODate(s){
  var partes = String(s || "").split("-").map(Number);
  if(partes.length !== 3 || partes.some(isNaN)) return new Date();
  return new Date(partes[0], partes[1] - 1, partes[2]);
}
function addDias(d, n){
  var novo = new Date(d);
  novo.setDate(novo.getDate() + n);
  return novo;
}
function cartaoNotasDiario(nomes){
  return '<div class="categoria-cards">' + nomes.map(function(nome){

      escapeHtml(nome) + "</strong></a>";
  }).join("") + "</div>";
}

/* ========================================================================
   Grafo (canvas + d3-force)
   ==================================================================== */

function getCssVar(name){
  var v = getComputedStyle(document.documentElement).getPropertyValue(name);
  return (v && v.trim()) || "#888";
}

/* ---- grafo local (mini-grafo no painel de contexto) ---- */

var GRAFO_CACHE_PROMESSA = null;
function obterGrafoCache(){
  if(!GRAFO_CACHE_PROMESSA) GRAFO_CACHE_PROMESSA = apiGet("/api/grafo");
  return GRAFO_CACHE_PROMESSA;
}
function idDoLink(x){ return typeof x === "object" && x !== null ? x.id : x; }
function construirMiniGrafo(grafoCompleto, nomeCentral, incluir2Saltos){
  var idMap = {};
  grafoCompleto.nodes.forEach(function(n){ idMap[n.id] = n; });
  var vizinhos1 = new Set();
  grafoCompleto.links.forEach(function(l){
    var s = idDoLink(l.source), t = idDoLink(l.target);
    if(s === nomeCentral) vizinhos1.add(t);
    if(t === nomeCentral) vizinhos1.add(s);
  });
  var incluidos = new Set([nomeCentral]);
  vizinhos1.forEach(function(v){ incluidos.add(v); });
  if(incluir2Saltos){
    var vizinhos2 = new Set();
    grafoCompleto.links.forEach(function(l){
      var s = idDoLink(l.source), t = idDoLink(l.target);
      if(vizinhos1.has(s)) vizinhos2.add(t);
      if(vizinhos1.has(t)) vizinhos2.add(s);
    });
    vizinhos2.forEach(function(v){ incluidos.add(v); });
  }
  var nodes = Array.from(incluidos).filter(function(id){ return idMap[id]; }).map(function(id){
    return Object.assign({}, idMap[id]);
  });
  var idsIncluidos = new Set(nodes.map(function(n){ return n.id; }));
  var links = [];
  var vistos = new Set();
  grafoCompleto.links.forEach(function(l){
    var s = idDoLink(l.source), t = idDoLink(l.target);
    if(idsIncluidos.has(s) && idsIncluidos.has(t)){
      var chave = [s, t].sort().join("|");
      if(!vistos.has(chave)){ vistos.add(chave); links.push({source: s, target: t}); }
    }
  });
  return {nodes: nodes, links: links};
}
function raioMini(n){ return Math.min(11, 3 + Math.sqrt(n.grau || 0) * 1.5); }
function corDeMiniGrafo(n){
  var CORES = {
    user: getCssVar("--tag-user"), feedback: getCssVar("--tag-feedback"),
    project: getCssVar("--tag-project"), reference: getCssVar("--tag-reference"),
    outros: getCssVar("--tag-outros"),
  };
  return CORES[n.tipo] || CORES.outros;
}
function renderMiniGrafo(container, nomeCentral){
  if(typeof d3 === "undefined" || !d3.forceSimulation){
    container.innerHTML = '<p class="dim-note">' + t("grafo indisponível.") + '</p>';
    return;
  }
  container.innerHTML =
    '<label class="mini-grafo-topo"><input type="checkbox" id="mini-grafo-2saltos"> ' + t("2 saltos") + '</label>' +
    '<div class="mini-grafo-canvas-wrap"><canvas id="mini-grafo-canvas"></canvas></div>';
  var chk = container.querySelector("#mini-grafo-2saltos");
  var canvas = container.querySelector("#mini-grafo-canvas");
  var sim = null;
  var W = 280, H = 220;

  function desenhar(incluir2){
    obterGrafoCache().then(function(grafo){
      var sub = construirMiniGrafo(grafo, nomeCentral, incluir2);
      if(sim) sim.stop();
      var dpr = window.devicePixelRatio || 1;
      canvas.width = W * dpr; canvas.height = H * dpr;
      canvas.style.width = W + "px"; canvas.style.height = H + "px";
      var ctx = canvas.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      var corTexto = getCssVar("--text");
      sim = d3.forceSimulation(sub.nodes)
        .force("link", d3.forceLink(sub.links).id(function(d){ return d.id; }).distance(36).strength(0.6))
        .force("charge", d3.forceManyBody().strength(-70))
        .force("center", d3.forceCenter(W / 2, H / 2))
        .force("collide", d3.forceCollide(function(d){ return raioMini(d) + 3; }))
        .on("tick", function(){
          ctx.clearRect(0, 0, W, H);
          ctx.strokeStyle = "rgba(128,128,128,.35)";
          sub.links.forEach(function(l){
            if(typeof l.source !== "object" || typeof l.target !== "object") return;
            ctx.beginPath(); ctx.moveTo(l.source.x, l.source.y); ctx.lineTo(l.target.x, l.target.y); ctx.stroke();
          });
          sub.nodes.forEach(function(n){
            var r = raioMini(n);
            ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
            ctx.fillStyle = corDeMiniGrafo(n);
            ctx.fill();
            if(n.id === nomeCentral){
              ctx.lineWidth = 2; ctx.strokeStyle = corTexto; ctx.stroke();
            }
          });
        });
      canvas.onclick = function(e){
        var rect = canvas.getBoundingClientRect();
        var x = e.clientX - rect.left, y = e.clientY - rect.top;
        var alvo = null, melhorD = Infinity;
        sub.nodes.forEach(function(n){
          var d = Math.hypot(n.x - x, n.y - y);
          if(d <= raioMini(n) + 4 && d < melhorD){ alvo = n; melhorD = d; }
        });
        if(alvo) location.hash = "#/nota/" + alvo.id;
      };
      canvas.title = t("clica num nó para abrir a nota");
    }).catch(function(){
      container.innerHTML = '<p class="dim-note">' + t("grafo indisponível.") + '</p>';
    });
  }
  chk.addEventListener("change", function(){ desenhar(chk.checked); });
  desenhar(false);
}

/* ---- pré-visualização ao passar o rato em [[ligações]] e nomes de notas ---- */

var PREVIEW_SUPORTADO = false;
try{ PREVIEW_SUPORTADO = window.matchMedia("(hover: hover) and (pointer: fine)").matches; }catch(e){}
var previewCache = {};
var previewTimerMostrar = null;
var previewTimerEsconder = null;
var previewEl = null;

function obterPreviewEl(){
  if(!previewEl){
    previewEl = document.createElement("div");
    previewEl.className = "preview-card hidden";
    previewEl.addEventListener("mouseenter", function(){
      if(previewTimerEsconder){ clearTimeout(previewTimerEsconder); previewTimerEsconder = null; }
    });
    previewEl.addEventListener("mouseleave", agendarEsconderPreview);
    document.body.appendChild(previewEl);
  }
  return previewEl;
}
function agendarEsconderPreview(){
  previewTimerEsconder = setTimeout(function(){ obterPreviewEl().classList.add("hidden"); }, 150);
}
function carregarNotaPreview(nome){
  if(!previewCache[nome]){
    previewCache[nome] = apiGet("/api/nota?nome=" + encodeURIComponent(nome)).catch(function(){ return null; });
  }
  return previewCache[nome];
}
function posicionarPreview(el, alvoEl){
  var r = alvoEl.getBoundingClientRect();
  var largura = 320;
  var top = r.bottom + 6;
  var left = r.left;
  if(left + largura > window.innerWidth - 12) left = window.innerWidth - largura - 12;
  if(left < 8) left = 8;
  if(top + 200 > window.innerHeight) top = Math.max(8, r.top - 210);
  el.style.top = top + "px";
  el.style.left = left + "px";
}
async function mostrarPreview(alvoEl, nome){
  var card = obterPreviewEl();
  card.innerHTML = '<div class="state-loading"><span class="spinner"></span>' + t("a carregar…") + '</div>';
  card.classList.remove("hidden");
  posicionarPreview(card, alvoEl);
  var nota = await carregarNotaPreview(nome);
  if(card.classList.contains("hidden")) return; // já foi fechada entretanto
  if(!nota){ card.innerHTML = '<p class="dim-note">' + t("não encontrada.") + '</p>'; return; }
  var corpo = stripFrontmatter(nota.texto);
  var linhas = corpo.split("\n").filter(function(l){ return l.trim(); }).slice(0, 12).join("\n");
  await prepararMarkdown(linhas);
  if(card.classList.contains("hidden")) return; // fechada enquanto carregava as libs
  var htmlCorpo = renderMarkdown(linhas);
  card.innerHTML =
    '<div class="preview-titulo">' + escapeHtml(nota.meta.name || nota.nome) + "</div>" +
    '<div class="cat-chips-row">' +
      '<span class="badge" data-tipo="' + escapeHtml(nota.meta.type || "outros") + '">' + escapeHtml(nota.meta.type || "outros") + "</span>" +
      (nota.categorias || []).map(chipCategoria).join("") +
    "</div>" +
    '<div class="preview-corpo markdown-body">' + htmlCorpo + "</div>";
  posicionarPreview(card, alvoEl);
  processarMermaidEm(card);
}
function ligarPreviewGlobal(){
  if(!PREVIEW_SUPORTADO) return;
  document.body.addEventListener("mouseover", function(e){
    var alvoEl = e.target.closest("[data-nome]");
    if(!alvoEl) return;
    if(previewTimerEsconder){ clearTimeout(previewTimerEsconder); previewTimerEsconder = null; }
    if(previewTimerMostrar) clearTimeout(previewTimerMostrar);
    previewTimerMostrar = setTimeout(function(){ mostrarPreview(alvoEl, alvoEl.dataset.nome); }, 350);
  });
  document.body.addEventListener("mouseout", function(e){
    var alvoEl = e.target.closest("[data-nome]");
    if(!alvoEl) return;
    if(previewTimerMostrar){ clearTimeout(previewTimerMostrar); previewTimerMostrar = null; }
    agendarEsconderPreview();
  });
}

async function viewGrafo(main){

  var canvas = document.getElementById("grafo-canvas");
  var wrap = document.querySelector(".grafo-canvas-wrap");

    estadoEl.classList.add("state-error-inline");
    return;
  }
  estadoEl.remove();

  var tiposPresentes = Array.from(new Set(dados.nodes.map(function(n){ return n.tipo; })));
  var tiposActivos = new Set(tiposPresentes);
  var filtrosDiv = document.getElementById("grafo-filtros");

  filtrosDiv.querySelectorAll(".tipo-chip").forEach(function(btn){
    btn.addEventListener("click", function(){
      var t = btn.dataset.tipo;

      else{ tiposActivos.add(t); btn.classList.add("active"); }
      draw();

  });

  var ctx = canvas.getContext("2d");
  var W = 0, H = 0;

  function resize(){
    var rect = wrap.getBoundingClientRect();
    W = rect.width; H = rect.height;
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(W * dpr);

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();

  var nodes = dados.nodes.map(function(n){ return Object.assign({}, n); });
  var links = dados.links.map(function(l){ return Object.assign({}, l); });

  var CORES = {
    user: getCssVar("--tag-user"), feedback: getCssVar("--tag-feedback"),
    project: getCssVar("--tag-project"), reference: getCssVar("--tag-reference"),
    outros: getCssVar("--tag-outros"),
  };
  var corTexto = getCssVar("--text");
  function corDe(n){ return CORES[n.tipo] || CORES.outros; }
  function raio(n){ return Math.min(18, 4 + Math.sqrt(n.grau || 0) * 2.2); }

  var simulation = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id(function(d){ return d.id; }).distance(38).strength(0.35))
    .force("charge", d3.forceManyBody().strength(-60))
    .force("center", d3.forceCenter(W/2, H/2))
    .force("collide", d3.forceCollide(function(d){ return raio(d) + 3; }))
    .on("tick", draw);

  var transform = {x:0, y:0, k:1};
  var hovered = null;
  var realce = "";

  function draw(){
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    ctx.translate(transform.x, transform.y);
    ctx.scale(transform.k, transform.k);

    var visiveis = new Set(nodes.filter(function(n){ return tiposActivos.has(n.tipo); }).map(function(n){ return n.id; }));

    ctx.lineWidth = 1 / transform.k;
    for(var i=0;i<links.length;i++){
      var l = links[i], s = l.source, t = l.target;
      if(typeof s !== "object" || typeof t !== "object") continue;
      if(!visiveis.has(s.id) || !visiveis.has(t.id)) continue;
      var dimL = realce && s.id.indexOf(realce) === -1 && t.id.indexOf(realce) === -1;
      ctx.strokeStyle = dimL ? "rgba(128,128,128,0.08)" : "rgba(128,128,128,0.35)";
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(t.x, t.y);
      ctx.stroke();
    }
    for(var j=0;j<nodes.length;j++){
      var n = nodes[j];
      if(!visiveis.has(n.id)) continue;
      var r = raio(n);
      var matches = !!realce && n.id.toLowerCase().indexOf(realce) !== -1;
      var dim = !!realce && !matches;
      ctx.beginPath();
      ctx.arc(n.x, n.y, r, 0, Math.PI*2);
      ctx.globalAlpha = dim ? 0.15 : 1;
      ctx.fillStyle = corDe(n);
      ctx.fill();
      if(matches || n === hovered){
        ctx.lineWidth = 2 / transform.k;
        ctx.strokeStyle = corTexto;
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }

  var onResize = debounce(function(){ resize(); draw(); }, 150);
  window.addEventListener("resize", onResize);

  document.getElementById("grafo-realce").addEventListener("input", debounce(function(e){
    realce = e.target.value.trim().toLowerCase();
    draw();
  }, 150));

  var activePointers = new Map();
  var draggingNode = null, panStart = null, pinchStart = null;

  function toWorld(cx, cy){
    var rect = canvas.getBoundingClientRect();
    var x = cx - rect.left, y = cy - rect.top;
    return {x: (x - transform.x) / transform.k, y: (y - transform.y) / transform.k};
  }
  function nodeAt(cx, cy){
    var p = toWorld(cx, cy);
    var melhor = null, melhorD = Infinity;
    for(var i=0;i<nodes.length;i++){
      var n = nodes[i];
      if(!tiposActivos.has(n.tipo)) continue;
      var dx = n.x - p.x, dy = n.y - p.y;
      var d = Math.hypot(dx, dy);
      var r = raio(n) + 4;
      if(d <= r && d < melhorD){ melhor = n; melhorD = d; }
    }
    return melhor;
  }

  function onPointerDown(e){
    canvas.setPointerCapture(e.pointerId);
    activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(activePointers.size === 1){
      var n = nodeAt(e.clientX, e.clientY);
      if(n){
        draggingNode = n;
        n.fx = n.x; n.fy = n.y;
        simulation.alphaTarget(0.3).restart();
      }else{
        panStart = {x:e.clientX, y:e.clientY, tx:transform.x, ty:transform.y};
      }
    }else if(activePointers.size === 2){
      if(draggingNode){ draggingNode.fx = null; draggingNode.fy = null; simulation.alphaTarget(0); draggingNode = null; }
      var pts = Array.from(activePointers.values());
      pinchStart = {
        dist: Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y),
        k: transform.k, tx: transform.x, ty: transform.y,
      };
    }
  }
  function onPointerMove(e){
    if(activePointers.has(e.pointerId)) activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(draggingNode && activePointers.size === 1){
      var p = toWorld(e.clientX, e.clientY);
      draggingNode.fx = p.x; draggingNode.fy = p.y;
      return;
    }
    if(activePointers.size === 2 && pinchStart){
      var pts = Array.from(activePointers.values());
      var dist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
      var k = Math.max(0.2, Math.min(4, pinchStart.k * (dist / (pinchStart.dist || 1))));
      transform.k = k; transform.x = pinchStart.tx; transform.y = pinchStart.ty;
      draw();
      return;
    }
    if(panStart && activePointers.size === 1){
      transform.x = panStart.tx + (e.clientX - panStart.x);
      transform.y = panStart.ty + (e.clientY - panStart.y);
      draw();
      return;
    }
    var hn = nodeAt(e.clientX, e.clientY);
    if(hn !== hovered){ hovered = hn; draw(); }
    if(hn){
      var rect = canvas.getBoundingClientRect();
      tooltip.textContent = hn.id;
      tooltip.style.left = (e.clientX - rect.left + 12) + "px";
      tooltip.style.top = (e.clientY - rect.top + 12) + "px";
      tooltip.classList.remove("hidden");
      canvas.style.cursor = "pointer";
    }else{
      tooltip.classList.add("hidden");
      canvas.style.cursor = panStart ? "grabbing" : "grab";
    }
  }
  function onPointerUp(e){
    var start = activePointers.get(e.pointerId);
    activePointers.delete(e.pointerId);
    if(draggingNode && activePointers.size === 0){
      var moved = start && (Math.abs(e.clientX-start.x) + Math.abs(e.clientY-start.y) > 4);
      draggingNode.fx = null; draggingNode.fy = null;
      simulation.alphaTarget(0);
      var alvo = draggingNode.id;
      draggingNode = null;
      if(!moved) location.hash = "#/nota/" + alvo;
    }
    panStart = null;
    pinchStart = null;
  }
  canvas.addEventListener("pointerdown", onPointerDown);
  canvas.addEventListener("pointermove", onPointerMove);
  canvas.addEventListener("pointerup", onPointerUp);
  canvas.addEventListener("pointercancel", onPointerUp);
  canvas.addEventListener("pointerleave", function(){ hovered=null; tooltip.classList.add("hidden"); draw(); });

  function onWheel(e){
    e.preventDefault();
    var rect = canvas.getBoundingClientRect();
    var mx = e.clientX - rect.left, my = e.clientY - rect.top;
    var factor = Math.exp(-e.deltaY * 0.001);
    var novoK = Math.max(0.2, Math.min(4, transform.k * factor));
    transform.x = mx - (mx - transform.x) * (novoK / transform.k);
    transform.y = my - (my - transform.y) * (novoK / transform.k);
    transform.k = novoK;
    draw();
  }
  canvas.addEventListener("wheel", onWheel, {passive:false});

  draw();

  VIEW_CLEANUP = function(){
    simulation.stop();
    window.removeEventListener("resize", onResize);
    canvas.removeEventListener("pointerdown", onPointerDown);
    canvas.removeEventListener("pointermove", onPointerMove);
    canvas.removeEventListener("pointerup", onPointerUp);
    canvas.removeEventListener("pointercancel", onPointerUp);
    canvas.removeEventListener("wheel", onWheel);
  };
}

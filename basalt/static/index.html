    if(!alvoEl) return;
    if(previewTimerMostrar){ clearTimeout(previewTimerMostrar); previewTimerMostrar = null; }
    agendarEsconderPreview();
  });
}

async function viewGrafo(main){
  main.innerHTML =
    '<div class="view view-grafo"><div class="view-heading"><h1>' + t("Grafo") + '</h1></div>' +
    '<div class="grafo-controles"><input id="grafo-realce" type="text" placeholder="' + t("realçar por nome…") + '">' +
    '<div class="grafo-filtros" id="grafo-filtros"></div></div>' +
    '<div class="grafo-canvas-wrap"><canvas id="grafo-canvas"></canvas>' +
    '<div id="grafo-tooltip" class="grafo-tooltip hidden"></div>' +
    '<div id="grafo-estado" class="state-loading"><span class="spinner"></span>' + t("a carregar o grafo…") + '</div>' +
    "</div></div>";

  var canvas = document.getElementById("grafo-canvas");
  var wrap = document.querySelector(".grafo-canvas-wrap");
  var tooltip = document.getElementById("grafo-tooltip");
  var estadoEl = document.getElementById("grafo-estado");

  if(typeof d3 === "undefined" || !d3.forceSimulation){
    estadoEl.textContent = t("os scripts do grafo (d3) não carregaram.");
    estadoEl.classList.add("state-error-inline");
    return;
  }

  var dados;
  try{
    dados = await apiGet("/api/grafo");
  }catch(e){
    estadoEl.textContent = tf("não consegui carregar o grafo: {erro}", {erro: e.message});
    estadoEl.classList.add("state-error-inline");
    return;
  }
  estadoEl.remove();

  var tiposPresentes = Array.from(new Set(dados.nodes.map(function(n){ return n.tipo; })));
  var tiposActivos = new Set(tiposPresentes);
  var filtrosDiv = document.getElementById("grafo-filtros");
  filtrosDiv.innerHTML = tiposPresentes.map(function(t){
    return '<button class="tipo-chip active" type="button" data-tipo="' + escapeHtml(t) + '">' + escapeHtml(t) + "</button>";
  }).join("");
  filtrosDiv.querySelectorAll(".tipo-chip").forEach(function(btn){
    btn.addEventListener("click", function(){
      var t = btn.dataset.tipo;
      if(tiposActivos.has(t)){ tiposActivos.delete(t); btn.classList.remove("active"); }
      else{ tiposActivos.add(t); btn.classList.add("active"); }
      draw();
    });
  });

  var ctx = canvas.getContext("2d");
  var W = 0, H = 0;

  function resize(){
    var rect = wrap.getBoundingClientRect();
    W = rect.width; H = rect.height;
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();

  var nodes = dados.nodes.map(function(n){ return Object.assign({}, n); });
  var links = dados.links.map(function(l){ return Object.assign({}, l); });

  var CORES = {
    user: getCssVar("--tag-user"), feedback: getCssVar("--tag-feedback"),
    project: getCssVar("--tag-project"), reference: getCssVar("--tag-reference"),
    outros: getCssVar("--tag-outros"),
  };
  var corTexto = getCssVar("--text");
  function corDe(n){ return CORES[n.tipo] || CORES.outros; }
  function raio(n){ return Math.min(18, 4 + Math.sqrt(n.grau || 0) * 2.2); }

  var simulation = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id(function(d){ return d.id; }).distance(38).strength(0.35))
    .force("charge", d3.forceManyBody().strength(-60))
    .force("center", d3.forceCenter(W/2, H/2))
    .force("collide", d3.forceCollide(function(d){ return raio(d) + 3; }))
    .on("tick", draw);

  var transform = {x:0, y:0, k:1};
  var hovered = null;
  var realce = "";

  function draw(){
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    ctx.translate(transform.x, transform.y);
    ctx.scale(transform.k, transform.k);

    var visiveis = new Set(nodes.filter(function(n){ return tiposActivos.has(n.tipo); }).map(function(n){ return n.id; }));

    ctx.lineWidth = 1 / transform.k;
    for(var i=0;i<links.length;i++){
      var l = links[i], s = l.source, t = l.target;
      if(typeof s !== "object" || typeof t !== "object") continue;
      if(!visiveis.has(s.id) || !visiveis.has(t.id)) continue;
      var dimL = realce && s.id.indexOf(realce) === -1 && t.id.indexOf(realce) === -1;
      ctx.strokeStyle = dimL ? "rgba(128,128,128,0.08)" : "rgba(128,128,128,0.35)";
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(t.x, t.y);
      ctx.stroke();
    }
    for(var j=0;j<nodes.length;j++){
      var n = nodes[j];
      if(!visiveis.has(n.id)) continue;
      var r = raio(n);
      var matches = !!realce && n.id.toLowerCase().indexOf(realce) !== -1;
      var dim = !!realce && !matches;
      ctx.beginPath();
      ctx.arc(n.x, n.y, r, 0, Math.PI*2);
      ctx.globalAlpha = dim ? 0.15 : 1;
      ctx.fillStyle = corDe(n);
      ctx.fill();
      if(matches || n === hovered){
        ctx.lineWidth = 2 / transform.k;
        ctx.strokeStyle = corTexto;
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }

  var onResize = debounce(function(){ resize(); draw(); }, 150);
  window.addEventListener("resize", onResize);

  document.getElementById("grafo-realce").addEventListener("input", debounce(function(e){
    realce = e.target.value.trim().toLowerCase();
    draw();
  }, 150));

  var activePointers = new Map();
  var draggingNode = null, panStart = null, pinchStart = null;

  function toWorld(cx, cy){
    var rect = canvas.getBoundingClientRect();
    var x = cx - rect.left, y = cy - rect.top;
    return {x: (x - transform.x) / transform.k, y: (y - transform.y) / transform.k};
  }
  function nodeAt(cx, cy){
    var p = toWorld(cx, cy);
    var melhor = null, melhorD = Infinity;
    for(var i=0;i<nodes.length;i++){
      var n = nodes[i];
      if(!tiposActivos.has(n.tipo)) continue;
      var dx = n.x - p.x, dy = n.y - p.y;
      var d = Math.hypot(dx, dy);
      var r = raio(n) + 4;
      if(d <= r && d < melhorD){ melhor = n; melhorD = d; }
    }
    return melhor;
  }

  function onPointerDown(e){
    canvas.setPointerCapture(e.pointerId);
    activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(activePointers.size === 1){
      var n = nodeAt(e.clientX, e.clientY);
      if(n){
        draggingNode = n;
        n.fx = n.x; n.fy = n.y;
        simulation.alphaTarget(0.3).restart();
      }else{
        panStart = {x:e.clientX, y:e.clientY, tx:transform.x, ty:transform.y};
      }
    }else if(activePointers.size === 2){
      if(draggingNode){ draggingNode.fx = null; draggingNode.fy = null; simulation.alphaTarget(0); draggingNode = null; }
      var pts = Array.from(activePointers.values());
      pinchStart = {
        dist: Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y),
        k: transform.k, tx: transform.x, ty: transform.y,
      };
    }
  }
  function onPointerMove(e){
    if(activePointers.has(e.pointerId)) activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(draggingNode && activePointers.size === 1){
      var p = toWorld(e.clientX, e.clientY);
      draggingNode.fx = p.x; draggingNode.fy = p.y;
      return;
    }
    if(activePointers.size === 2 && pinchStart){
      var pts = Array.from(activePointers.values());
      var dist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
      var k = Math.max(0.2, Math.min(4, pinchStart.k * (dist / (pinchStart.dist || 1))));
      transform.k = k; transform.x = pinchStart.tx; transform.y = pinchStart.ty;
      draw();
      return;
    }
    if(panStart && activePointers.size === 1){
      transform.x = panStart.tx + (e.clientX - panStart.x);
      transform.y = panStart.ty + (e.clientY - panStart.y);
      draw();
      return;
    }
    var hn = nodeAt(e.clientX, e.clientY);
    if(hn !== hovered){ hovered = hn; draw(); }
    if(hn){
      var rect = canvas.getBoundingClientRect();
      tooltip.textContent = hn.id;
      tooltip.style.left = (e.clientX - rect.left + 12) + "px";
      tooltip.style.top = (e.clientY - rect.top + 12) + "px";
      tooltip.classList.remove("hidden");
      canvas.style.cursor = "pointer";
    }else{
      tooltip.classList.add("hidden");
      canvas.style.cursor = panStart ? "grabbing" : "grab";
    }
  }
  function onPointerUp(e){
    var start = activePointers.get(e.pointerId);
    activePointers.delete(e.pointerId);
    if(draggingNode && activePointers.size === 0){
      var moved = start && (Math.abs(e.clientX-start.x) + Math.abs(e.clientY-start.y) > 4);
      draggingNode.fx = null; draggingNode.fy = null;
      simulation.alphaTarget(0);
      var alvo = draggingNode.id;
      draggingNode = null;
      if(!moved) location.hash = "#/nota/" + alvo;
    }
    panStart = null;
    pinchStart = null;
  }
  canvas.addEventListener("pointerdown", onPointerDown);
  canvas.addEventListener("pointermove", onPointerMove);
  canvas.addEventListener("pointerup", onPointerUp);
  canvas.addEventListener("pointercancel", onPointerUp);
  canvas.addEventListener("pointerleave", function(){ hovered=null; tooltip.classList.add("hidden"); draw(); });

  function onWheel(e){
    e.preventDefault();
    var rect = canvas.getBoundingClientRect();
    var mx = e.clientX - rect.left, my = e.clientY - rect.top;
    var factor = Math.exp(-e.deltaY * 0.001);
    var novoK = Math.max(0.2, Math.min(4, transform.k * factor));
    transform.x = mx - (mx - transform.x) * (novoK / transform.k);
    transform.y = my - (my - transform.y) * (novoK / transform.k);
    transform.k = novoK;
    draw();
  }
  canvas.addEventListener("wheel", onWheel, {passive:false});

  draw();

  VIEW_CLEANUP = function(){
    simulation.stop();
    window.removeEventListener("resize", onResize);
    canvas.removeEventListener("pointerdown", onPointerDown);
    canvas.removeEventListener("pointermove", onPointerMove);
    canvas.removeEventListener("pointerup", onPointerUp);
    canvas.removeEventListener("pointercancel", onPointerUp);
    canvas.removeEventListener("wheel", onWheel);
  };
}

function ajudaPaginaAtual(){
  var parts = parseHash();
  var rota = parts[0] || "";
  if(rota === "") return "inicio";
  if(rota === "notas" || rota === "nota" || rota === "categoria") return "notas";
  return AJUDA[rota] ? rota : "inicio";
}

function ajudaElementoVisivel(el){
  if(!el) return false;
  var r = el.getBoundingClientRect();
  if(r.width <= 0 && r.height <= 0) return false;
  var estilo = getComputedStyle(el);
  if(estilo.visibility === "hidden" || estilo.display === "none") return false;
  if(r.bottom < 0 || r.top > window.innerHeight || r.right < 0 || r.left > window.innerWidth) return false;
  return true;
}

function ajudaItensVisiveis(){
  var chave = ajudaPaginaAtual();
  var lista = (AJUDA._barra || []).concat(AJUDA[chave] || []);
  var vistos = {};   // não repetir o mesmo seletor duas vezes (ex.: menu que existe em #topnav e #tabbar)
  var itens = [];
  lista.forEach(function(def){
    if(vistos[def.sel]) return;
    var el;
    try{ el = document.querySelector(def.sel); }catch(e){ el = null; }
    if(ajudaElementoVisivel(el)){ vistos[def.sel] = true; itens.push({def: def, el: el}); }
  });
  return itens;
}

function ajudaConstruirLista(itens){
  return itens.map(function(it, i){
    return '<li class="ajuda-item" data-i="' + i + '"><span class="ajuda-num">' + (i + 1) + "</span>" +
      "<div><strong>" + escapeHtml(it.def.nome) + "</strong><p>" + escapeHtml(it.def.texto) + "</p></div></li>";
  }).join("");
}

function ajudaPosicionarCaixas(){
  var caixas = document.getElementById("ajuda-caixas");
  if(!caixas) return;
  var html = "";
  AJUDA_ITENS_ACTUAIS.forEach(function(it, i){
    var r = it.el.getBoundingClientRect();
    html += '<div class="ajuda-caixa" style="left:' + Math.round(r.left) + "px;top:" + Math.round(r.top) +
      "px;width:" + Math.round(r.width) + "px;height:" + Math.round(r.height) + 'px"></div>';
    var bx = Math.min(window.innerWidth - 24, Math.max(4, r.right - 12));
    var by = Math.min(window.innerHeight - 24, Math.max(4, r.top - 12));
    html += '<div class="ajuda-bolha" style="left:' + Math.round(bx) + "px;top:" + Math.round(by) + 'px">' + (i + 1) + "</div>";
  });
  caixas.innerHTML = html;
}

function ajudaReconstruir(){
  if(!AJUDA_ABERTA) return;
  AJUDA_ITENS_ACTUAIS = ajudaItensVisiveis();
  if(!AJUDA_ITENS_ACTUAIS.length){
    fecharAjuda();
    showToast(t("nada para explicar aqui."));
    return;
  }
  var lista = document.getElementById("ajuda-lista");
  if(lista){
    lista.innerHTML = ajudaConstruirLista(AJUDA_ITENS_ACTUAIS);
    lista.querySelectorAll(".ajuda-item").forEach(function(li){
      li.addEventListener("click", function(){
        var it = AJUDA_ITENS_ACTUAIS[+li.dataset.i];
        if(it && it.el) it.el.scrollIntoView({behavior: "smooth", block: "center"});
      });
    });
  }
  ajudaPosicionarCaixas();
}
var ajudaReconstruirDebounced = debounce(ajudaReconstruir, 120);

function ajudaEscHandler(e){ if(e.key === "Escape") fecharAjuda(); }

function abrirAjuda(){
  if(AJUDA_ABERTA) return;
  var itens = ajudaItensVisiveis();
  if(!itens.length){ showToast(t("nada para explicar aqui.")); return; }
  AJUDA_ITENS_ACTUAIS = itens;
  AJUDA_ABERTA = true;
  var root = document.getElementById("ajuda-root");
  root.innerHTML =
    '<div id="ajuda-fundo"></div>' +
    '<div id="ajuda-caixas"></div>' +
    '<aside id="ajuda-painel" role="region" aria-label="' + t("Ajuda desta página") + '">' +
      '<div class="ajuda-painel-topo"><h2>' + t("Ajuda desta página") + '</h2>' +
        '<button id="ajuda-fechar" class="btn" type="button">' + t("Fechar") + '</button></div>' +
      '<ol id="ajuda-lista" class="ajuda-lista"></ol>' +
    "</aside>";
  document.getElementById("ajuda-fundo").addEventListener("click", fecharAjuda);
  document.getElementById("ajuda-fechar").addEventListener("click", fecharAjuda);
  var btn = document.getElementById("ajuda-btn");
  if(btn) btn.setAttribute("aria-pressed", "true");
  document.addEventListener("keydown", ajudaEscHandler);
  window.addEventListener("resize", ajudaReconstruirDebounced);
  ajudaReconstruir();
}

function fecharAjuda(){
  if(!AJUDA_ABERTA) return;
  AJUDA_ABERTA = false;
  AJUDA_ITENS_ACTUAIS = [];
  var root = document.getElementById("ajuda-root");
  if(root) root.innerHTML = "";
  var btn = document.getElementById("ajuda-btn");
  if(btn) btn.setAttribute("aria-pressed", "false");
  document.removeEventListener("keydown", ajudaEscHandler);
  window.removeEventListener("resize", ajudaReconstruirDebounced);
}

function initAjuda(){
  var btn = document.getElementById("ajuda-btn");
  if(btn) btn.addEventListener("click", function(){ if(AJUDA_ABERTA) fecharAjuda(); else abrirAjuda(); });
  window.addEventListener("hashchange", function(){ if(AJUDA_ABERTA) fecharAjuda(); });
}

function registarServiceWorker(){
  if(!("serviceWorker" in navigator)) return;
  navigator.serviceWorker.register("/sw.js").catch(function(){
    // offline "razoável" é uma mais-valia, não um requisito — falhar aqui não deve partir a app
  });
  // ronda 9 (achado 2 da ronda 7): um service worker novo assumiu esta página. Se responde com OUTRO protocolo (certo, não por falta
  // de resposta), esta página e ele não falam a mesma língua sobre a cópia → recarrega uma vez; com alterações por gravar
  // no editor, só avisa. Sem resposta não se faz nada.
  var tinha = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", async function(){
    if(!tinha){ tinha = true; return; }                     // a 1.ª vez que um service worker controla: nada a acertar
    var sw = navigator.serviceWorker.controller;
    if(!sw) return;
    var p = await perguntarProtocolo(sw, 5000);
    if(p === 0 || p === PROTOCOLO_COPIA) return;
    var dirty = document.querySelector("#ed-dirty-marca");
    var porGravar = !!(dirty && dirty.textContent.trim());
    var ja = ""; try{ ja = sessionStorage.getItem("basalt-recarga-sw") || ""; }catch(e){}
    if(porGravar || ja === String(p)){
      showToast(t("a app foi actualizada — grava o que tens e recarrega a página."));
      return;
    }
    try{ sessionStorage.setItem("basalt-recarga-sw", String(p)); }catch(e){}
    location.reload();
  });
}

<script>
/* Quem sou eu (/api/eu): só no modo «senha» aparece o botão «Terminar sessão». Em «cabecalho» o início de sessão é do
   proxy à frente e em «aberto» não há sessão. Falhar aqui não estraga nada: o botão fica escondido. */
(function(){
  fetch("/api/eu", {credentials:"same-origin", cache:"no-store"}).then(function(r){ return r.ok ? r.json() : null; }).then(function(eu){
    if(!eu) return;
    window.BASALT_EU = eu;
    var b = document.getElementById("sair-btn");
    if(!b || eu.modo !== "senha") return;
    b.hidden = false;
    b.title = window.basaltTf("Terminar sessão ({quem})", {quem: eu.nome || eu.email});
    b.addEventListener("click", function(){
      b.disabled = true;
      // ronda 8: antes de sair, a cópia deste browser deixa de ser desta conta (o que estava por enviar fica guardado à parte)
      Promise.resolve(window.basaltAntesDeSair ? window.basaltAntesDeSair() : null).catch(function(){}).then(function(){
        return fetch("/api/sair", {method:"POST", credentials:"same-origin", headers:{"X-Basalt":"1"}});
      }).catch(function(){}).then(function(){ location.href = "/entrar"; });
    });
  }).catch(function(){});
})();
</script>

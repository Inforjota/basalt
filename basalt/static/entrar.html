<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Basalt — entrar</title>
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="theme-color" content="#171a21">
<style>
/* PORTE: página autónoma (CSS e JS inline, sem recursos externos). Em português, ou em inglês quando o servidor a serve com
   lang="en" ([basalt] idioma); mesmas cores da interface. */
:root{
  --bg:#0f1115; --bg-elev:#171a21; --bg-elev2:#1e222b;
  --text:#e8eaed; --text-dim:#9aa2af; --border:#2a2f3a;
  --accent:#6ea8fe; --accent-strong:#4c8dff; --accent-text:#04121f; --erro:#ff8a8a;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f5f6f8; --bg-elev:#ffffff; --bg-elev2:#eef0f4; --text:#1b1f27; --text-dim:#5c6573; --border:#d6dae1;
         --accent:#2c64c8; --accent-strong:#1f4fa8; --accent-text:#ffffff; --erro:#b3261e; }
}
*{ box-sizing:border-box; }
html,body{ margin:0; min-height:100%; }
body{ background:var(--bg); color:var(--text); display:flex; align-items:center; justify-content:center; min-height:100vh;
      font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; padding:16px; }
main{ width:100%; max-width:360px; background:var(--bg-elev); border:1px solid var(--border); border-radius:12px; padding:28px 24px; }
h1{ margin:0 0 4px; font-size:1.5em; }
p.sub{ margin:0 0 20px; color:var(--text-dim); font-size:.95em; }
label{ display:block; margin:14px 0 4px; font-size:.9em; color:var(--text-dim); }
input{ width:100%; padding:10px 12px; font:inherit; color:var(--text); background:var(--bg-elev2); border:1px solid var(--border); border-radius:8px; }
input:focus{ outline:2px solid var(--accent); outline-offset:1px; }
button{ width:100%; margin-top:20px; padding:11px 14px; font:inherit; font-weight:600; color:var(--accent-text); background:var(--accent);
        border:0; border-radius:8px; cursor:pointer; }
button:hover{ background:var(--accent-strong); }
button[disabled]{ opacity:.6; cursor:default; }
#erro{ min-height:1.4em; margin:14px 0 0; color:var(--erro); font-size:.9em; }
</style>
</head>
<body>
<main>
  <h1>Basalt</h1>
  <p class="sub">Entra para abrires as tuas notas.</p>
  <form id="f" autocomplete="on">
    <label for="email">E-mail</label>
    <input id="email" name="email" type="email" autocomplete="username" required autofocus>
    <label for="senha">Palavra-passe</label>
    <input id="senha" name="senha" type="password" autocomplete="current-password" required>
    <button id="ok" type="submit">Entrar</button>
    <p id="erro" role="alert" aria-live="polite"></p>
  </form>
</main>
<script>
(function(){
  // idioma: o servidor põe lang="en" quando [basalt] idioma = en (ou auto + Accept-Language); o resto é este dicionário.
  var EN = {"Basalt — entrar": "Basalt — sign in", "Entra para abrires as tuas notas.": "Sign in to open your notes.",
            "Palavra-passe": "Password", "Entrar": "Sign in", "Não foi possível entrar.": "Could not sign in.",
            "Sem ligação ao servidor. Tenta outra vez.": "No connection to the server. Try again.",
            "E-mail ou senha errados.": "Wrong e-mail or password.", "Precisas de entrar.": "You need to sign in."};
  var EM_INGLES = document.documentElement.lang === "en";
  function t(s){
    if(!EM_INGLES || !s) return s;
    if(EN[s]) return EN[s];
    var m = /^Demasiadas tentativas; espera (\d+) minutos\.$/.exec(s);     // mensagem do servidor com número
    return m ? "Too many attempts; wait " + m[1] + " minutes." : s;
  }
  if(EM_INGLES){
    document.title = t(document.title);
    ["p.sub", "label[for=senha]", "#ok"].forEach(function(sel){ var el = document.querySelector(sel); el.textContent = t(el.textContent); });
  }
  var f = document.getElementById("f"), erro = document.getElementById("erro"), ok = document.getElementById("ok");
  f.addEventListener("submit", function(ev){
    ev.preventDefault();
    erro.textContent = ""; ok.disabled = true;
    fetch("/api/entrar", {
      method: "POST", credentials: "same-origin",
      headers: {"Content-Type": "application/json", "X-Basalt": "1"},
      body: JSON.stringify({email: document.getElementById("email").value, senha: document.getElementById("senha").value})
    }).then(function(r){
      return r.json().catch(function(){ return {}; }).then(function(d){ return {ok: r.ok, d: d}; });
    }).then(function(x){
      if(x.ok){ location.href = "/"; return; }
      erro.textContent = t((x.d && x.d.erro) || "Não foi possível entrar.");
      ok.disabled = false;
    }).catch(function(){
      erro.textContent = t("Sem ligação ao servidor. Tenta outra vez.");
      ok.disabled = false;
    });
  });
})();
</script>
</body>
</html>

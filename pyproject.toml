[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "basalt-notas"
version = "1.0.0b1"
description = "As tuas notas, com memória: cofre Markdown (Obsidian) com pesquisa por significado, Entrada que se arruma sozinha e agentes de IA que nunca sobrepõem o que escreveste."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENCA"}
authors = [{name = "José Quadros"}]
keywords = ["notas", "obsidian", "markdown", "mcp", "memoria", "pkm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business",
]
dependencies = []

[project.optional-dependencies]
semantica = ["numpy>=1.24"]
testes = ["pytest>=7"]

[project.scripts]
basalt = "basalt.__main__:main"

[tool.setuptools]
packages = ["basalt"]

[tool.setuptools.package-data]
# a interface vive em basalt/static/ (com subpastas: vendor/, vendor/katex/fonts/…); `**` apanha toda a árvore
basalt = ["static/*", "static/**/*", "basalt.toml.exemplo"]

[tool.pytest.ini_options]
testpaths = ["testes"]
addopts = "-q -p no:cacheprovider"
